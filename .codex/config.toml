# Codex CLI — MCP servers for this project.
#
# Codex loads this file for trusted projects. For a global fallback, either
# paste these tables into ~/.codex/config.toml or run:
#        codex mcp add headroom -- bash scripts/agent-mcp-headroom.sh
#        codex mcp add gbrain   -- bash scripts/agent-mcp-gbrain.sh
#        codex mcp add serena   -- bash scripts/agent-mcp-serena.sh
#
# serena:   semantic code retrieval/editing through language servers, no keys
#           (scripts/agent-mcp-serena.sh fails closed if binary missing).
# headroom: local token compression, no API keys
#           (scripts/agent-mcp-headroom.sh fails closed if binary missing).
# gbrain:   knowledge-graph memory via shared launcher (fails closed without binary
#           or initialized provider). Run `gbrain init`; local Ollama stays local,
#           while API-key providers receive embedding/query text. See AUTH.md.

[mcp_servers.headroom]
command = "bash"
args = ["scripts/agent-mcp-headroom.sh"]
startup_timeout_sec = 30

[mcp_servers.gbrain]
command = "bash"
args = ["scripts/agent-mcp-gbrain.sh"]
startup_timeout_sec = 30

[mcp_servers.serena]
command = "bash"
args = ["scripts/agent-mcp-serena.sh"]
startup_timeout_sec = 30
