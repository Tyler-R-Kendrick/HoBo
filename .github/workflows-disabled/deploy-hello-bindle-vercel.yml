name: Deploy hello-bindle (Vercel)

# Real continuous-deploy path for the committed Vercel deploy fixture
# (packages/hobo/fixtures/deploy/vercel). This runs in CI with a repo secret,
# so it is NOT subject to any interactive/agent action gate — the only thing
# needed to go live is a `VERCEL_TOKEN` secret (Settings → Secrets → Actions).
#
# Manual only: pick preview (default) or production.

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Deployment target"
        type: choice
        options: [preview, production]
        default: preview

permissions:
  contents: read

concurrency:
  group: deploy-hello-bindle-vercel
  cancel-in-progress: false

jobs:
  deploy:
    # Hosted Actions runners are disabled until explicitly re-enabled.
    if: ${{ false }}
    name: Deploy hello-bindle to Vercel
    runs-on: ${{ vars.HOBO_RUNNER_LINUX_SMALL || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Deploy to Vercel
        working-directory: packages/hobo/fixtures/deploy/vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "::error::VERCEL_TOKEN secret is not set. Add it under Settings → Secrets and variables → Actions, then re-run." >&2
            exit 1
          fi
          PROD_FLAG=""
          if [ "${TARGET}" = "production" ]; then PROD_FLAG="--prod"; fi
          URL="$(npx --yes vercel@latest deploy --yes ${PROD_FLAG} --token "${VERCEL_TOKEN}")"
          echo "Deployed: ${URL}"
          {
            echo "### hello-bindle deployed (${TARGET})"
            echo ""
            echo "- App: ${URL}"
            echo "- API: ${URL}/hello?name=world"
          } >> "${GITHUB_STEP_SUMMARY}"
