name: HoBo CI Fixture Lanes

# Cost-gated cloud fixture lanes, split out of hobo-ci.yml so that adding a
# label re-runs only these jobs instead of the whole PR gate. Jobs keep the
# same names, label gates, and if: always() teardown/sweep semantics.
#
# The hello-bindle lanes migrated to examples-e2e.yml (packages/ci-guard
# runners); only the multi-cloud lanes remain here.

on:
  pull_request:
    branches: [main]
    types: [labeled]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  multi-cloud-shop-fixture:
    name: multi-cloud-shop provider fixture
    # Hosted Actions runners are disabled until explicitly re-enabled.
    if: ${{ false }}
    runs-on: ${{ vars.HOBO_RUNNER_LINUX_SMALL || 'ubuntu-latest' }}
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: multi-cloud-shop-fixture-${{ github.ref }}
      cancel-in-progress: false
    env:
      HOBO_E2E_FIXTURE: examples/multi-cloud-shop
      HOBO_E2E_PROVIDERS: aws,azure
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable pnpm
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --config.confirmModulesPurge=false
      - name: Deploy same Bindle to AWS and Azure
        run: node --import tsx src/draft/technical-proofs/multi-cloud-shop-provider-e2e-contract/scripts/run-multi-cloud-shop-e2e-fixture.ts --phase deploy-and-assert --run-id "${{ github.run_id }}"
      - name: Tear down multi-cloud-shop fixture
        if: always()
        run: node --import tsx src/draft/technical-proofs/multi-cloud-shop-provider-e2e-contract/scripts/run-multi-cloud-shop-e2e-fixture.ts --phase teardown --run-id "${{ github.run_id }}"
      - name: Sweep orphaned multi-cloud-shop fixtures
        if: always()
        run: node --import tsx src/draft/technical-proofs/multi-cloud-shop-provider-e2e-contract/scripts/run-multi-cloud-shop-e2e-fixture.ts --phase sweep-orphans

  s4-stage-gate-drill:
    name: S4 stage gate multi-cloud drill
    # Hosted Actions runners are disabled until explicitly re-enabled.
    if: ${{ false }}
    runs-on: ${{ vars.HOBO_RUNNER_LINUX_SMALL || 'ubuntu-latest' }}
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: s4-stage-gate-drill-${{ github.ref }}
      cancel-in-progress: false
    env:
      HOBO_E2E_FIXTURE: examples/multi-cloud-shop
      HOBO_E2E_PROVIDERS: aws,azure
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable pnpm
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --config.confirmModulesPurge=false
      - name: Run S4 stage gate drill
        run: node --import tsx src/draft/technical-proofs/s4-stage-gate-multi-cloud-contract/scripts/run-s4-stage-gate-drill.ts --phase deploy-and-assert --run-id "${{ github.run_id }}"
      - name: Tear down S4 stage gate drill
        if: always()
        run: node --import tsx src/draft/technical-proofs/s4-stage-gate-multi-cloud-contract/scripts/run-s4-stage-gate-drill.ts --phase teardown --run-id "${{ github.run_id }}"
      - name: Sweep orphaned S4 stage gate fixtures
        if: always()
        run: node --import tsx src/draft/technical-proofs/s4-stage-gate-multi-cloud-contract/scripts/run-s4-stage-gate-drill.ts --phase sweep-orphans
