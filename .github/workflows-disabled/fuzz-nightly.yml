name: HoBo fuzz nightly

on:
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz-nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  property-and-harness:
    # Hosted Actions runners are disabled until explicitly re-enabled.
    if: ${{ false }}
    name: fast-check and Jazzer smoke
    runs-on: ${{ vars.HOBO_RUNNER_LINUX_SMALL || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable pnpm
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --config.confirmModulesPurge=false
      - name: Bounded property oracles
        run: pnpm run test:property
      - name: Serialized-input harness smoke
        run: pnpm run test:fuzz

  docker-gated:
    # Hosted Actions runners are disabled until explicitly re-enabled.
    if: ${{ false }}
    name: RESTler Toxiproxy plan
    runs-on: ${{ vars.HOBO_RUNNER_LINUX_SMALL || 'ubuntu-latest' }}
    timeout-minutes: 15
    env:
      HOBO_FUZZ_DOCKER: "0"
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable pnpm
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --config.confirmModulesPurge=false
      - name: Print nightly plan (skip without Docker)
        run: pnpm run test:fuzz:nightly
      - name: Optional Schemathesis
        run: |
          if command -v schemathesis >/dev/null 2>&1 && [ -n "${HOBO_FUZZ_API_URL:-}" ]; then
            schemathesis run "${HOBO_FUZZ_API_URL%/}/v1/openapi.json" --url "$HOBO_FUZZ_API_URL"
          else
            echo "schemathesis skipped (binary or HOBO_FUZZ_API_URL missing)"
          fi
