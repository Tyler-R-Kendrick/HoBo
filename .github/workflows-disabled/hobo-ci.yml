name: HoBo CI Fabric

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  merge_group:
    branches: [main]
    types: [checks_requested]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  artifact-trust:
    # Hosted Actions runners are disabled until explicitly re-enabled.
    if: ${{ false }}
    name: artifact signing and install verification
    needs: pr-gate
    runs-on: ${{ vars.HOBO_RUNNER_LINUX_SMALL || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: corepack enable pnpm
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --config.confirmModulesPurge=false
      - name: Verify signed hello-bindle and refuse stripped signatures
        run: pnpm test:file src/draft/technical-proofs/componentize-artifact-trust-contract/test/publish-verify.test.ts

  pr-gate:
    name: PR impact gate
    # The weekly schedule exists for main-gate and the fixture lanes; a
    # scheduled pr-gate diffs main against itself and checks nothing.
    # Hosted Actions runners are disabled until explicitly re-enabled.
    if: ${{ false }}
    runs-on: ${{ vars.HOBO_RUNNER_LINUX_SMALL || 'ubuntu-latest' }}
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - run: corepack enable pnpm
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-
      - name: Check the sibling pins (gitlink against checkout, offline)
        run: node --experimental-strip-types scripts/bootstrap-siblings.mts --status --offline
      - run: pnpm install --frozen-lockfile --config.confirmModulesPurge=false
      - name: Every name HoBo imports from ts-autocode exists at the pin
        run: node --import tsx --test scripts/test/ts-autocode-consumer-surface.test.ts
      - name: Fetch base branch for Turbo affected
        run: git fetch origin "${{ github.event_name == 'pull_request' && github.base_ref || 'main' }}"
      - uses: cue-lang/setup-cue@v1.0.0
        with:
          version: v0.14.0
      # Inbound=outbound licensing: every commit on a PR carries a DCO
      # sign-off (CONTRIBUTING.md, docs/plans/0009-legal-compliance-audit.md
      # finding 7). Advisory for now so existing branches are not stranded;
      # flip continue-on-error off once contributors are signing off.
      - name: DCO sign-off check
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          DCO_BASE: origin/${{ github.base_ref }}
        run: |
          missing=0
          while read -r sha; do
            [ -z "$sha" ] && continue
            author="$(git show -s --format='%an <%ae>' "$sha")"
            if ! git show -s --format='%B' "$sha" | grep -qiF "Signed-off-by: $author"; then
              echo "::warning::missing or mismatched DCO sign-off on $(git show -s --format='%h %s' "$sha") (expected 'Signed-off-by: $author')"
              missing=$((missing + 1))
            fi
          done < <(git rev-list "${DCO_BASE}..HEAD")
          if [ "$missing" -gt 0 ]; then
            echo "$missing commit(s) without a matching DCO sign-off. Fix with: git rebase --signoff ${DCO_BASE}"
            exit 1
          fi
          echo "All commits carry a matching DCO sign-off."

      - name: Code format gate
        run: pnpm run lint:code
      - name: Relevant checks only
        run: pnpm agent:check -- --base=${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'origin/main' }}
      - name: Affected package lanes
        env:
          TURBO_SCM_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'origin/main' }}
        run: |
          mapfile -t PKG_FILTERS < <(
            git diff --name-only "${TURBO_SCM_BASE}"...HEAD \
              | rg '^packages/([^/]+)/' -or '$1' \
              | sort -u \
              | sed 's|^|--filter=./packages/|'
          )
          mapfile -t EX_FILTERS < <(
            git diff --name-only "${TURBO_SCM_BASE}"...HEAD \
              | rg '^examples/([^/]+)/' -or '$1' \
              | sort -u \
              | sed 's|^|--filter=./examples/|'
          )
          FILTERS=("${PKG_FILTERS[@]}" "${EX_FILTERS[@]}")
          if [ "${#FILTERS[@]}" -eq 0 ]; then
            echo "No production package or example paths changed; skipping turbo impact lanes"
            exit 0
          fi
          pnpm exec turbo run build typecheck lint test:unit test:schema test:contract:consumer \
            "${FILTERS[@]}" \
            --continue=never --concurrency=100%
      - name: Production packages gate
        run: pnpm run build:packages

  main-gate:
    name: Main full gate
    # Full gate on path into main and already on main: merge queue, direct push
    # to main, weekly schedule, and manual dispatch. PR events stay on pr-gate.
    # Hosted Actions runners are disabled until explicitly re-enabled.
    if: ${{ false }}
    runs-on: ${{ vars.HOBO_RUNNER_LINUX_SMALL || 'ubuntu-latest' }}
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - run: corepack enable pnpm
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile --config.confirmModulesPurge=false
      - name: Full S0 gate set
        run: pnpm run check:all
      - name: Architecture guard (full repo)
        # A fresh checkout has no diff; the bare diff-mode invocation would
        # pass vacuously here. --all evaluates every production package.
        run: pnpm run architecture:guard:all
      - name: Full workspace tests
        run: pnpm exec turbo run test --concurrency=100%

  dev-cold-loop-gate:
    # Hosted Actions runners are disabled until explicitly re-enabled.
    if: ${{ false }}
    name: hobo dev cold loop (offline <=60s)
    needs: pr-gate
    runs-on: ${{ vars.HOBO_RUNNER_LINUX_SMALL || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: corepack enable pnpm
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --config.confirmModulesPurge=false
      - name: Cold hobo dev gate (network disabled)
        run: |
          docker run --rm --network=none \
            -v "$PWD:/workspace" -w /workspace \
            node:24-bookworm \
            node --import tsx scripts/ci/dev-cold-loop-timing.mts

  ci-guard:
    # Hosted Actions runners are disabled until explicitly re-enabled.
    if: ${{ false }}
    name: CI fabric contract guard
    runs-on: ${{ vars.HOBO_RUNNER_LINUX_SMALL || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: corepack enable pnpm
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --config.confirmModulesPurge=false
      - name: Assert CI fabric contract
        run: node --import tsx packages/ci-guard/bin/assert-ci-contract.ts

  secret-scan:
    # Hosted Actions runners are disabled until explicitly re-enabled.
    if: ${{ false }}
    name: Secret scan
    runs-on: ${{ vars.HOBO_RUNNER_LINUX_SMALL || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
