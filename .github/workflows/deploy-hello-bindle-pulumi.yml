name: Deploy hello-bindle (Pulumi live)

# The LIVE Pulumi lane (docs/plans/0006 item 3-2): the real pinned `pulumi`
# CLI engine drives the same @hobo/iac-pulumi adapter the composed deploy path
# uses, against real Cloudflare. Manual only; requires CLOUDFLARE_API_TOKEN +
# CLOUDFLARE_ACCOUNT_ID secrets (Settings → Secrets → Actions). Teardown runs
# even when apply fails.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-hello-bindle-pulumi
  cancel-in-progress: false

jobs:
  pulumi-live:
    name: Pulumi live preview/apply/refresh/destroy
    runs-on: ${{ vars.HOBO_RUNNER_LINUX_SMALL || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable pnpm
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --config.confirmModulesPurge=false
      - name: Install pinned Pulumi CLI
        run: |
          curl -fsSL https://get.pulumi.com | sh -s -- --version 3.130.0
          echo "$HOME/.pulumi/bin" >> "$GITHUB_PATH"
      - name: Run the live lane (preview → apply → refresh → destroy)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HOBO_PULUMI_LIVE: "1"
        run: node --import tsx scripts/ci/run-pulumi-live-lane.mts
