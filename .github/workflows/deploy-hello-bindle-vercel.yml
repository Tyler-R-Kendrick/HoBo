name: Deploy hello-bindle (Vercel)

# Real continuous-deploy path for the committed Vercel deploy fixture
# (packages/hobo/fixtures/deploy/vercel). This runs in CI with a repo secret,
# so it is NOT subject to any interactive/agent action gate — the only thing
# needed to go live is a `VERCEL_TOKEN` secret (Settings → Secrets → Actions).
#
# Manual only: pick preview (default) or production.

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Deployment target"
        type: choice
        options: [preview, production]
        default: preview

permissions:
  contents: read

concurrency:
  group: deploy-hello-bindle-vercel
  cancel-in-progress: false

jobs:
  deploy:
    # Hosted Actions runners are disabled until explicitly re-enabled.
    if: ${{ false }}