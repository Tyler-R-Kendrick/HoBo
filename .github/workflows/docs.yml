name: Docs

on:
  pull_request:
    paths:
      - "docs/**"
      - "README.md"
      - "AGENTS.md"
      - ".github/workflows/docs.yml"
      - ".github/workflows/hobo-ci.yml"
      - "scripts/check-*-docs.ts"
      - "scripts/check-docs-*.ts"
      - "scripts/run-linters.ts"
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "README.md"
      - "AGENTS.md"
      - ".github/workflows/docs.yml"
      - ".github/workflows/hobo-ci.yml"
      - "scripts/check-*-docs.ts"
      - "scripts/check-docs-*.ts"
      - "scripts/run-linters.ts"

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: corepack enable pnpm
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --config.confirmModulesPurge=false
      - run: pnpm run lint:docs:changed -- --base=${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD~1' }}
      - run: pnpm run docs:freshness -- --base=${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD~1' }}
