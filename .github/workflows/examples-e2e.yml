name: HoBo Examples E2E

on:
  pull_request:
    branches: [main]
    types: [labeled]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hello-bindle-fixture:
    name: hello-bindle sandbox fixture (simulate)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      contains(github.event.pull_request.labels.*.name, 'hobo/e2e')
    runs-on: hobo
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: hello-bindle-fixture-${{ github.ref }}
      cancel-in-progress: false
    env:
      HOBO_SANDBOX_CLOUD_AUDIENCE: hobo:sandbox-cloud
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: recursive
      - run: corepack enable pnpm
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --config.confirmModulesPurge=false
      - name: Assert keyless CI contract
        run: node --import tsx packages/ci-guard/bin/assert-ci-contract.ts
      - name: Deploy and assert hello-bindle fixture
        run: node --import tsx packages/ci-guard/bin/run-example-fixture.ts --fixture examples/hello-bindle --phase deploy-and-assert --run-id "${{ github.run_id }}"
      - name: Tear down hello-bindle fixture
        if: always()
        run: node --import tsx packages/ci-guard/bin/run-example-fixture.ts --fixture examples/hello-bindle --phase teardown --run-id "${{ github.run_id }}"
      - name: Sweep orphaned hello-bindle fixtures
        if: always()
        run: node --import tsx packages/ci-guard/bin/run-example-fixture.ts --fixture examples/hello-bindle --phase sweep-orphans --run-id "${{ github.run_id }}"

  hello-bindle-fixture-quarantine:
    name: hello-bindle fixture quarantine (simulate)
    if: >-
      github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'hobo/e2e-quarantine')
    runs-on: hobo
    timeout-minutes: 20
    continue-on-error: true
    permissions:
      contents: read
      id-token: write
    env:
      HOBO_SANDBOX_CLOUD_AUDIENCE: hobo:sandbox-cloud
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: recursive
      - run: corepack enable pnpm
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --config.confirmModulesPurge=false
      - name: Assert keyless CI contract
        run: node --import tsx packages/ci-guard/bin/assert-ci-contract.ts
      - name: Run quarantine fixture lane
        run: node --import tsx packages/ci-guard/bin/run-example-fixture.ts --fixture examples/hello-bindle --phase deploy-and-assert --run-id "${{ github.run_id }}-quarantine"
      - name: Tear down quarantine fixture
        if: always()
        run: node --import tsx packages/ci-guard/bin/run-example-fixture.ts --fixture examples/hello-bindle --phase teardown --run-id "${{ github.run_id }}-quarantine"
      - name: Sweep orphaned quarantine fixtures
        if: always()
        run: node --import tsx packages/ci-guard/bin/run-example-fixture.ts --fixture examples/hello-bindle --phase sweep-orphans --run-id "${{ github.run_id }}-quarantine"
