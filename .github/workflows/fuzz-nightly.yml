name: HoBo fuzz nightly

on:
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz-nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  property-and-harness:
    # Hosted Actions runners are disabled until explicitly re-enabled.
    if: ${{ false }}
  docker-gated:
    # Hosted Actions runners are disabled until explicitly re-enabled.
    if: ${{ false }}