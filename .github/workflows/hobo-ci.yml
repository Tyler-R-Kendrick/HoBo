name: HoBo CI Fabric

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]
  merge_group:
    branches: [main]
    types: [checks_requested]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # Future Changesets publish automation must declare `needs: artifact-trust`.
  artifact-trust:
    name: artifact signing and install verification
    needs: pr-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable pnpm
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --config.confirmModulesPurge=false
      - name: Verify signed hello-bindle and refuse stripped signatures
        run: pnpm test:file src/draft/technical-proofs/componentize-artifact-trust-contract/test/publish-verify.test.ts

  pr-gate:
    name: PR impact gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: corepack enable pnpm
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --config.confirmModulesPurge=false
      - name: Fetch base branch for Turbo affected
        run: git fetch origin "${{ github.event_name == 'pull_request' && github.base_ref || 'main' }}"
      - name: Relevant checks only
        run: pnpm agent:check -- --base=${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'origin/main' }}
      - name: Affected package lanes
        env:
          TURBO_SCM_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'origin/main' }}
        run: |
          pnpm exec turbo run build typecheck lint test:unit test:schema test:contract:consumer \
            --filter='{packages/*}[origin/main...HEAD]' \
            --filter='{examples/*}[origin/main...HEAD]' \
            --continue=never
      - name: Production contract provider lane
        run: pnpm exec turbo run test:contract:provider --filter "./packages/*"
      - name: Production packages gate
        run: pnpm run build:packages

  main-gate:
    name: Main full gate
    if: github.event_name == 'merge_group' || github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: corepack enable pnpm
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --config.confirmModulesPurge=false
      - name: Full S0 gate set
        run: pnpm run check:all
      - name: Architecture guard
        run: pnpm run architecture:guard
      - name: Full workspace tests
        run: pnpm exec turbo run test

  ci-guard:
    name: CI fabric contract guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable pnpm
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --config.confirmModulesPurge=false
      - name: Assert CI fabric contract
        run: node --import tsx packages/ci-guard/bin/assert-ci-contract.ts

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
