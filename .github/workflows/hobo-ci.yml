name: HoBo CI Fabric

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  merge_group:
    branches: [main]
    types: [checks_requested]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' && !(github.event_name == 'push' && github.ref == 'refs/heads/main') }}

jobs:
  pr-gate:
    name: PR impact gate
    if: github.event_name == 'pull_request'
    runs-on: hobo
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      GITHUB_EVENT_MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: recursive
          fetch-depth: 0
      - run: corepack enable pnpm
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Turbo cache
        uses: ./.github/actions/turbo-cache
        with:
          turbo-token: ${{ github.event.pull_request.head.repo.fork && '' || secrets.TURBO_TOKEN }}
          turbo-team: ${{ vars.TURBO_TEAM }}
          remote-mode: ${{ github.event.pull_request.head.repo.fork && 'remote:ro' || 'remote:rw' }}
      - name: Check the sibling pins (gitlink against checkout, offline)
        run: node --experimental-strip-types scripts/bootstrap-siblings.mts --status --offline
      - run: pnpm install --frozen-lockfile --config.confirmModulesPurge=false
      - name: Every name HoBo imports from ts-autocode exists at the pin, and its grounding fields are still checked
        run: node --import tsx --test scripts/test/ts-autocode-consumer-surface.test.ts scripts/test/ts-autocode-grounding-drift.test.ts
      - name: Resolve Turbo SCM base
        id: scm-base
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          BASE="$(node --import tsx scripts/ci/turbo-scm-base.mts)"
          echo "base=${BASE}" >> "$GITHUB_OUTPUT"
          git fetch origin "${{ github.base_ref }}"
      - uses: cue-lang/setup-cue@1713281ae501e533ff06108005dffeab9e2e5203
        with:
          version: v0.14.0
      - name: DCO sign-off check
        continue-on-error: true
        env:
          DCO_BASE: origin/${{ github.base_ref }}
        run: |
          missing=0
          while read -r sha; do
            [ -z "$sha" ] && continue
            author="$(git show -s --format='%an <%ae>' "$sha")"
            if ! git show -s --format='%B' "$sha" | grep -qiF "Signed-off-by: $author"; then
              echo "::warning::missing or mismatched DCO sign-off on $(git show -s --format='%h %s' "$sha") (expected 'Signed-off-by: $author')"
              missing=$((missing + 1))
            fi
          done < <(git rev-list "${DCO_BASE}..HEAD")
          if [ "$missing" -gt 0 ]; then
            echo "$missing commit(s) without a matching DCO sign-off. Fix with: git rebase --signoff ${DCO_BASE}"
            exit 1
          fi
          echo "All commits carry a matching DCO sign-off."
      - name: Code format gate
        run: pnpm run lint:code
      - name: Relevant checks only
        run: pnpm agent:check -- --base=origin/${{ github.base_ref }}
      - name: Dagger checks plan (native CI parity)
        run: pnpm --filter @hobo/ci-dagger checks --plan --config .hobo/dagger.json
      - name: Affected package lanes
        env:
          TURBO_SCM_BASE: ${{ steps.scm-base.outputs.base }}
        run: |
          set -euo pipefail
          mapfile -t PKG_FILTERS < <(
            git diff --name-only "${TURBO_SCM_BASE}"...HEAD \
              | rg '^packages/([^/]+)/' -or '$1' \
              | sort -u \
              | sed 's|^|--filter=./packages/|'
          )
          mapfile -t EX_FILTERS < <(
            git diff --name-only "${TURBO_SCM_BASE}"...HEAD \
              | rg '^examples/([^/]+)/' -or '$1' \
              | sort -u \
              | sed 's|^|--filter=./examples/|'
          )
          FILTERS=("${PKG_FILTERS[@]}" "${EX_FILTERS[@]}")
          if [ "${#FILTERS[@]}" -eq 0 ]; then
            echo "No production package or example paths changed; skipping turbo impact lanes"
            exit 0
          fi
          pnpm exec turbo run build typecheck lint test:unit test:schema test:contract:consumer \
            "${FILTERS[@]}" \
            --continue=never --concurrency=100%
      - name: Production packages gate
        run: pnpm run build:packages

  main-gate:
    name: Main full gate
    if: >-
      github.event_name == 'merge_group' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    runs-on: hobo
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      GITHUB_EVENT_MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: recursive
          fetch-depth: 0
      - run: corepack enable pnpm
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Turbo cache
        uses: ./.github/actions/turbo-cache
        with:
          turbo-token: ${{ secrets.TURBO_TOKEN }}
          turbo-team: ${{ vars.TURBO_TEAM }}
          remote-mode: remote:rw
      - run: pnpm install --frozen-lockfile --config.confirmModulesPurge=false
      - name: Resolve Turbo SCM base
        id: scm-base
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          BASE="$(node --import tsx scripts/ci/turbo-scm-base.mts)"
          echo "base=${BASE}" >> "$GITHUB_OUTPUT"
          git fetch origin main
      - name: Full S0 gate set
        run: pnpm run check:all
      - name: Architecture guard (full repo)
        run: pnpm run architecture:guard:all
      - name: Full workspace tests
        env:
          TURBO_SCM_BASE: ${{ steps.scm-base.outputs.base }}
        run: pnpm exec turbo run test --concurrency=100%

  artifact-trust:
    name: artifact signing and install verification
    needs: pr-gate
    if: github.event_name == 'pull_request'
    runs-on: hobo
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: recursive
      - run: corepack enable pnpm
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --config.confirmModulesPurge=false
      - name: Verify signed hello-bindle and refuse stripped signatures
        run: pnpm test:file src/draft/technical-proofs/componentize-artifact-trust-contract/test/publish-verify.test.ts

  dev-cold-loop-gate:
    name: hobo dev cold loop (offline <=60s)
    needs: pr-gate
    if: github.event_name == 'pull_request'
    runs-on: hobo
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: recursive
      - run: corepack enable pnpm
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --config.confirmModulesPurge=false
      - name: Cold hobo dev gate (network disabled)
        run: |
          docker run --rm --network=none \
            -v "$PWD:/workspace" -w /workspace \
            node:24-bookworm \
            node --import tsx scripts/ci/dev-cold-loop-timing.mts

  ci-guard:
    name: CI fabric contract guard
    runs-on: hobo
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: recursive
      - run: corepack enable pnpm
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --config.confirmModulesPurge=false
      - name: Assert CI fabric contract
        run: node --import tsx packages/ci-guard/bin/assert-ci-contract.ts

  secret-scan:
    name: Secret scan
    runs-on: hobo
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Install gitleaks CLI (pinned release)
        run: |
          set -euo pipefail
          set -a
          # shellcheck disable=SC1091
          source .github/action-pins.env
          set +a
          case "$(uname -m)" in
            aarch64|arm64) arch=arm64; digest="${gitleaks-linux-arm64-sha256}" ;;
            x86_64|amd64) arch=x64; digest="${gitleaks-linux-x64-sha256}" ;;
            *) echo "unsupported runner architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          archive="gitleaks_${gitleaks-version}_linux_${arch}.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${gitleaks-version}/${archive}"
          curl -fsSL "$url" -o "$archive"
          echo "${digest}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" gitleaks
          mkdir -p "$HOME/.local/bin"
          install -m 0755 gitleaks "$HOME/.local/bin/gitleaks"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Scan git history for secrets
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            gitleaks git --config .gitleaks.toml --redact --exit-code 1 \
              --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.sha }}"
          else
            gitleaks git --config .gitleaks.toml --redact --exit-code 1
          fi
