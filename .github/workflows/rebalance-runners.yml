name: HoBo Runner Rebalance

# Dogfoods examples/ci-runner-balancing: rebalances the routed runner
# variable (HOBO_RUNNER_LINUX_SMALL) across registered providers by
# usage/budget then billable cost — free credits before realtime billing.
# Plan mode always runs; apply mode needs a VARS_ADMIN_TOKEN secret (PAT
# with repository Variables write) because the workflow GITHUB_TOKEN cannot
# manage Actions variables. Design record:
# docs/design/ci-runner-balancing-example.md

on:
  schedule:
    - cron: "47 3 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "plan (decide only) or apply (patch variables)"
        type: choice
        options: [plan, apply]
        default: plan
      runs_on:
        description: "runner label for the controller (hobo-last-resort when hosted runners are blocked)"
        type: string
        default: ubuntu-latest

permissions:
  contents: read
  actions: read
  checks: read

concurrency:
  group: rebalance-runners
  cancel-in-progress: false

jobs:
  rebalance:
    # Hosted Actions runners are disabled until explicitly re-enabled.
    if: ${{ false }}