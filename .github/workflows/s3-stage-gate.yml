name: S3 Stage Gate

# S3-07: Agent Autonomy gate. A deterministic scripted agent (not an LLM) drives
# deploy exclusively through the @hobo/mcp control surface.
#
# - agent-e2e (rehearsal): the production @hobo/mcp + @hobo/identity + @hobo/cloud
#   suites. Asserts:
#     (a) the scripted agent reaches deployment.Deployed through the MCP server over
#         the shared @hobo/cli dispatch seam, with brokered-tokens-only and a
#         >=99% brokered ratio (NFR-005) from the @hobo/identity token broker;
#     (b) the CredentialAudit projection shows the full grant -> use -> revoke trail
#         correlated by correlationId (@hobo/cloud credential-audit, NFR-018);
#     (c) a seeded deployment.PlanRejected carries machine-readable remediation the
#         scripted agent follows to self-correct (@hobo/cloud planner + gateway);
#     (d) deny-by-default per-tool scope + the inert-tool-output invariant
#         (ADR-0023) — a poisoned tool result never widens the agent's grant.
#
# - adversarial: the prompt-injection corpus (fail-closed) + per-principal /
#   per-tenant rate limits with typed backpressure (@hobo/mcp, S3-06). Gate-required.
#
# - live (workflow_dispatch only, environment-protected, keyless): the same agent
#   run against a real cloud with guaranteed teardown. HELD until credentials +
#   runners exist.
on:
  pull_request:
    paths:
      - "packages/mcp/**"
      - "packages/identity/**"
      - "packages/cloud/**"
      - ".github/workflows/s3-stage-gate.yml"
  push:
    branches: [main]
  schedule:
    - cron: "29 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: s3-stage-gate-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  agent-e2e:
    name: agent-e2e
    runs-on: ${{ vars.HOBO_RUNNER_LINUX_SMALL || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable pnpm
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --config.confirmModulesPurge=false
      - name: Build MCP surface + identity + Yard and dependencies
        run: pnpm exec turbo --concurrency=100% run build --filter @hobo/mcp... --filter @hobo/identity... --filter @hobo/cloud...
      - name: Agent deploys via MCP over brokered tokens (parity + scope + inert output)
        run: pnpm --filter @hobo/mcp test
      - name: Brokered-tokens-only + >=99% brokered ratio (token broker)
        run: pnpm --filter @hobo/identity test
      - name: CredentialAudit trail + seeded PlanRejected self-correction
        run: pnpm --filter @hobo/cloud test

  adversarial:
    name: adversarial
    runs-on: ${{ vars.HOBO_RUNNER_LINUX_SMALL || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable pnpm
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --config.confirmModulesPurge=false
      - name: Build MCP surface and dependencies
        run: pnpm exec turbo --concurrency=100% run build --filter @hobo/mcp...
      - name: Prompt-injection corpus fail-closed + rate-limit backpressure
        run: pnpm --filter @hobo/mcp exec vitest run test/injection.test.ts test/rate-limit.test.ts

  live:
    name: live-cloud (held)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ vars.HOBO_RUNNER_LINUX_SMALL || 'ubuntu-latest' }}
    timeout-minutes: 30
    environment: s3-live-cloud
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable pnpm
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --config.confirmModulesPurge=false
      - name: Build MCP surface and dependencies
        run: pnpm exec turbo --concurrency=100% run build --filter @hobo/mcp...
      - name: Scripted agent deploys hello-bindle via MCP against the real cloud (HELD)
        run: |
          echo "S3 live-cloud lane is HELD: no live cloud wiring exists yet."
          echo "When brokered credentials + runners are restored, this step drives the"
          echo "same scripted-agent deploy through MCP against a real cloud, e.g.:"
          echo "  pnpm --filter @hobo/mcp run gate:s3:live -- --camp cloudflare-sandbox"
          echo "and asserts zero static provider creds + a full credential-audit trail."
      - name: Tear down the live deployment (guaranteed)
        if: always()
        run: |
          echo "Guaranteed teardown: revokes brokered tokens and destroys live resources."
          echo "  pnpm --filter @hobo/mcp run gate:s3:live:teardown -- --run-id ${{ github.run_id }}"
