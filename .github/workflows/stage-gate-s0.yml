name: Stage Gate S0

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  merge_group:
    branches: [main]
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  stage-gate:
    # Hosted Actions runners are disabled until explicitly re-enabled.
    if: ${{ false }}
  digest-parity:
    # Hosted Actions runners are disabled until explicitly re-enabled.
    if: ${{ false }}