# Cucumber configuration for the repo-wide `test:behavior` lane.
# Feature suites live inside epic proofs; step definitions are TypeScript, loaded through tsx
# (the lane invokes cucumber with `node --import tsx`). Boundaries stay mocked from
# Pact/protobuf/CUE fixtures — no live services (see src/draft/AGENTS.md).
default:
  paths:
    - "src/draft/epic-proofs/*/features/**/*.feature"
  import:
    - "src/draft/epic-proofs/*/features/steps/**/*.ts"
  publishQuiet: true
