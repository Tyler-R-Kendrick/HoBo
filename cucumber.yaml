# Cucumber configuration for the repo-wide `test:behavior` lane.
# Feature suites live inside epic proofs and project rollups; step definitions
# are TypeScript, loaded through tsx (the lane invokes cucumber with
# `node --import tsx`). Boundaries stay mocked from Pact/protobuf/CUE fixtures —
# no live services (see src/draft/AGENTS.md).
default:
  paths:
    - "src/draft/epic-proofs/*/features/**/*.feature"
    - "src/draft/projects/*/features/**/*.feature"
    # Shipped-package acceptance suites live at the repo root. Listed file by
    # file on purpose: the other root features/*.feature files are design
    # specs with no step definitions yet, and a glob would fail the lane.
    - "features/control-yard-core-loop.feature"
    - "features/examples-console-cloudflare-station.feature"
  import:
    - "src/draft/epic-proofs/*/features/steps/**/*.ts"
    - "src/draft/projects/*/features/steps/**/*.ts"
    - "features/steps/**/*.ts"
  publishQuiet: true
