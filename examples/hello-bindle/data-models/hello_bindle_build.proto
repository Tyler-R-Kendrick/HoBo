syntax = "proto3";

package hobo.examples.hello_bindle.v1;

message SourceFileDigest {
  string path = 1;
  string digest = 2;
}

message ToolchainPin {
  string jco = 1;
  string componentize_js = 2;
  string wasm_tools = 3;
  string wasmtime = 4;
}

message HelloBindleBuildRecord {
  string schema = 1;
  string name = 2;
  string wit_world = 3;
  string source_date_epoch = 4;
  ToolchainPin toolchain = 5;
  repeated SourceFileDigest sources = 6;
  string component_digest = 7;
  string media_type = 8;
}

message ArtifactSignature {
  string alg = 1;
  string key_id = 2;
  string payload_digest = 3;
  string value = 4;
}

message SignedComponentArtifact {
  string digest = 1;
  ArtifactSignature signature = 2;
  string provenance_tier = 3;
  string conformance_suite_id = 4;
}

message ComponentBuilt {
  HelloBindleBuildRecord record = 1;
}

message ArtifactSigned {
  SignedComponentArtifact artifact = 1;
}

message ArtifactVerified {
  string digest = 1;
  bool passed = 2;
}
