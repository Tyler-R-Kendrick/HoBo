syntax = "proto3";

package hobo.examples.multi_cloud_shop.v1;

// Request/response contracts for the shop API in src/api.ts.

message Product {
  string sku = 1;
  string name = 2;
  uint32 price_cents = 3;
}

message ProductList {
  repeated Product products = 1;
}

message OrderRequest {
  string sku = 1;
  uint32 quantity = 2;
}

message OrderAccepted {
  string order_id = 1;
  string sku = 2;
  uint32 quantity = 3;
}
