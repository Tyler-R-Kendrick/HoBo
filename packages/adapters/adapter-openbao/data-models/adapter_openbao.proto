syntax = "proto3";

package hobo.adapter_openbao.v1;

// Evidence record for the optional residual OpenBao secrets adapter.
// Implements SecretsPort (JWT/SVID + KV v2); not part of default identity installs.
message OpenBaoSecretsAdapterBoundary {
  string package_name = 1; // @hobo/adapter-openbao
  string kind = 2; // openbao
  string auth = 3; // jwt-svid
  string kv = 4; // kv-v2
  bool residual_only = 5; // true — secretless-first ranking unchanged
}
