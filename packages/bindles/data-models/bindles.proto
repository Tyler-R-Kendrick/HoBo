syntax = "proto3";

package hobo.bindles.v1;

message ResourceDescriptor {
  string kind = 1;
  string name = 2;
  string stable_id = 3;
  repeated string port_ref = 4;
  repeated string allow_verbs = 5;
  repeated string declared_allow = 6;
}

message LoweringDescriptor {
  string lowers_to = 1;
  string kind = 2;
  string name = 3;
  string handle_stable_id = 4;
  repeated string port_ref = 5;
  string verb = 6;
}

message CatalogEntry {
  string factory = 1;
  repeated string port_ref = 2;
  repeated string allow_verbs = 3;
}

message BindleEdge {
  string from = 1;
  string to = 2;
}

message ProviderAnnotation {
  string provider = 1;
  string option = 2;
}

message BindleResourceRecord {
  string kind = 1;
  string name = 2;
  string stable_id = 3;
  repeated string declared_allow = 4;
  repeated ProviderAnnotation annotations = 5;
  repeated string depends_on = 6;
}

message BindleGraph {
  string name = 1;
  map<string, BindleResourceRecord> resources = 2;
  repeated BindleEdge edges = 3;
}
