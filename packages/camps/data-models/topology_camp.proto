syntax = "proto3";

package hobo.camps.v1;

// Provider-neutral Camp. Provider is inherited from enclosing Yard.
// Camps do not own Bindles.
message CampTopology {
  string id = 1;
  string env = 2;
  string env_type = 3;
  // derived only when attached to a yard (evidence)
  string derived_provider_id = 4;
  string enclosing_yard_id = 5;
  repeated string require = 6;
  repeated string prefer = 7;
  map<string, string> labels = 8;
  repeated string runtime_requirements = 9;
}

// Legacy wire form retained for migration tooling only.
message ProviderSelection {
  string kind = 1;
  string provider_id = 2;
  string selector = 3;
  option deprecated = true;
}
