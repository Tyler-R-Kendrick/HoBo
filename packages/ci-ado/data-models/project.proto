syntax = "proto3";
package hobo.ci.ado.v1;

// Authoring only: no credentials, balances, agent installation or pipeline registration.
message AdoProject {
 string schema_version = 1;
 string pool = 2;
 repeated string demands = 3;
 // Workspace-relative portable @hobo/ci Pipeline JSON document.
 string pipeline_path = 4;
 string artifact_prefix = 5;
 // Step environment name -> explicitly allowed host/ADO environment variable name.
 map<string, string> environment_refs = 6;
 // Empty lists retain the HoBo monorepo defaults. Values are literal argv, not Azure expressions.
 repeated string runner_argv = 7;
 repeated string bootstrap_argv = 8;
 // Default true: a downstream self-hosted job downloads and verifies the uploaded bundle.
 optional bool verify_artifacts = 9;
}

// Content-addressed file metadata; artifact bytes live under artifacts/ in the bundle.
message AdoArtifactRecord {
 string path = 1;
 string sha256 = 2;
 uint32 size_bytes = 3;
}
message AdoRunReport {
 string schema_version = 1;
 string plan_digest = 2;
 string execution_id = 3;
 string status = 4;
 repeated AdoArtifactRecord artifacts = 5;
 uint32 step_count = 6;
 string error = 7;
}

// Live verification uses a caller-owned existing pipeline at one exact source commit.
// Credentials are referenced by environment name and never serialized.
message AdoLiveTarget {
 string organization_url = 1;
 string project = 2;
 uint32 pipeline_id = 3;
 string ref_name = 4;
 string source_version = 5;
 string token_env = 6;
 string authentication = 7;
 uint32 timeout_seconds = 8;
}
message AdoLiveResult {
 uint32 run_id = 1;
 string source_version = 2;
 string pool = 3;
 string result = 4;
 repeated string artifact_names = 5;
 string url = 6;
}
// Projections of Azure DevOps REST 7.1 responses. Unknown vendor fields are ignored.
message AdoRemotePool { uint32 id = 1; string name = 2; optional bool is_hosted = 3; }
message AdoRemotePools { repeated AdoRemotePool value = 1; }
message AdoRemoteRun { uint32 id = 1; string final_yaml = 2; }
message AdoRemoteQueue { AdoRemotePool pool = 1; }
message AdoRemoteBuild { uint32 id = 1; string status = 2; string result = 3; string source_version = 4; AdoRemoteQueue queue = 5; }
message AdoRemoteTimelineRecord { string type = 1; string name = 2; string identifier = 3; string state = 4; string result = 5; }
message AdoRemoteTimeline { repeated AdoRemoteTimelineRecord records = 1; }
message AdoRemoteArtifactResource { string type = 1; }
message AdoRemoteArtifact { string name = 1; AdoRemoteArtifactResource resource = 2; }
message AdoRemoteArtifacts { repeated AdoRemoteArtifact value = 1; }
message AdoYamlPool { string name = 1; optional string vm_image = 2; }
message AdoYamlJob { string job = 1; AdoYamlPool pool = 2; repeated AdoYamlStep steps = 3; }
message AdoYaml { repeated AdoYamlJob jobs = 1; repeated AdoYamlStage stages = 2; }
message AdoYamlStage { repeated AdoYamlJob jobs = 1; }

message AdoRemoteDefinition { uint32 id = 1; uint32 revision = 2; }
message AdoYamlStep { string bash = 1; string task = 2; string display_name = 3; map<string, string> inputs = 4; }
