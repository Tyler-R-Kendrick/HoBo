# Generated by @hobo/ci-ado. Regenerate after changing the config or command plan.
trigger: none
pr: none
jobs:
  - job: hobo_ci
    pool:
      name: hobo-local
      demands:
        - Agent.OS -equals Linux
    timeoutInMinutes: 11
    cancelTimeoutInMinutes: 1
    workspace:
      clean: all
    variables:
      HOBO_CI_BUNDLE_READY: "false"
    steps:
      - checkout: self
        clean: true
        persistCredentials: false
      - bash: printf '##vso[task.setvariable variable=artifactName;isOutput=true]%s\n' "$HOBO_CI_ARTIFACT_NAME"
        name: artifact_identity
        displayName: Name execution artifact
        env:
          HOBO_CI_ARTIFACT_NAME: hobo-$(System.JobId)-$(System.JobAttempt)
      - bash: |-
          set -euo pipefail
          'bash' '-euc' 'corepack pnpm install --frozen-lockfile
          corepack pnpm exec turbo run build --filter=@hobo/ci-ado --concurrency=100%'
        displayName: Prepare HoBo CI runner
        workingDirectory: $(Build.SourcesDirectory)
      - bash: |-
          set -euo pipefail
          'node' 'packages/ci-ado/dist/cli.js' run 'packages/ci-ado/examples/ci.json' . --expected-plan 2445bc2eab4dc39db60e672575c4f387817eed692572b3dc5afa3e8b466b0648 --artifacts "$HOBO_CI_ARTIFACT_DIRECTORY"
        name: run_checks
        displayName: Run HoBo CI checks
        workingDirectory: $(Build.SourcesDirectory)
        env:
          HOBO_CI_ARTIFACT_DIRECTORY: $(Agent.TempDirectory)/hobo-ci-$(System.JobId)-$(System.JobAttempt)
      - task: PublishPipelineArtifact@1
        displayName: Publish verified execution bundle
        condition: and(succeededOrFailed(), eq(variables['HOBO_CI_BUNDLE_READY'], 'true'))
        inputs:
          targetPath: $(Agent.TempDirectory)/hobo-ci-$(System.JobId)-$(System.JobAttempt)
          artifact: hobo-$(System.JobId)-$(System.JobAttempt)
          publishLocation: pipeline
  - job: hobo_ci_verify_artifacts
    dependsOn: hobo_ci
    condition: succeeded()
    pool:
      name: hobo-local
      demands:
        - Agent.OS -equals Linux
    timeoutInMinutes: 10
    workspace:
      clean: all
    variables:
      hoboArtifactName: $[ dependencies.hobo_ci.outputs['artifact_identity.artifactName'] ]
      hoboBundleDigest: $[ dependencies.hobo_ci.outputs['run_checks.bundleDigest'] ]
    steps:
      - checkout: self
        clean: true
        persistCredentials: false
      - bash: |-
          set -euo pipefail
          'bash' '-euc' 'corepack pnpm install --frozen-lockfile
          corepack pnpm exec turbo run build --filter=@hobo/ci-ado --concurrency=100%'
        displayName: Prepare HoBo CI runner
        workingDirectory: $(Build.SourcesDirectory)
      - task: DownloadPipelineArtifact@2
        displayName: Download execution bundle
        inputs:
          buildType: current
          artifactName: $(hoboArtifactName)
          targetPath: $(Agent.TempDirectory)/hobo-ci-download-$(System.JobId)-$(System.JobAttempt)
      - bash: |-
          set -euo pipefail
          'node' 'packages/ci-ado/dist/cli.js' verify "$HOBO_CI_DOWNLOAD_DIRECTORY" --config 'packages/ci-ado/examples/ci.json' --expected-plan 2445bc2eab4dc39db60e672575c4f387817eed692572b3dc5afa3e8b466b0648 --expected-bundle "$HOBO_CI_EXPECTED_BUNDLE_DIGEST"
        displayName: Verify downloaded artifact hashes
        workingDirectory: $(Build.SourcesDirectory)
        env:
          HOBO_CI_EXPECTED_BUNDLE_DIGEST: $(hoboBundleDigest)
          HOBO_CI_DOWNLOAD_DIRECTORY: $(Agent.TempDirectory)/hobo-ci-download-$(System.JobId)-$(System.JobAttempt)
