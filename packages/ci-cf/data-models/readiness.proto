syntax = "proto3";
package hobo.ci.cf.v1;

// SDK readiness is metadata only; it is never execution authorization.
message Readiness {
  string integration = 1;
  string status = 2;
  bool execution_available = 3;
  string target_sdk = 4;
  string target_documentation = 5;
  repeated string pending_gates = 6;
}

// Shell wrapper response retains exact user-command exit status and binary-safe logs.
message CommandEnvelope {
  int32 exit_code = 1;
  string stdout_base64 = 2;
  string stderr_base64 = 3;
}

// Immutable, owner-local inputs; tokens are stored separately with mode 0600.
message LocalPreparation {
  string id = 1;
  string source_sha = 2;
  string pipeline_json = 3;
  string pipeline_sha256 = 4;
  string archive_sha256 = 5;
  string dockerfile_sha256 = 6;
  string config_sha256 = 7;
  uint32 port = 8;
  string runtime_sha256 = 9;
 string bundle_sha256 = 10;
}

message LocalHealth {
  string preparation_id = 1;
  string source_sha = 2;
  string pipeline_sha256 = 3;
}

message LocalNativeStatus {
  string status = 1;
  string error = 2;
}

// Controller state is independent of an unverified native "complete" status.
message LocalRunState {
  string phase = 1;
  string result_status = 2;
  string workflow_status = 3;
  string stop_reason = 4;
  bool shutdown_confirmed = 5;
  string outcome = 6;
  int32 exit_code = 7;
}

message LocalRunEvent {
  string kind = 1;
  string status = 2;
}

message LocalRunReceipt {
  string workflow_id = 1;
  string preparation_id = 2;
  string source_sha = 3;
  string pipeline_sha256 = 4;
  string started_at = 5;
  string finished_at = 6;
  LocalRunState state = 7;
  // Canonical JSON of @hobo/ci's generated PipelineResult, not a second format.
  string result_json = 8;
  string error = 9;
  repeated string owned_containers = 10;
 string docker_host = 11;
 string docker_id = 12;
}
