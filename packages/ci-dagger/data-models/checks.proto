syntax = "proto3";
package hobo.ci.dagger.v1;

// Native Dagger CI checks on operator-owned infrastructure. No Cloud selector.
message CheckConfig {
  // "local" starts the version-pinned engine through the local container runtime.
  // Otherwise, an explicit image/container/unix/tcp/tls/ssh/kube-pod URI.
  string engine = 1;
  // Required version pin. CLI and local engine version must match.
  string cli_version = 2;
  // Repository-relative local workspace containing dagger.toml and dagger.lock.
  string workspace = 3;
  repeated string filters = 4;
  repeated string skip = 5;
  // Zero means unlimited, as in dagger check --parallel=0.
  uint32 parallel = 6;
  bool fail_fast = 7;
}
