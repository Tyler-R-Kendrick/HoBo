# Digest pins must stay aligned with packages/ci-gh-actions/contracts/pinned-container-images.json
services:
  database:
    image: postgres:17-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
    environment:
      POSTGRES_DB: pact
      POSTGRES_USER: pact
      POSTGRES_PASSWORD: local-contract-tests-only
    volumes:
      - pact-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U pact -d pact]
      interval: 2s
      timeout: 2s
      retries: 30
  broker:
    image: pactfoundation/pact-broker@sha256:420341d4fbfb00a621c313f47e530ad75703f969bbc7520d0d72bc71bb53cef9
    depends_on:
      database:
        condition: service_healthy
    environment:
      PACT_BROKER_DATABASE_ADAPTER: postgres
      PACT_BROKER_DATABASE_HOST: database
      PACT_BROKER_DATABASE_NAME: pact
      PACT_BROKER_DATABASE_USERNAME: pact
      PACT_BROKER_DATABASE_PASSWORD: local-contract-tests-only
      PACT_BROKER_LOG_LEVEL: WARN
      PACT_BROKER_PORT: "9292"
    ports:
      - "127.0.0.1:${HOBO_PACT_BROKER_PORT:-9292}:9292"
    healthcheck:
      test: [CMD, ruby, -rnet/http, -e, "exit(Net::HTTP.new('127.0.0.1', 9292, nil).get('/diagnostic/status/heartbeat').code == '200' ? 0 : 1)"]
      interval: 2s
      timeout: 2s
      retries: 30
volumes:
  pact-data:
