syntax = "proto3";
package hobo.ci.gh_actions.v1;

// Bound by the authenticated HoBo control plane, never by request JSON alone.
message OnboardingPrincipal {
  string account_id = 1;
  repeated double installation_ids = 2;
}
message OnboardingFile {
  string path = 1;
  string content = 2;
  string sha256 = 3;
}
// Reviewable, deterministic intent. The digest detects mutation, not authorization.
message OnboardingPlan {
  string account_id = 1;
  double installation_id = 2;
  string repository = 3;
  double repository_id = 4;
  string default_branch = 5;
  string base_sha = 6;
  string base_tree_sha = 7;
  string install_branch = 8;
  string bridge_ref = 9;
  string bridge_workflow = 10;
  uint32 runner_group_id = 11;
  double dispatcher_actor_id = 12;
  repeated string trusted_refs = 13;
  bool public_repo_acknowledged = 14;
  bool trusted_repository_acknowledged = 15;
  repeated OnboardingFile files = 16;
  string relay_url = 17;
  string plan_digest = 18;
  bool allow_all_pull_requests = 19;
}
message OnboardingApplyResult {
  string status = 1;
  double pull_request_number = 2;
  string pull_request_url = 3;
  string branch = 4;
  string commit_sha = 5;
  string plan_digest = 6;
}
// Durable control-plane state. Only a server-owned plan may be applied.
message OnboardingOperation {
  string id = 1;
  OnboardingPlan plan = 2;
  OnboardingApplyResult result = 3;
  string status = 4;
}
message GithubAppHookAttributes {
  string url = 1;
  bool active = 2;
}
// json_name pins GitHub's manifest wire spelling, not protobuf's camelCase default.
message GithubAppManifest {
  string name = 1;
  string url = 2;
  GithubAppHookAttributes hook_attributes = 3 [json_name = "hook_attributes"];
  string redirect_url = 4 [json_name = "redirect_url"];
  string setup_url = 5 [json_name = "setup_url"];
  bool public = 6;
  repeated string default_events = 7 [json_name = "default_events"];
  map<string, string> default_permissions = 8 [json_name = "default_permissions"];
  repeated string callback_urls = 9 [json_name = "callback_urls"];
}
