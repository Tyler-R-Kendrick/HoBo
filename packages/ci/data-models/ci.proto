syntax = "proto3";
package hobo.ci.v1;
import "google/protobuf/struct.proto";

// Conservative Sandbox rate card. All monetary values are integer microdollars.
// The caller must obtain independently verified current rates and measured usage.
// Remaining verified free allocation, in resource units at the Offer observed_at snapshot.
message SandboxAllowance {
  double cpu_vcpu_ms = 1;
  double memory_mb_ms = 2;
  double egress_bytes = 3;
  double creations = 4;
  double proxy_bytes = 5;
  double proxy_sessions = 6;
  double proxy_control_calls = 7;
}
message SandboxPricing {
  uint32 vcpus = 1;
  uint32 memory_mb = 2;
  double cpu_micros_per_vcpu_hour = 3;
  double memory_micros_per_gb_hour = 4;
  double creation_micros = 5;
  double egress_micros_per_gb = 6;
  double max_egress_bytes = 7;
  double proxy_micros_per_gb = 8;
  double proxy_fixed_micros = 9;
  double network_headroom_bytes = 10;
  double bootstrap_fixed_micros = 11;
  // When true, a second ephemeral Sandbox forwards network traffic for this job.
  // Both sessions must use the same project, region, and rate/allowance bucket.
  bool proxy_vm_required = 12;
  uint32 proxy_vm_vcpus = 13;
  uint32 proxy_vm_memory_mb = 14;
  double proxy_vm_extra_ms = 15;
  double proxy_vm_network_bytes = 16;
  double proxy_vm_network_headroom_bytes = 17;
  string region = 18;
  double proxy_control_max_calls = 19;
  double proxy_control_call_micros = 20;
  string plan = 21;
}
// Durable provider-confirmed terminal session usage. No absent record means zero usage.
message SandboxMeasuredUsage {
  string session_id = 1;
  double cpu_ms = 2;
  double duration_ms = 3;
  double memory_mb = 4;
  double vcpus = 5;
  double egress_bytes = 6;
  double ingress_bytes = 7;
  string stopped_at = 8;
}
// All costs are integer USD microdollars. Allocations are runner minutes.
message Offer {
  string id = 1;
  string provider = 2;
  string provider_account_id = 3;
  bool enabled = 4;
  string runs_on = 5;
  double free_minutes = 6;
  double price_micros_per_minute = 7;
  double budget_micros = 8;
  double spent_micros = 9;
  uint32 concurrency = 10;
  string observed_at = 11;
  string valid_until = 12;
  string source_url = 13;
  bool bridge_acknowledged = 14;
  string backend = 15;
  SandboxPricing sandbox_pricing = 16;
  SandboxAllowance sandbox_allowance = 17;
}
message Account {
  string id = 1;
  double budget_micros = 2;
  double spent_micros = 3;
  uint32 max_runtime_minutes = 4;
  uint32 startup_minutes = 5;
  repeated Offer offers = 6;
  string usage_observed_at = 7;
  map<string, uint32> routing_signal_cycles = 8;
  map<string, bool> routing_signal_crossed = 9;
  // min-cost (including the legacy lowest-total-incremental-cost spelling)
  // or an explicit maximize-credits objective.
  string routing_strategy = 10;
  google.protobuf.Struct budget_policy = 11;
}
message Connection {
  string account_id = 1;
  string repository = 2;
  double repository_id = 3;
  double installation_id = 4;
  string bridge_workflow = 5;
  string bridge_sha = 6;
  uint32 runner_group_id = 7;
  repeated string allowed_events = 8;
  repeated string allowed_refs = 9;
  bool trusted_repository_acknowledged = 10;
  string bridge_ref = 11;
  double dispatcher_actor_id = 12;
  bool public_repository_acknowledged = 13;
  // Explicitly permits isolated pull_request runs for any target branch.
  bool allow_all_pull_requests = 14;
  // Only an isolated runner may accept jobs for this repository.
  bool isolated_only = 15;
  // Explicit consent to run every matching repository job on isolated runners.
  bool accept_all_matching_repository_jobs = 16;
}
message Configuration {
  repeated Account accounts = 1;
  repeated Connection connections = 2;
}
// Revisioned platform configuration, committed with its audit event.
message ConfigurationState {
  uint32 revision = 1;
  Configuration configuration = 2;
  string updated_at = 3;
}
// Opaque protobuf-JSON operation records, parsed by their owning integration.
message ControlRecord {
  string key = 1;
  string account_id = 2;
  string body_json = 3;
  string updated_at = 4;
}
message AccountState {
  uint32 revision = 1;
  Account account = 2;
  repeated Connection connections = 3;
  string updated_at = 4;
}
message RepositorySetupRequest {
  string repository = 1;
  double repository_id = 2;
  double installation_id = 3;
  uint32 runner_group_id = 4;
  repeated string allowed_refs = 5;
  bool trusted_repository_acknowledged = 6;
  bool public_repository_acknowledged = 7;
  bool allow_all_pull_requests = 8;
  bool accept_all_matching_repository_jobs = 9;
}
message ReconcileRequest { double host_run_id = 1; }
message ControlCredential {
  string account_id = 1;
  repeated double installation_ids = 2;
  string token_sha256 = 3;
  repeated string scopes = 4;
}
message ControlCredentials { repeated ControlCredential tokens = 1; }
message Job {
  double id = 1;
  double run_id = 2;
  uint32 run_attempt = 3;
  double repository_id = 4;
  double installation_id = 5;
  string repository = 6;
  repeated string labels = 7;
  string action = 8;
  string runner_name = 9;
  bool isolated_required = 10;
  string queue_deadline_at = 11;
}
message Lease {
  string id = 1;
  string account_id = 2;
  string offer_id = 3;
  string provider = 4;
  double job_id = 5;
  double original_run_id = 6;
  uint32 run_attempt = 7;
  double repository_id = 8;
  string repository = 9;
  double installation_id = 10;
  string state = 11;
  double reserved_minutes = 12;
  double reserved_free_minutes = 13;
  double reserved_paid_micros = 14;
  string runner_name = 15;
  string created_at = 16;
  double host_run_id = 17;
  double runner_id = 18;
  double actual_job_id = 19;
  double billed_minutes = 20;
  double paid_micros = 21;
  string settled_at = 22;
  double price_micros_per_minute = 23;
  string free_valid_until = 24;
  double billed_free_minutes = 25;
  string pipeline_id = 26;
  hobo.ci.v1.PipelineResult result = 27;
  string pipeline_digest = 28;
  string usage_completed_at = 29;
  // Native isolated host identity. A session never resumes after its runner starts.
  string sandbox_name = 30;
  string sandbox_session_id = 31;
  string sandbox_command_id = 32;
  string sandbox_stage = 33;
  SandboxPricing sandbox_pricing = 34;
  SandboxAllowance sandbox_reserved_allowance = 35;
  SandboxAllowance sandbox_used_allowance = 36;
  string proxy_sandbox_name = 37;
  string proxy_sandbox_session_id = 38;
  string proxy_sandbox_command_id = 39;
  string proxy_sandbox_stage = 40;
  SandboxMeasuredUsage sandbox_stopped_usage = 41;
  SandboxMeasuredUsage proxy_stopped_usage = 42;
  string sandbox_stop_from_stage = 43;
  bool runner_deletion_confirmed = 44;
  string provider_account_id = 45;
  string budget_tenant_id = 46;
  string budget_id = 47;
  string budget_period_id = 48;
  string budget_policy_revision = 49;
  string budget_policy_digest = 50;
  string queue_deadline_at = 51;
  string usage_provenance = 52;
  string external_operation_id = 53;
  string usage_evidence_ref = 54;
  // Financial admission generation, independent of a GitHub run attempt.
  uint32 budget_admission_attempt = 55;
  string budget_release_evidence_ref = 56;
}
message CiEvent {
  string type = 1;
  string account_id = 2;
  string lease_id = 3;
  string at = 4;
  string detail = 5;
}
message CiRoutingRefusal { string code = 1; string reason = 2; string offer_id = 3; }
message Snapshot {
  repeated Lease leases = 1;
  repeated CiEvent events = 2;
}


// A portable command pipeline. The backend binds its source workspace separately.
message PipelineStep {
  string id = 1;
  repeated string argv = 2;
  string cwd = 3;
  map<string, string> env = 4;
}
message Pipeline {
  string id = 1;
  string account_id = 2;
  repeated PipelineStep steps = 3;
  repeated string artifact_paths = 4;
  uint32 timeout_seconds = 5;
  repeated string required_capabilities = 6;
}
message PipelineStepResult {
  string id = 1;
  int32 exit_code = 2;
  string stdout = 3;
  string stderr = 4;
}
message PipelineArtifact {
  string path = 1;
  bytes data = 2;
  string sha256 = 3;
}
message PipelineResult {
  string id = 1;
  string backend = 2;
  string status = 3;
  repeated PipelineStepResult steps = 4;
  repeated PipelineArtifact artifacts = 5;
  string error = 6;
}

// Broker facts consumed by the Station CI routing bridge.
message BudgetSignalData {
  string tenant_id = 1;
  double threshold_fraction = 2;
  double threshold_usd = 3;
  double budget_usd = 4;
  double net_spent_usd = 5;
  uint32 cycle = 6;
  string signal_key = 7;
  CiBudgetIdentity identity = 8;
  string policy_digest = 9;
  optional bool crossed = 10;
}
message CiBudgetIdentity {
  string tenant_id = 1;
  string budget_id = 2;
  string period_id = 3;
  string policy_revision = 4;
}
message BudgetSignal { string type = 1; BudgetSignalData data = 2; }
message BudgetRoutingRule {
  double threshold_fraction = 1;
  repeated string offer_ids = 2;
}
message BudgetRoutingPolicy {
  string account_id = 1;
  string tenant_id = 2;
  repeated string normal_offer_ids = 3;
  repeated BudgetRoutingRule thresholds = 4;
  google.protobuf.Struct budget_policy = 5;
}
