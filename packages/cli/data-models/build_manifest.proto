syntax = "proto3";

package hobo.build.v1;

// Design-time contract for hobo build records. Runtime types derive from these
// shapes; CUE constraints live alongside in build_manifest.cue.

enum ArtifactKind {
  ARTIFACT_KIND_UNSPECIFIED = 0;
  ARTIFACT_KIND_WASM_COMPONENT = 1;
  ARTIFACT_KIND_OCI_CONTAINER = 2;
  ARTIFACT_KIND_NODE_APP = 3;
}

message ServiceDeclaration {
  string name = 1;
  string language = 2;
  string runtime = 3;
  string source_root = 4;
  string entrypoint = 5;
}

message BuildArtifact {
  string service = 1;
  ArtifactKind kind = 2;
  string path = 3;
  string media_type = 4;
  string digest = 5;
  string runtime = 6;
  string wit_world = 7;
  string fallback_reason = 8;
  string source = 9;
}

message BuildManifest {
  string schema = 1;
  string generated_by = 2;
  string runtime_target = 3;
  string source_date_epoch = 4;
  repeated BuildArtifact artifacts = 5;
}

message BuildStarted {
  string runtime_target = 1;
  string source_date_epoch = 2;
}

message BuildArtifactProduced {
  string service = 1;
  BuildArtifact artifact = 2;
}

message BuildCompleted {
  string manifest_digest = 1;
}

message BuildFailed {
  string code = 1;
  string message = 2;
}

message BuildEvent {
  oneof event {
    BuildStarted started = 1;
    BuildArtifactProduced artifact_produced = 2;
    BuildCompleted completed = 3;
    BuildFailed failed = 4;
  }
}
