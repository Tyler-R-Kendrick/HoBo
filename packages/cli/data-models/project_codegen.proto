syntax = "proto3";

package hobo.cli.v1;

// Records for the project codegen engine behind `hobo codegen`/`hobo stub`
// and the `hobo build` freshness gate. These cross the CLI's JSON envelope
// boundary, so they are proto-first; string discriminators (mode, status)
// stay strings with CUE disjunctions so the envelope JSON is stable
// (mirrors hobo.schematools.v1's string `kind` precedent).

// One generated file, project-root-relative.
message CodegenArtifact {
  string path = 1;
  string content = 2;
}

// One drift finding from comparing the expected artifact set to disk.
message DriftEntry {
  string path = 1;
  string status = 2;
  string expected_digest = 3;
  string actual_digest = 4;
}

// The outcome of a codegen run (write or check mode).
message CodegenReport {
  string mode = 1;
  repeated string written = 2;
  repeated string checked = 3;
}

// One contract-backed trainable stub emitted for a bindle step (ADR-0125).
message TrainableStub {
  string method_ref = 1;
  string export_name = 2;
  string resource = 3;
  string type_name = 4;
  string contract_ref = 5;
}
