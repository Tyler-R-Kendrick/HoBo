syntax = "proto3";

package hobo.cli.v1;

import "google/protobuf/struct.proto";

// Records for the project codegen engine behind `hobo codegen`/`hobo stub`
// and the `hobo build` freshness gate. These cross the CLI's JSON envelope
// boundary, so they are proto-first; string discriminators (mode, status)
// stay strings with CUE disjunctions so the envelope JSON is stable
// (mirrors hobo.schematools.v1's string `kind` precedent).

// One generated file, project-root-relative.
message CodegenArtifact {
  string path = 1;
  string content = 2;
  optional bytes binary_content = 3;
}

// One drift finding from comparing the expected artifact set to disk.
message DriftEntry {
  string path = 1;
  string status = 2;
  string expected_digest = 3;
  string actual_digest = 4;
}

// The outcome of a codegen run (write or check mode).
message CodegenReport {
  string mode = 1;
  repeated string written = 2;
  repeated string checked = 3;
}

// One trainable binding codegen emits (ADR-0125): a contract-backed stub
// per bindle step, an inferred registration generated from a bare
// "use training" marker found in authored source, or a signature-only
// registration per operation of an ambient @trainable class (origin
// "declared", ADR-0128).
message TrainableStub {
  string method_ref = 1;
  string export_name = 2;
  string resource = 3;
  string type_name = 4;
  string contract_ref = 5;
  string origin = 6;
}

// Recursive field contract shared by source parsing, generated types, runtime
// validation, and examples. Literals use canonical JSON to preserve scalar kinds.
message CodegenFieldSchema {
  string kind = 1;
  map<string, CodegenFieldSchema> fields = 2;
  CodegenFieldSchema items = 3;
  repeated CodegenFieldSchema variants = 4;
  repeated string values_json = 5;
  bool optional = 6;
  bool nullable = 7;
  string reference = 8;
  repeated CodegenFieldSchema tuple = 9;
  string format = 10;
  bool closed = 11;
}

// Durable generated API events use these payloads in core EventEnvelope.data.
message GeneratedResourcePut {
  string key = 1;
  google.protobuf.Value value = 2;
}
message GeneratedResourceRemoved { string key = 1; }
message GeneratedResourceSnapshot { map<string, google.protobuf.Value> values = 1; }
