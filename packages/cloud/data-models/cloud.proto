syntax = "proto3";

package hobo.cloud.v1;

// Wire records for the Yard control-plane kernel (S2-01) and the Planner
// (S2-02). These are the protobuf definitions of the provider-neutral planner
// IR and of the control-plane event bodies (control-plane.md "The Planner" and
// the command/event API surface). Every record carries a matching CUE constraint
// in cloud.cue; the TypeScript domain-view types (parse-don't-validate parsed
// derived types) narrow these wire shapes with branded fields.

// Step 0 output: a manifest IR node lowered to a provider-neutral intent.
message ResourceIntent {
  string name = 1;
  string port = 2;                 // capability class: compute | kv | objectStore | ...
  repeated string require = 3;     // required capability features
  repeated string prefer = 4;      // preferred (degradable) features
  string negotiation = 5;          // "require" | "prefer"
  repeated string deps = 6;        // bind-edge dependency ids
  string region = 7;               // explicit region, if pinned
  string objective = 8;            // routing objective (default: min-cost)
}

// A Resource Definition candidate indexed by the Registry catalog projection.
message ResourceDefinitionRef {
  string id = 1;                   // "<providerId>:<port>"
  string provider_id = 2;
  string port = 3;
  repeated string features = 4;
  repeated string regions = 5;
  uint32 specificity = 6;
  uint32 priority = 7;
  string cost_sku = 8;
  string cost_unit = 9;
  string marginal_price = 10;
}

// Capability negotiation verdict: full | partial(missing) | none.
message CapabilityVerdict {
  string kind = 1;                 // "full" | "partial" | "none"
  repeated string missing = 2;
}

// deployment stream body for match.Decided (one per resolved resource).
message MatchDecided {
  string deployment_id = 1;
  string resource = 2;
  string winner = 3;               // "<providerId>.<port>"
  string provider_id = 4;
  string port = 5;
  uint32 specificity = 6;
  repeated string rejected = 7;
  string objective = 8;
  string region = 9;
  string rationale = 10;
  string catalog_hash = 11;
}

// A resolved node of the DeploymentPlan DAG (control-plane.md step 6).
message ResourcePlan {
  string name = 1;
  string port = 2;
  string provider = 3;
  repeated string deps = 4;
  string strategy = 5;
  string region = 6;
  string deployment_id = 7;
}

// The content-addressed DeploymentPlan DAG.
message DeploymentPlan {
  string schema = 1;
  repeated ResourcePlan resources = 2;
  repeated string dependency_order = 3;
  string objective = 4;
}

// deployment.Planned body: the content-addressed plan + its hash.
message DeploymentPlanned {
  string deployment_id = 1;
  string plan_hash = 2;
  DeploymentPlan plan = 3;
}

// Machine-readable remediation carried by a rejection (agent self-correction).
message PlanRemediation {
  string resource = 1;
  string code = 2;
  string required_port = 3;
  repeated string required_features = 4;
  repeated string missing = 5;
  string suggested_provider = 6;
  string remediation = 7;
}

// deployment.PlanRejected body.
message DeploymentPlanRejected {
  string deployment_id = 1;
  string reason = 2;
  repeated PlanRemediation remediations = 3;
}

// Registry catalog projection row: a provider's Capability Manifest snapshot.
message RegistryCatalogEntry {
  string provider_id = 1;
  repeated ResourceDefinitionRef definitions = 2;
  string manifest_index_digest = 3;
}
