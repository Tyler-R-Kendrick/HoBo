syntax = "proto3";

package hobo.cloud.v1;

// Wire records for the Yard control-plane kernel (S2-01) and the Planner
// (S2-02). These are the protobuf definitions of the provider-neutral planner
// IR and of the control-plane event bodies (control-plane.md "The Planner" and
// the command/event API surface). Every record carries a matching CUE constraint
// in cloud.cue; the TypeScript domain-view types (parse-don't-validate parsed
// derived types) narrow these wire shapes with branded fields.

// Step 0 output: a manifest IR node lowered to a provider-neutral intent.
message ResourceIntent {
  string name = 1;
  string port = 2;                 // capability class: compute | kv | objectStore | ...
  repeated string require = 3;     // required capability features
  repeated string prefer = 4;      // preferred (degradable) features
  string negotiation = 5;          // "require" | "prefer"
  repeated string deps = 6;        // bind-edge dependency ids
  string region = 7;               // explicit region, if pinned
  string objective = 8;            // routing objective (default: min-cost)
}

// A Resource Definition candidate indexed by the Registry catalog projection.
message ResourceDefinitionRef {
  string id = 1;                   // "<providerId>:<port>"
  string provider_id = 2;
  string port = 3;
  repeated string features = 4;
  repeated string regions = 5;
  uint32 specificity = 6;
  uint32 priority = 7;
  string cost_sku = 8;
  string cost_unit = 9;
  string marginal_price = 10;
}

// Capability negotiation verdict: full | partial(missing) | none.
message CapabilityVerdict {
  string kind = 1;                 // "full" | "partial" | "none"
  repeated string missing = 2;
}

// deployment stream body for match.Decided (one per resolved resource).
message RankedCandidate {
  string definition_id = 1;
  string provider_id = 2;
  uint32 specificity = 3;
  uint32 priority = 4;
}

message RejectedCandidate {
  string definition_id = 1;
  string reason = 2;
}

message MatchDecided {
  string deployment_id = 1;
  string resource = 2;
  string winner = 3;               // "<providerId>.<port>"
  string provider_id = 4;
  string port = 5;
  uint32 specificity = 6;
  repeated string rejected = 7;    // deprecated alias of rejected_candidates ids
  string objective = 8;
  string region = 9;
  string rationale = 10;
  string catalog_hash = 11;        // deprecated alias of catalog_content_hash
  repeated RankedCandidate ranking = 12;
  repeated RejectedCandidate rejected_candidates = 13;
  bool tie = 14;
  string catalog_content_hash = 15;
}

// A resolved node of the DeploymentPlan DAG (control-plane.md step 6).
message ResourcePlan {
  string name = 1;
  string port = 2;
  string provider = 3;
  repeated string deps = 4;
  string strategy = 5;
  string region = 6;
  string deployment_id = 7;
}

// The content-addressed DeploymentPlan DAG.
message DeploymentPlan {
  string schema = 1;
  repeated ResourcePlan resources = 2;
  repeated string dependency_order = 3;
  string objective = 4;
}

// deployment.Planned body: the content-addressed plan + its hash.
message DeploymentPlanned {
  string deployment_id = 1;
  string plan_hash = 2;
  DeploymentPlan plan = 3;
}

// Machine-readable remediation carried by a rejection (agent self-correction).
message PlanRemediation {
  string resource = 1;
  string code = 2;
  string required_port = 3;
  repeated string required_features = 4;
  repeated string missing = 5;
  string suggested_provider = 6;
  string remediation = 7;
}

// deployment.PlanRejected body.
message DeploymentPlanRejected {
  string deployment_id = 1;
  string reason = 2;
  repeated PlanRemediation remediations = 3;
}

// Registry catalog projection row: a provider's Capability Manifest snapshot.
message RegistryCatalogEntry {
  string provider_id = 1;
  repeated ResourceDefinitionRef definitions = 2;
  string manifest_index_digest = 3;
}

// Approval fact body for a registered provider (provider.Approved). Only
// approved providers are matchable by the Planner (walkthrough Part 0/2
// "default providers approved"); registration alone leaves a provider held.
message ProviderApprovedRecord {
  string provider_id = 1;
  string approved_by = 2;
}

// ---- S2-03a/b: Orchestrator + ResourceActor FSM + Executor wire records ----
// control-plane.md "The ResourceActor reconciliation FSM" + "Executor sandbox
// model". The provisioning path: a durable ResourceActor folds its own stream
// to an FSM snapshot, previews a diff, dispatches an IacProgram to a sandboxed
// Executor, and on exec.Succeeded emits resource.Provisioned. Compensation is
// choreographed via deployment.RolledBack + reverse-order resource.Destroying.

// The program a CloudProvider realizes and the Orchestrator dispatches to an
// Executor (control-plane.md "A CloudProvider composes ... emits an IacProgram").
message IacProgram {
  string program_id = 1;
  string deployment_id = 2;
  string resource_id = 3;
  string provider = 4;
  string driver = 5;               // iac driver: pulumi | terraform | container | ...
  string action = 6;               // "preview" | "apply" | "destroy"
  string stack_name = 7;           // per-resource stack key: tenant/deployment/resource
}

// A short-lived, capability-scoped token injected per-exec (control-plane.md:
// "no ambient cloud creds ... a short-lived, capability-scoped token").
message ScopedCredential {
  string id = 1;
  string scope = 2;                // tenant:<t>/resource:<r>/job:<k>/action:<a>
  uint32 ttl_seconds = 3;
  bool ambient = 4;                // always false — creds arrive only by injection
}

// exec.Output: streamed stdout/stderr line from a running Executor.
message ExecOutputRecord {
  string exec_id = 1;
  string stream = 2;               // "stdout" | "stderr"
  string line = 3;
}

// exec.Diff: the preview diff summary streamed before apply.
message ExecDiffRecord {
  string exec_id = 1;
  string summary = 2;
  uint32 changes = 3;
}

// exec.Succeeded: terminal success carrying captured stack outputs.
message ExecSucceededRecord {
  string exec_id = 1;
  string outputs_hash = 2;
  map<string, string> outputs = 3;
}

// exec.Failed: terminal failure with a classified error (retryable | fatal).
message ExecFailedRecord {
  string exec_id = 1;
  string classification = 2;       // "retryable" | "fatal"
  string reason = 3;
}

// The durable ResourceActor FSM snapshot, folded from the resource's own facts.
message ResourceActorSnapshot {
  string deployment_id = 1;
  string resource_id = 2;
  string state = 3;                // Pending|Planning|Provisioning|Provisioned|Updating|Failed|Compensating|Destroying|Destroyed
  uint32 sequence = 4;
  map<string, string> outputs = 5;
  repeated string deps = 6;
}

// resource.Provisioning: apply dispatched to an Executor (transition to Provisioning).
message ResourceProvisioningRecord {
  string deployment_id = 1;
  string resource_id = 2;
  string exec_id = 3;
  string program_hash = 4;
}

// resource.Provisioned: apply ok, outputs recorded (unblocks dependents).
message ResourceProvisionedRecord {
  string deployment_id = 1;
  string resource_id = 2;
  map<string, string> outputs = 3;
  string exec_id = 4;
}

// resource.Failed: apply error with classified reason + no-go threshold flag.
message ResourceFailedRecord {
  string deployment_id = 1;
  string resource_id = 2;
  string reason = 3;
  string classification = 4;       // "retryable" | "fatal"
  bool crossed_no_go_threshold = 5;
}

// resource.Destroying: choreographed compensation started for this actor.
message ResourceDestroyingRecord {
  string deployment_id = 1;
  string resource_id = 2;
  string reason = 3;
}

// resource.Destroyed: compensation applied; slice removed.
message ResourceDestroyedRecord {
  string deployment_id = 1;
  string resource_id = 2;
  string final_state_hash = 3;
}

// deployment.Deployed: every resource actor reached Provisioned.
message DeploymentDeployedRecord {
  string deployment_id = 1;
  string set_id = 2;
  repeated string resource_ids = 3;
}

// deployment.RolledBack: a no-go failure crossed threshold; saga compensates.
message DeploymentRolledBackRecord {
  string deployment_id = 1;
  string target_set_id = 2;
  string reason = 3;
}

// ---- S3-04: CredentialAudit projection (ai-native-agent-auth.md §6.2/§6.8) ----
// The read-model fold over identity/token/session events, correlated by
// correlationId. Never compacted (NFR-018 retention floor).

message CredentialAuditScope {
  string port = 1;
  string resource = 2;
  string action = 3;
}

// The per-grant lifecycle fold: grant -> use -> revoke.
message CredentialGrantAudit {
  string grant_id = 1;
  string svid_subject = 2;
  CredentialAuditScope scope = 3;
  string token_ref = 4;
  string status = 5;               // "granted" | "used" | "revoked"
  string granted_at = 6;
  string used_at = 7;
  string revoked_at = 8;
  string revoked_reason = 9;
  uint32 use_count = 10;
}

// A single ordered step in a correlation's credential timeline.
message CredentialAuditTimelineEntry {
  uint32 seq = 1;
  string type = 2;
  string grant_id = 3;
}

// The CredentialAudit read-model row, one per correlationId.
message CredentialAuditRecord {
  string correlation_id = 1;
  repeated CredentialGrantAudit grants = 2;
  repeated string identity_ids = 3;
  repeated string session_ids = 4;
  repeated CredentialAuditTimelineEntry timeline = 5;
  uint32 grant_count = 6;
  uint32 use_count = 7;
  uint32 revoke_count = 8;
}

// Continuous Delivery plane (attested apply + progressive + A2H).
message ResolvedDeploymentSetRecord {
  string schema_version = 1;
  string set_id = 2;
  string tenant = 3;
  string environment = 4;
  string camp_id = 5;
  string plan_hash = 6;
  string content_hash = 7;
  string gatekeeper_decision_id = 8;
  string gatekeeper_decision = 9;
}

message AttestedPrincipalRecord {
  string svid_subject = 1;
  string identity_id = 2;
  string tenant = 3;
  string code_digest = 4;
  string component_image_digest = 5;
  string attestation_state = 6;
  string isolation_tier = 7;
}

message SecretFreeStatusRecord {
  string schema_version = 1;
  string resource_id = 2;
  string state = 3;
  bool secret_free = 4;
}

message SafetyEnvelopeRecord {
  string schema_version = 1;
  string blast_radius = 2;
  bool reversible = 3;
  uint32 spend_cap_usd = 4;
  uint32 estimated_spend_usd = 5;
  bool self_causation = 6;
  uint32 max_attempts = 7;
  uint32 attempts_used = 8;
  bool requires_lane = 9;
}

message A2HHandoffRecord {
  string schema_version = 1;
  string incident_id = 2;
  string signal = 3;
  string tenant = 4;
  string environment = 5;
  string deployment_id = 6;
  string set_id = 7;
  string deadline = 8;
  string obligation_id = 9;
}

message LaneGrantRecord {
  string lane_id = 1;
  string tenant = 2;
  string membership = 3;
  bool fork_on_touch = 4;
  bool baseline_single_writer_lease = 5;
  bool baseline_mutation = 6;
  string external_side_effects = 7;
}
