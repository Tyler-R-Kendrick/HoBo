syntax = "proto3";

package hobo.code.v1;

enum SessionLifecycleState {
  SESSION_LIFECYCLE_STATE_UNSPECIFIED = 0;
  SESSION_LIFECYCLE_STATE_STARTING = 1;
  SESSION_LIFECYCLE_STATE_RUNNING = 2;
  SESSION_LIFECYCLE_STATE_STOPPING = 3;
  SESSION_LIFECYCLE_STATE_STOPPED = 4;
  SESSION_LIFECYCLE_STATE_FAILED = 5;
}

enum PaneLifecycleState {
  PANE_LIFECYCLE_STATE_UNSPECIFIED = 0;
  PANE_LIFECYCLE_STATE_STARTING = 1;
  PANE_LIFECYCLE_STATE_RUNNING = 2;
  PANE_LIFECYCLE_STATE_EXITED = 3;
  PANE_LIFECYCLE_STATE_MISSING = 4;
}

enum AgentLifecycleState {
  AGENT_LIFECYCLE_STATE_UNSPECIFIED = 0;
  AGENT_LIFECYCLE_STATE_STARTING = 1;
  AGENT_LIFECYCLE_STATE_IDLE = 2;
  AGENT_LIFECYCLE_STATE_WORKING = 3;
  AGENT_LIFECYCLE_STATE_BLOCKED = 4;
  AGENT_LIFECYCLE_STATE_DONE = 5;
  AGENT_LIFECYCLE_STATE_FAILED = 6;
  AGENT_LIFECYCLE_STATE_STOPPED = 7;
  AGENT_LIFECYCLE_STATE_UNKNOWN = 8;
}

enum CheckpointLifecycleState {
  CHECKPOINT_LIFECYCLE_STATE_UNSPECIFIED = 0;
  CHECKPOINT_LIFECYCLE_STATE_CREATED = 1;
  CHECKPOINT_LIFECYCLE_STATE_RESTORING = 2;
  CHECKPOINT_LIFECYCLE_STATE_RESTORED = 3;
  CHECKPOINT_LIFECYCLE_STATE_FAILED = 4;
}

enum DeliveryLifecycleState {
  DELIVERY_LIFECYCLE_STATE_UNSPECIFIED = 0;
  DELIVERY_LIFECYCLE_STATE_IDLE = 1;
  DELIVERY_LIFECYCLE_STATE_READY = 2;
  DELIVERY_LIFECYCLE_STATE_PUSHING = 3;
  DELIVERY_LIFECYCLE_STATE_PULL_REQUEST_OPEN = 4;
  DELIVERY_LIFECYCLE_STATE_MERGING = 5;
  DELIVERY_LIFECYCLE_STATE_MERGED = 6;
  DELIVERY_LIFECYCLE_STATE_FAILED = 7;
}

message Session {
  string id = 1;
  string name = 2;
  string project_root = 3;
  string worktree_path = 4;
  string branch = 5;
  SessionLifecycleState lifecycle_state = 6;
  string created_at = 7;
  string updated_at = 8;
  optional bool close_on_merge = 9;
}

message Tab {
  string id = 1;
  string session_id = 2;
  string title = 3;
  optional uint32 position = 4;
}

message Pane {
  string id = 1;
  string session_id = 2;
  string tab_id = 3;
  string title = 4;
  PaneLifecycleState lifecycle_state = 5;
  string runtime_id = 6;
  string working_directory = 7;
  optional string agent_run_id = 8;
  uint32 left_column = 9;
  uint32 top_row = 10;
  uint32 width = 11;
  uint32 height = 12;
  uint32 window_width = 13;
  uint32 window_height = 14;
}

message AgentRun {
  string id = 1;
  string session_id = 2;
  string pane_id = 3;
  string provider = 4;
  optional string provider_session_id = 5;
  AgentLifecycleState lifecycle_state = 6;
  string started_at = 7;
  string updated_at = 8;
  string summary = 9;
  optional bool terminal_only = 10;
}

message Checkpoint {
  string id = 1;
  string session_id = 2;
  string git_commit = 3;
  string label = 4;
  CheckpointLifecycleState lifecycle_state = 5;
  string created_at = 6;
}

message GitState {
  string worktree_path = 1;
  string branch = 2;
  string head_sha = 3;
  string base_sha = 4;
  optional bool dirty = 5;
  optional uint32 ahead = 6;
  optional uint32 behind = 7;
  repeated string staged_paths = 8;
  repeated string unstaged_paths = 9;
  repeated string untracked_paths = 10;
}

message DeliveryState {
  DeliveryLifecycleState lifecycle_state = 1;
  string remote = 2;
  optional uint64 pull_request_number = 3;
  optional string pull_request_url = 4;
  optional string stack_parent_branch = 5;
  string message = 6;
}

message SessionSnapshot {
  string schema_version = 1;
  Session session = 2;
  repeated Tab tabs = 3;
  repeated Pane panes = 4;
  repeated AgentRun agent_runs = 5;
  repeated Checkpoint checkpoints = 6;
  GitState git_state = 7;
  DeliveryState delivery_state = 8;
  string focused_tab_id = 9;
  string focused_pane_id = 10;
  repeated string attached_client_ids = 11;
  optional uint64 revision = 12;
  string captured_at = 13;
}

message CreateSessionCommand {
  string name = 1;
  string project_root = 2;
  string branch = 3;
  string client_id = 4;
}

message DetachSessionCommand {
  string client_id = 1;
}

message ReattachSessionCommand {
  string client_id = 1;
}

message FocusPaneCommand {
  string pane_id = 1;
}

message StopSessionCommand {
  optional bool remove_worktree = 1;
}

message CreateTabCommand {
  string title = 1;
}

message CreatePaneCommand {
  string tab_id = 1;
  string title = 2;
  repeated string command = 3;
}

message SplitPaneCommand {
  string pane_id = 1;
  string direction = 2;
  string title = 3;
  repeated string command = 4;
}

message ClosePaneCommand {
  string pane_id = 1;
}

message SendInputCommand {
  string pane_id = 1;
  string input = 2;
}

message StartAgentCommand {
  string pane_id = 1;
  string provider = 2;
  repeated string command = 3;
  string prompt = 4;
}

message StopAgentCommand {
  string agent_run_id = 1;
}

message CreateCheckpointCommand {
  string label = 1;
}

message RestoreCheckpointCommand {
  string checkpoint_id = 1;
}

message CommitCommand {
  string message = 1;
}

message PushCommand {
  string remote = 1;
}

message OpenPullRequestCommand {
  string title = 1;
  string body = 2;
  optional bool draft = 3;
}

message StackPullRequestCommand {
  string parent_branch = 1;
  string title = 2;
  string body = 3;
}

message MergePullRequestCommand {
  uint64 pull_request_number = 1;
}

message SessionCommandEnvelope {
  string schema_version = 1;
  string command_id = 2;
  string actor_id = 3;
  string session_id = 4;
  optional uint64 expected_revision = 5;
  oneof command {
    CreateSessionCommand create_session = 10;
    DetachSessionCommand detach_session = 11;
    ReattachSessionCommand reattach_session = 12;
    FocusPaneCommand focus_pane = 13;
    StopSessionCommand stop_session = 14;
    CreateTabCommand create_tab = 15;
    CreatePaneCommand create_pane = 16;
    SplitPaneCommand split_pane = 17;
    ClosePaneCommand close_pane = 18;
    SendInputCommand send_input = 19;
    StartAgentCommand start_agent = 20;
    StopAgentCommand stop_agent = 21;
    CreateCheckpointCommand create_checkpoint = 22;
    RestoreCheckpointCommand restore_checkpoint = 23;
    CommitCommand commit = 24;
    PushCommand push = 25;
    OpenPullRequestCommand open_pull_request = 26;
    StackPullRequestCommand stack_pull_request = 27;
    MergePullRequestCommand merge_pull_request = 28;
  }
}

message SessionCreatedEvent {
  SessionSnapshot snapshot = 1;
}

message ClientDetachedEvent {
  string client_id = 1;
}

message ClientReattachedEvent {
  string client_id = 1;
}

message PaneFocusedEvent {
  string pane_id = 1;
}

message SessionChangedEvent {
  string change = 1;
  SessionSnapshot snapshot = 2;
}

message SessionEventEnvelope {
  string schema_version = 1;
  string event_id = 2;
  string session_id = 3;
  uint64 sequence = 4;
  string occurred_at = 5;
  string causation_id = 6;
  oneof event {
    SessionCreatedEvent session_created = 10;
    ClientDetachedEvent client_detached = 11;
    ClientReattachedEvent client_reattached = 12;
    PaneFocusedEvent pane_focused = 13;
    SessionChangedEvent session_changed = 14;
  }
}

message SessionCommandResult {
  bool accepted = 1;
  string code = 2;
  string message = 3;
  SessionSnapshot snapshot = 4;
  repeated SessionEventEnvelope events = 5;
}

// Isolation backend chosen for an agent task (ADR-0139).
message IsolationBackend {
  // "rift" | "worktree"
  string kind = 1;
  string platform = 2;
  bool cow_capable = 3;
  string reason = 4;
}

// Agent task isolation handle. Ephemeral; cleaned on every exit path.
message IsolationContext {
  string schema_version = 1;
  string run_id = 2;
  string branch = 3;
  string root_path = 4;
  IsolationBackend backend = 5;
  string station_id = 6;
  // Durable learning root lives OUTSIDE the ephemeral isolation root.
  string durable_root = 7;
  string created_at = 8;
  string status = 9; // open | cleaned | failed
}

// Promotion is the sole audited mutation path into the canonical tree.
message PromotionRequest {
  string run_id = 1;
  string isolation_root = 2;
  string target_project = 3;
  repeated string gate_results = 4;
  bool squash_only = 5;
}

message PromotionResult {
  bool ok = 1;
  string code = 2;
  string message = 3;
  string merged_branch = 4;
  bool cleaned = 5;
}

// Evidence triple for a passing Gherkin + OpenFeature scenario.
message EvidenceTriple {
  string flag_key = 1;
  string scenario = 2;
  string playwright_script_path = 3;
  string recording_mp4_path = 4;
  repeated string screenshot_paths = 5;
  string durable_root = 6;
}

// Agent semantic state for the Herdr-like multiplexer.
message AgentPaneState {
  string agent_id = 1;
  // blocked | working | done | idle
  string semantic_state = 2;
  string summary = 3;
  string highlight_buffer = 4;
}

// Budget / FinOps snapshot for inference spend (dogfoods existing FinOps).
message InferenceBudgetSnapshot {
  string provider = 1;
  double spend_usd = 2;
  double cap_usd = 3;
  bool monetization_enabled = 4;
  string routing_policy = 5;
}
