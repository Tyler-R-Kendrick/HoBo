syntax = "proto3";

package hobo.code.review.v1;

enum ReviewTargetKind {
  REVIEW_TARGET_KIND_UNSPECIFIED = 0;
  REVIEW_TARGET_KIND_WORKING_TREE = 1;
  REVIEW_TARGET_KIND_INDEX = 2;
  REVIEW_TARGET_KIND_COMMIT = 3;
  REVIEW_TARGET_KIND_RANGE = 4;
  REVIEW_TARGET_KIND_PULL_REQUEST = 5;
  REVIEW_TARGET_KIND_STACK = 6;
}

enum ReviewFileStatus {
  REVIEW_FILE_STATUS_UNSPECIFIED = 0;
  REVIEW_FILE_STATUS_ADDED = 1;
  REVIEW_FILE_STATUS_MODIFIED = 2;
  REVIEW_FILE_STATUS_DELETED = 3;
  REVIEW_FILE_STATUS_RENAMED = 4;
  REVIEW_FILE_STATUS_COPIED = 5;
  REVIEW_FILE_STATUS_TYPE_CHANGED = 6;
  REVIEW_FILE_STATUS_UNMERGED = 7;
  REVIEW_FILE_STATUS_SUBMODULE = 8;
  REVIEW_FILE_STATUS_BINARY = 9;
}

enum ReviewLineKind {
  REVIEW_LINE_KIND_UNSPECIFIED = 0;
  REVIEW_LINE_KIND_CONTEXT = 1;
  REVIEW_LINE_KIND_ADDITION = 2;
  REVIEW_LINE_KIND_DELETION = 3;
  REVIEW_LINE_KIND_NO_NEWLINE = 4;
}

enum ReviewAnchorSide {
  REVIEW_ANCHOR_SIDE_UNSPECIFIED = 0;
  REVIEW_ANCHOR_SIDE_OLD = 1;
  REVIEW_ANCHOR_SIDE_NEW = 2;
  REVIEW_ANCHOR_SIDE_FILE = 3;
}

enum ReviewCoverageState {
  REVIEW_COVERAGE_STATE_UNSPECIFIED = 0;
  REVIEW_COVERAGE_STATE_REVIEWED = 1;
  REVIEW_COVERAGE_STATE_STALE = 2;
  REVIEW_COVERAGE_STATE_EXCLUDED = 3;
}

enum ReviewActorKind {
  REVIEW_ACTOR_KIND_UNSPECIFIED = 0;
  REVIEW_ACTOR_KIND_HUMAN = 1;
  REVIEW_ACTOR_KIND_AGENT = 2;
  REVIEW_ACTOR_KIND_SYSTEM = 3;
  REVIEW_ACTOR_KIND_PROVIDER_USER = 4;
}

enum ReviewThreadOrigin {
  REVIEW_THREAD_ORIGIN_UNSPECIFIED = 0;
  REVIEW_THREAD_ORIGIN_LOCAL_HUMAN = 1;
  REVIEW_THREAD_ORIGIN_LOCAL_AGENT = 2;
  REVIEW_THREAD_ORIGIN_GITHUB = 3;
  REVIEW_THREAD_ORIGIN_SYSTEM = 4;
}

enum ReviewVisibility {
  REVIEW_VISIBILITY_UNSPECIFIED = 0;
  REVIEW_VISIBILITY_PRIVATE = 1;
  REVIEW_VISIBILITY_SESSION = 2;
  REVIEW_VISIBILITY_FORGE = 3;
}

enum ReviewThreadResolution {
  REVIEW_THREAD_RESOLUTION_UNSPECIFIED = 0;
  REVIEW_THREAD_RESOLUTION_OPEN = 1;
  REVIEW_THREAD_RESOLUTION_RESOLVED = 2;
}

enum ReviewAnchorHealth {
  REVIEW_ANCHOR_HEALTH_UNSPECIFIED = 0;
  REVIEW_ANCHOR_HEALTH_CURRENT = 1;
  REVIEW_ANCHOR_HEALTH_REANCHORED = 2;
  REVIEW_ANCHOR_HEALTH_STALE = 3;
  REVIEW_ANCHOR_HEALTH_AMBIGUOUS = 4;
  REVIEW_ANCHOR_HEALTH_OUTDATED = 5;
  REVIEW_ANCHOR_HEALTH_DELETED = 6;
}

enum ReviewPublicationState {
  REVIEW_PUBLICATION_STATE_UNSPECIFIED = 0;
  REVIEW_PUBLICATION_STATE_PRIVATE = 1;
  REVIEW_PUBLICATION_STATE_SELECTED_FOR_PUBLICATION = 2;
  REVIEW_PUBLICATION_STATE_PUBLISHED = 3;
  REVIEW_PUBLICATION_STATE_REJECTED = 4;
}

enum ReviewDecision {
  REVIEW_DECISION_UNSPECIFIED = 0;
  REVIEW_DECISION_COMMENT = 1;
  REVIEW_DECISION_APPROVE = 2;
  REVIEW_DECISION_REQUEST_CHANGES = 3;
}

enum ReviewSubmissionState {
  REVIEW_SUBMISSION_STATE_UNSPECIFIED = 0;
  REVIEW_SUBMISSION_STATE_PENDING = 1;
  REVIEW_SUBMISSION_STATE_APPLIED = 2;
  REVIEW_SUBMISSION_STATE_AMBIGUOUS = 3;
  REVIEW_SUBMISSION_STATE_RECONCILED = 4;
  REVIEW_SUBMISSION_STATE_FAILED = 5;
}

enum ReviewInboxDisposition {
  REVIEW_INBOX_DISPOSITION_UNSPECIFIED = 0;
  REVIEW_INBOX_DISPOSITION_ACTIVE = 1;
  REVIEW_INBOX_DISPOSITION_DEFERRED = 2;
  REVIEW_INBOX_DISPOSITION_IGNORED = 3;
}

enum ReviewDerivedState {
  REVIEW_DERIVED_STATE_UNSPECIFIED = 0;
  REVIEW_DERIVED_STATE_NEEDS_REVIEW = 1;
  REVIEW_DERIVED_STATE_IN_PROGRESS = 2;
  REVIEW_DERIVED_STATE_AWAITING_AGENT = 3;
  REVIEW_DERIVED_STATE_AWAITING_AUTHOR = 4;
  REVIEW_DERIVED_STATE_CHANGED_SINCE_REVIEW = 5;
  REVIEW_DERIVED_STATE_CONFLICTS = 6;
  REVIEW_DERIVED_STATE_CHECKS_FAILING = 7;
  REVIEW_DERIVED_STATE_APPROVED_BLOCKED = 8;
  REVIEW_DERIVED_STATE_READY_TO_MERGE = 9;
  REVIEW_DERIVED_STATE_CLOSED = 10;
}

enum ReviewLifecycle {
  REVIEW_LIFECYCLE_UNSPECIFIED = 0;
  REVIEW_LIFECYCLE_OPEN = 1;
  REVIEW_LIFECYCLE_CLOSED = 2;
}

message ReviewStackMemberTarget {
  string member_id = 1;
  string branch = 2;
  string commit_oid = 3;
  uint32 pull_request_number = 4;
}

message ReviewTarget {
  ReviewTargetKind kind = 1;
  string repository_id = 2;
  string repository_root = 3;
  string base_commit_oid = 4;
  string head_commit_oid = 5;
  string index_tree_oid = 6;
  string worktree_manifest_hash = 7;
  string parent_commit_oid = 8;
  string requested_base_ref = 9;
  string requested_head_ref = 10;
  string merge_base_oid = 11;
  string provider = 12;
  string host = 13;
  string repository = 14;
  uint32 number = 15;
  string base_ref = 16;
  string head_ref = 17;
  string provider_node_id = 18;
  string stack_id = 19;
  repeated ReviewStackMemberTarget members = 20;
  string aggregate_base_oid = 21;
  string aggregate_head_oid = 22;
}

message ReviewGeneration {
  string id = 1;
  string review_id = 2;
  uint32 ordinal = 3;
  ReviewTarget target = 4;
  string created_at = 5;
  string created_by = 6;
  string manifest_hash = 7;
  string diff_options_hash = 8;
  string provider_snapshot_hash = 9;
  string predecessor_generation_id = 10;
}

message ReviewFileSummary {
  string file_id = 1;
  string path_before = 2;
  string path_after = 3;
  ReviewFileStatus status = 4;
  string old_blob_oid = 5;
  string new_blob_oid = 6;
  string old_content_hash = 7;
  string new_content_hash = 8;
  string old_mode = 9;
  string new_mode = 10;
  uint32 additions = 11;
  uint32 deletions = 12;
  bool generated_hint = 13;
  bool dependency_hint = 14;
  bool binary = 15;
  bool too_large_for_inline = 16;
  uint32 hunk_count = 17;
}

message ReviewPageMetadata {
  uint32 page_size = 1;
  string next_cursor = 2;
  uint32 total_files = 3;
}

message ReviewDiffManifest {
  string generation_id = 1;
  string manifest_hash = 2;
  repeated ReviewFileSummary files = 3;
  uint32 total_files = 4;
  uint32 total_additions = 5;
  uint32 total_deletions = 6;
  uint32 binary_files = 7;
  ReviewPageMetadata pages = 8;
}

message ReviewDiffLine {
  string line_id = 1;
  ReviewLineKind kind = 2;
  uint32 old_line = 3;
  uint32 new_line = 4;
  string raw_text_hash = 5;
  string display_text = 6;
}

message ReviewHunk {
  string hunk_id = 1;
  string header = 2;
  uint32 old_start = 3;
  uint32 old_count = 4;
  uint32 new_start = 5;
  uint32 new_count = 6;
  string fingerprint = 7;
  repeated ReviewDiffLine lines = 8;
}

message ReviewDiffChunk {
  string generation_id = 1;
  string file_id = 2;
  string chunk_id = 3;
  repeated ReviewHunk hunks = 4;
  string next_cursor = 5;
}

message ReviewAnchor {
  string anchor_id = 1;
  string generation_id = 2;
  string file_id = 3;
  string path_before = 4;
  string path_after = 5;
  string base_blob_oid = 6;
  string head_blob_oid = 7;
  string base_content_hash = 8;
  string head_content_hash = 9;
  ReviewAnchorSide side = 10;
  uint32 start_line = 11;
  uint32 end_line = 12;
  string hunk_id = 13;
  string hunk_fingerprint = 14;
  string selected_content_hash = 15;
  repeated string context_before_hashes = 16;
  repeated string context_after_hashes = 17;
}

message ReviewCoverageUnit {
  string kind = 1;
  string file_id = 2;
  string hunk_id = 3;
  string stable_change_id = 4;
  string content_identity = 5;
}

message ReviewCoverageRecord {
  string coverage_id = 1;
  string review_id = 2;
  string actor_id = 3;
  ReviewActorKind actor_kind = 4;
  string generation_id = 5;
  ReviewCoverageUnit unit = 6;
  ReviewCoverageState state = 7;
  string exclusion_reason = 8;
  string reviewed_at = 9;
  string invalidated_at = 10;
  repeated string invalidation_evidence = 11;
}

message ReviewProviderThreadIdentity {
  string provider = 1;
  string thread_id = 2;
  string node_id = 3;
}

message ReviewThread {
  string thread_id = 1;
  string review_id = 2;
  ReviewThreadOrigin origin = 3;
  ReviewVisibility visibility = 4;
  ReviewAnchor anchor = 5;
  ReviewThreadResolution resolution = 6;
  ReviewAnchorHealth anchor_health = 7;
  ReviewProviderThreadIdentity provider = 8;
  repeated string message_ids = 9;
  string created_at = 10;
  string updated_at = 11;
}

message ReviewMessage {
  string message_id = 1;
  string thread_id = 2;
  string author_id = 3;
  ReviewActorKind author_kind = 4;
  string origin = 5;
  string body_hash = 6;
  string body = 7;
  string created_at = 8;
  string edited_at = 9;
  uint32 edit_revision = 10;
  string provider_comment_id = 11;
  string provider_node_id = 12;
  string reply_to_message_id = 13;
  ReviewPublicationState publication_state = 14;
}

message PreparedInlineComment {
  string message_id = 1;
  ReviewAnchor anchor = 2;
  string body_hash = 3;
}

message ReviewThreadOperation {
  string thread_id = 1;
  string operation = 2;
}

message PendingReview {
  string pending_review_id = 1;
  string review_id = 2;
  string generation_id = 3;
  string expected_provider_head_oid = 4;
  ReviewDecision decision = 5;
  string summary_body_hash = 6;
  string summary_body = 7;
  repeated string selected_message_ids = 8;
  repeated ReviewThreadOperation selected_thread_operations = 9;
  repeated PreparedInlineComment ordered_inline_comments = 10;
  string prepared_by = 11;
  string prepared_at = 12;
  string effect_digest = 13;
}

message ReviewSubmission {
  string submission_id = 1;
  string pending_review_id = 2;
  string command_id = 3;
  string effect_digest = 4;
  string provider = 5;
  ReviewSubmissionState state = 6;
  string provider_review_id = 7;
  string provider_review_node_id = 8;
  string provider_head_oid = 9;
  string receipt_hash = 10;
  string failure_code = 11;
}

message ReviewProgressSummary {
  uint32 reviewed_files = 1;
  uint32 stale_files = 2;
  uint32 unreviewed_files = 3;
  uint32 open_threads = 4;
}

message ReviewStackSummary {
  string stack_id = 1;
  uint32 member_count = 2;
  string current_member_id = 3;
}

message ReviewInboxItem {
  string item_id = 1;
  string review_id = 2;
  string target_label = 3;
  ReviewInboxDisposition manual_disposition = 4;
  ReviewDerivedState derived_state = 5;
  repeated string attention_reasons = 6;
  ReviewProgressSummary progress = 7;
  ReviewStackSummary stack = 8;
  string last_updated_at = 9;
}

message ReviewSnapshot {
  string schema_version = 1;
  string review_id = 2;
  uint64 revision = 3;
  ReviewLifecycle lifecycle = 4;
  string session_id = 5;
  string actor_id = 6;
  ReviewTarget target = 7;
  string current_generation_id = 8;
  repeated ReviewGeneration generations = 9;
  ReviewDiffManifest manifest = 10;
  repeated ReviewCoverageRecord coverage = 11;
  repeated ReviewThread threads = 12;
  repeated ReviewMessage messages = 13;
  PendingReview pending = 14;
  ReviewSubmission submission = 15;
  ReviewInboxDisposition inbox_disposition = 16;
  string created_at = 17;
  string updated_at = 18;
}

message StartReviewCommand {
  ReviewTarget target = 1;
  string session_id = 2;
  string label = 3;
}

message RefreshReviewCommand {}

message MarkReviewCoverageCommand {
  ReviewCoverageUnit unit = 1;
  ReviewCoverageState state = 2;
  string exclusion_reason = 3;
}

message CreateReviewThreadCommand {
  ReviewAnchor anchor = 1;
  string body = 2;
  ReviewVisibility visibility = 3;
  ReviewThreadOrigin origin = 4;
}

message AddReviewMessageCommand {
  string thread_id = 1;
  string body = 2;
  string reply_to_message_id = 3;
}

message EditDraftReviewMessageCommand {
  string message_id = 1;
  string body = 2;
}

message DeleteDraftReviewMessageCommand {
  string message_id = 1;
}

message RouteReviewThreadToAgentCommand {
  string thread_id = 1;
  string agent_id = 2;
  string prompt = 3;
}

message ResolveReviewThreadCommand {
  string thread_id = 1;
}

message UnresolveReviewThreadCommand {
  string thread_id = 1;
}

message PrepareReviewSubmissionCommand {
  ReviewDecision decision = 1;
  string summary_body = 2;
  repeated string selected_message_ids = 3;
}

message PublishReviewSubmissionCommand {
  string pending_review_id = 1;
  string authorization_digest = 2;
}

message ApplyReviewSuggestionCommand {
  string message_id = 1;
  string authorization_digest = 2;
}

message StageReviewSelectionCommand {
  string file_id = 1;
  string hunk_id = 2;
  uint32 start_line = 3;
  uint32 end_line = 4;
  string authorization_digest = 5;
}

message UnstageReviewSelectionCommand {
  string file_id = 1;
  string hunk_id = 2;
  uint32 start_line = 3;
  uint32 end_line = 4;
  string authorization_digest = 5;
}

message SetReviewInboxDispositionCommand {
  ReviewInboxDisposition disposition = 1;
}

message CloseReviewCommand {}

message ReviewCommandEnvelope {
  string schema_version = 1;
  string command_id = 2;
  string actor_id = 3;
  string review_id = 4;
  optional uint64 expected_revision = 5;
  oneof command {
    StartReviewCommand start_review = 10;
    RefreshReviewCommand refresh_review = 11;
    MarkReviewCoverageCommand mark_review_coverage = 12;
    CreateReviewThreadCommand create_review_thread = 13;
    AddReviewMessageCommand add_review_message = 14;
    EditDraftReviewMessageCommand edit_draft_review_message = 15;
    DeleteDraftReviewMessageCommand delete_draft_review_message = 16;
    RouteReviewThreadToAgentCommand route_review_thread_to_agent = 17;
    ResolveReviewThreadCommand resolve_review_thread = 18;
    UnresolveReviewThreadCommand unresolve_review_thread = 19;
    PrepareReviewSubmissionCommand prepare_review_submission = 20;
    PublishReviewSubmissionCommand publish_review_submission = 21;
    ApplyReviewSuggestionCommand apply_review_suggestion = 22;
    StageReviewSelectionCommand stage_review_selection = 23;
    UnstageReviewSelectionCommand unstage_review_selection = 24;
    SetReviewInboxDispositionCommand set_review_inbox_disposition = 25;
    CloseReviewCommand close_review = 26;
  }
}

message ReviewCommandResult {
  bool accepted = 1;
  string code = 2;
  string message = 3;
  ReviewSnapshot snapshot = 4;
}

message ReviewEffectApproval {
  string operation = 1;
  string command_id = 2;
  string actor_id = 3;
  string review_id = 4;
  uint64 expected_revision = 5;
  string effect_digest = 6;
  map<string, string> details = 7;
}
