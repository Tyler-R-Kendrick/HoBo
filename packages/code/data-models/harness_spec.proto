syntax = "proto3";

package hobo.code.v1;

// Agent-harness plugin spec kinds. Source of truth mirrored by
// HARNESS_SPEC_KINDS in src/harness-spec.ts.
enum HarnessSpecKind {
  HARNESS_SPEC_KIND_UNSPECIFIED = 0;
  HARNESS_SPEC_KIND_CODING_AGENT = 1;
  HARNESS_SPEC_KIND_INFERENCE = 2;
  HARNESS_SPEC_KIND_HARNESS = 3;
  HARNESS_SPEC_KIND_EVE_AGENT = 4;
  HARNESS_SPEC_KIND_SDK = 5;
}

// Config applicator dispatch. Dispatch is on format, never on agent id.
enum HarnessConfigFormat {
  HARNESS_CONFIG_FORMAT_UNSPECIFIED = 0;
  HARNESS_CONFIG_FORMAT_TOML_APPEND = 1;
  HARNESS_CONFIG_FORMAT_JSON_ENV = 2;
  HARNESS_CONFIG_FORMAT_JSON_MERGE = 3;
  HARNESS_CONFIG_FORMAT_NOTE = 4;
  HARNESS_CONFIG_FORMAT_EVE_VFS = 5;
  HARNESS_CONFIG_FORMAT_SDK_ENV = 6;
  HARNESS_CONFIG_FORMAT_SKIP = 7;
}

// Wire record for a harness plugin's config block ("Record" suffix: the TS
// domain view HarnessConfigSpec lives in src/agent-harness-adapters.ts).
message HarnessConfigSpecRecord {
  HarnessConfigFormat format = 1;
  optional string path = 2;
  repeated string configured_when = 3;
  optional string block = 4;
  map<string, string> env = 5;
  // Free-form JSON overlay for json-merge, carried JSON-encoded on the wire.
  optional string merge_json = 6;
  optional string summary = 7;
  optional string after = 8;
  optional string note = 9;
}

// Wire record for `harnesses/*.json` plugin files ("Record" suffix: the TS
// domain view HarnessSpec lives in src/agent-harness-adapters.ts).
message HarnessSpecRecord {
  // "hobo.code.harness-spec/v1"; optional in wire JSON for back-compat.
  optional string schema = 1;
  string id = 2;
  string label = 3;
  HarnessSpecKind kind = 4;
  optional bool host = 5;
  repeated string binaries = 6;
  repeated string config_paths = 7;
  optional string command = 8;
  optional uint32 seat = 9;
  repeated string cwd_markers = 10;
  repeated string package_names = 11;
  optional HarnessConfigSpecRecord config = 12;
}
