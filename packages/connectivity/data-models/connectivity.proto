syntax = "proto3";

package hobo.connectivity.v1;

// Wire form for tenant-scoped usage metering events.
message UsageEventRecord {
  string tenant_id = 1;
  string event_type = 2;
  string resource = 3;
  double quantity = 4;
  string unit = 5;
  string timestamp = 6;
}

// Wire form for a hierarchical named endpoint registration.
message NamedEndpointRecord {
  string tenant_id = 1;
  string resource = 2;
  string hostname = 3;
  string url = 4;
  string mode = 5; // local | overlay
  string backend_url = 6;
}

// Wire form for a public DNS entrypoint suggestion/record.
message PublicDnsEntrypointRecord {
  string tenant_id = 1;
  string hostname = 2;
  string gateway_hostname = 3;
  string managed_by = 4; // hobo | cloud-provider | none
  string provider = 5;
}
