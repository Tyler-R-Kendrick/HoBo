syntax = "proto3";

package hobo.swe.gemini.v1;

// Wire records for the Gemini SWE agent adapter (@hobo/swe-gemini,
// HOBO-723). CUE constraints in swe_gemini.cue bound every type declared
// here; the runtime parses untrusted documents into derived parsed types
// before use.

// The stock-ACP launch spec (no protocol shim — command + flag only).
message GeminiLaunchRecord {
  string command = 1;
  repeated string args = 2;
  string cwd = 3;
  string credential_env = 4;
}

// One golden-transcript step the replay lane replays.
message TranscriptStepRecord {
  string kind = 1;
  string value = 2;
  string tool_call_id = 3;
}

// The SWE-task input handed to the adapter.
message SweTaskRecord {
  string task_id = 1;
  string instruction = 2;
  string workspace = 3;
}

// The report derived purely from the session's audit facts.
message SweTaskReportRecord {
  string schema = 1;
  string task_id = 2;
  string session_id = 3;
  string stop_reason = 4;
  repeated string edits = 5;
  repeated string refusals = 6;
  bool completed = 7;
}
