syntax = "proto3";
package hobo.contract_harness.v1;
import "google/protobuf/struct.proto";

message PactParticipant { string name = 1; }
message PactRequest {
  string method = 1;
  string path = 2;
  map<string, string> headers = 3;
  google.protobuf.Struct body = 4;
}
message PactResponse {
  uint32 status = 1;
  map<string, string> headers = 2;
  google.protobuf.Struct body = 3;
  PactMatchingRules matching_rules = 4;
}
// Pact v3 response matchingRules as a pact file carries them: body rules keyed by path.
message PactMatchingRules {
  map<string, PactMatchingRule> body = 1;
}
message PactMatchingRule {
  string combine = 1;
  repeated ResponseMatcher matchers = 2;
}
// A Pact v3 provider state an interaction needs (src/provider-states.ts).
message PactProviderState {
  string name = 1;
  google.protobuf.Struct params = 2;
}
message PactInteraction {
  string description = 1;
  PactRequest request = 2;
  PactResponse response = 3;
  repeated PactProviderState provider_states = 4;
}
message PactSpecification { string version = 1; }
message PactMetadata {
  PactSpecification pact_specification = 1;
  string verified_against = 2;
}
message PactDocument {
  PactParticipant consumer = 1;
  PactParticipant provider = 2;
  repeated PactInteraction interactions = 3;
  PactMetadata metadata = 4;
}
message InteractionFailure { string description = 1; string reason = 2; }
message VerificationReport {
  string provider_name = 1;
  bool ok = 2;
  repeated InteractionFailure failures = 3;
}

// Provider verification over real HTTP (src/http-provider.ts). The endpoint a
// pact is verified against, and one exchange with it.
message HttpProviderTarget {
  string name = 1;
  string base_url = 2;
  string host = 3;
  string ca = 4;
  uint32 timeout_ms = 5;
  uint32 max_response_bytes = 6;
}
message HttpExchangeRequest {
  string method = 1;
  string path = 2;
  map<string, string> headers = 3;
  string body = 4;
}
message HttpExchangeResponse {
  uint32 status = 1;
  map<string, string> headers = 2;
  string body = 3;
}
// One entry of the mirror.cloud emulator's journal (src/mirror-lane.ts).
message MirrorJournalEntry {
  string request_id = 1;
  string service_id = 2;
  string operation = 3;
  string tier = 4;
  uint32 status = 5;
  string error_code = 6;
}
// A Pact v3 response matching rule as src/matching.ts applies it: regex,
// type (with min and max for an array) or equality, combined AND or OR.
message ResponseMatcher {
  string match = 1;
  string regex = 2;
  optional uint32 min = 3;
  optional uint32 max = 4;
}
message ResponseMatchingRule {
  string path = 1;
  repeated ResponseMatcher matchers = 2;
  string combine = 3;
}
// A provider verification the mirror lane prints (src/mirror-lane.ts).
message MirrorLaneReport {
  string consumer = 1;
  string provider = 2;
  uint32 interactions = 3;
  bool ok = 4;
  repeated InteractionFailure failures = 5;
}
