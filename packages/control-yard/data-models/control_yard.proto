syntax = "proto3";

package hobo.control_yard.v1;

// Yard visual-state wire shapes (projection-driven; no invented lifecycle).

message YardZoneRef {
  string zone_id = 1;
  double anchor_x = 2;
  double anchor_y = 3;
}

message BoVisualState {
  string state = 1; // idle | walking | occupying | resolving | error
  string animation_id = 2;
  string zone_id = 3;
  string facing = 4; // east | west
}

message CostMeterVisual {
  double fill = 1;
  double heat = 2;
  double quota_used = 3;
  double quota_limit = 4;
  double spend_cap_usd = 5;
}

message TrafficVisual {
  double rate = 1;
  bool active = 2;
}

message GenerativeSheetRef {
  string kind = 1;
  string title = 2;
  string confirm_op = 3;
}
