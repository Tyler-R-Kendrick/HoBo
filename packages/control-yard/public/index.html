<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HoBo Yard — Control Plane</title>
    <link rel="stylesheet" href="./yard.css" />
  </head>
  <body>
    <div id="chrome">
      <header>
        <h1>HoBo Yard</h1>
        <p class="tag">Control-plane game UI · ADR-0135 · DESIGN.md rubberhose · site Bo sheets</p>
      </header>
      <div id="hud">
        <span id="status">booting…</span>
        <span id="seq"></span>
        <span id="occupy"></span>
        <span id="rail"></span>
        <span id="conn"></span>
      </div>
      <div id="actions">
        <button type="button" data-action="init">station init</button>
        <button type="button" data-action="up">station up</button>
        <button type="button" data-action="publish-rail">publish rail</button>
        <button type="button" data-action="activate-rail">activate rail</button>
        <button type="button" data-action="create-conn">create connection</button>
        <button type="button" data-action="authorize-conn">authorize connection</button>
        <button type="button" data-action="down">station down</button>
      </div>
    </div>
    <main>
      <div id="yard" role="img" aria-label="HoBo Yard platform"></div>
      <aside id="sheet" hidden>
        <header>
          <h2 id="sheet-title">Sheet</h2>
          <button type="button" id="sheet-close" aria-label="Close sheet">×</button>
        </header>
        <p id="sheet-desc"></p>
        <form id="sheet-form"></form>
        <div id="sheet-stream"></div>
        <footer>
          <button type="button" id="sheet-confirm">Confirm</button>
        </footer>
      </aside>
    </main>
    <p id="help">
      Click zones: Platform · Bootstrap Desk · Rail · Connection Bay · Policy Board · Cost Booth · Error Bunker.
      Bo walks to the zone; generative sheet opens from schema + projection.
    </p>
    <script type="module" src="./dist/yard.js"></script>
  </body>
</html>
