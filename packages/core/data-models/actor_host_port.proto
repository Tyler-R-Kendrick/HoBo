syntax = "proto3";

package hobo.core.v1;

// Canonical ActorHost port wire records (ADR-0155). The behavioral host
// interface (acquire/state/append/read) is TypeScript-only in
// src/ports/actor-host.ts; these are the lease/fold record shapes.
// Fence tokens ride as decimal strings (bigint-safe).

message ActorLeaseRecord {
  string key = 1;
  string holder_id = 2;
  // Decimal string; strictly increasing per key.
  string fence_token = 3;
  // RFC3339 timestamp.
  string expires_at = 4;
}

message FoldEventRecord {
  string type = 1;
  // JSON-serialized open payload.
  string payload_json = 2;
}

message ActorAppendResultRecord {
  string stream_id = 1;
  uint64 seq = 2;
  string fence_token = 3;
}
