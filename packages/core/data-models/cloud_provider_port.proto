syntax = "proto3";

package hobo.core.v1;

// Canonical CloudProvider port wire records (ADR-0156). The behavioral
// interface (satisfies/estimateCost/realize/client) is TypeScript-only in
// src/ports/cloud-provider.ts; these are the record shapes that cross the
// boundary. "Record" suffix per core convention to keep generated wire
// types distinct from parse-don't-validate domain types.

message PortRequestRecord {
  string port = 1;
  repeated string features = 2;
  // "prefer" | "require"
  string negotiation = 3;
  string region = 4;
}

message CapabilityMatchRecord {
  // "full" | "partial" | "none"
  string kind = 1;
  repeated string missing = 2;
}

message FreeTierRecord {
  string unit = 1;
  double included = 2;
  string reset = 3;
}

message CostSignalRecord {
  string currency = 1;
  string sku = 2;
  string unit = 3;
  string marginal_price = 4;
  FreeTierRecord free_tier = 5;
  // Static hints are estimates; unknown is never a verified zero price.
  optional string pricing_status = 6;
}

message IacResourceRecord {
  string name = 1;
  string type = 2;
  string provider = 3;
  // JSON-serialized inputs object.
  string inputs_json = 4;
  repeated string outputs = 5;
}

message IacProgramRecord {
  // Always "hobo.iac-program/v1".
  string api_version = 1;
  // Always "iac-program".
  string kind = 2;
  string provider = 3;
  string deployment_id = 4;
  string stack = 5;
  repeated IacResourceRecord resources = 6;
  map<string, string> stack_outputs = 7;
}

message BuildArtifactRecord {
  string id = 1;
  string source = 2;
  string target = 3;
}

message BuildSpecRecord {
  // Always "hobo.build-spec/v1".
  string kind = 1;
  repeated BuildArtifactRecord artifacts = 2;
}

message ResourcePlanRecord {
  string name = 1;
  string port = 2;
  string provider = 3;
  // JSON-serialized provider typed-option blocks (ADR-0007).
  repeated string options_json = 4;
  repeated string deps = 5;
  string strategy = 6;
  string region = 7;
  string deployment_id = 8;
  BuildArtifactRecord build = 9;
}
