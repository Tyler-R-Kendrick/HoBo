syntax = "proto3";

package hobo.core.v1;

// Legal-jurisdiction vocabulary for placement/residency (ADR-0146): the typed
// join between provider region tokens and the legal districts that
// residency/compliance rules reason over. Regions are provider facts;
// jurisdictions are legal facts; the mapping is the platform's.

message JurisdictionRecord {
  string id = 1; // eu | eea | us | us-gov | uk | ch | ca | au | in | jp | br | global
  string name = 2;
  // Citations for the legal basis (e.g. GDPR, adequacy decision, FedRAMP).
  repeated string legal_basis = 3;
}

message RegionJurisdictionMappingRecord {
  string region = 1; // normalized provider region token
  repeated string jurisdictions = 2; // JurisdictionRecord ids the region sits in
}

message ResidencyConstraintRecord {
  // Data classifications the constraint applies to; empty = all data.
  repeated string classifications = 1; // public|internal|pii|phi|pci|secret
  repeated string allowed_jurisdictions = 2;
  repeated string denied_jurisdictions = 3;
}

// A lawful cross-border transfer edge between two jurisdictions (ADR-0146
// v2): adequacy decisions and standard contractual clauses as DATA, never
// code. Consulted only when an evaluation opts in via transfer_mechanisms.
message TransferMechanismRecord {
  string from_jurisdiction = 1;
  string to_jurisdiction = 2;
  string mechanism = 3; // adequacy | scc
  // Citations (decision/instrument names), informational — never a dependency.
  repeated string legal_basis = 4;
}

// The lawful basis an ok evaluation relied on. intra-jurisdiction = the
// region sits directly inside an allowed jurisdiction (no transfer).
message TransferBasisRecord {
  string mechanism = 1; // intra-jurisdiction | adequacy | scc
  string from_jurisdiction = 2;
  string to_jurisdiction = 3;
  repeated string legal_basis = 4;
}

message ResidencyEvaluationRecord {
  bool ok = 1;
  string code = 2; // "" | region-unmapped | jurisdiction-denied | jurisdiction-not-allowed
  string region = 3;
  repeated string region_jurisdictions = 4;
  string remediation = 5;
  TransferBasisRecord transfer_basis = 6;
}
