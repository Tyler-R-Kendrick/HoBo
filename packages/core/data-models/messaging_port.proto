syntax = "proto3";

package hobo.core.v1;

// Messaging plane wire records (wasi:messaging / topic()).
// ADR-0138: unified delivery guarantees, consumer groups, DLQ, audit facts.
// Runtime domain types parse these into branded TS types (parse-don't-validate).

enum DeliveryGuarantee {
  DELIVERY_GUARANTEE_UNSPECIFIED = 0;
  // Portable default across all backends.
  DELIVERY_GUARANTEE_AT_LEAST_ONCE = 1;
  // Capability-gated: Kafka transactions / idempotent producers, etc.
  DELIVERY_GUARANTEE_EXACTLY_ONCE = 2;
  DELIVERY_GUARANTEE_AT_MOST_ONCE = 3;
}

enum ActorPlacementMode {
  ACTOR_PLACEMENT_MODE_UNSPECIFIED = 0;
  // Native lease + fence (runtime-local / in-process).
  ACTOR_PLACEMENT_MODE_NATIVE = 1;
  // Dapr virtual actors + placement service.
  ACTOR_PLACEMENT_MODE_DAPR = 2;
}

message TopicSpec {
  string name = 1;
  string tenant_id = 2;
  string project_id = 3;
  DeliveryGuarantee delivery = 4;
  string dead_letter_topic = 5;
  string schema_ref = 6;
  map<string, string> labels = 7;
}

message SubscriptionSpec {
  string name = 1;
  string topic = 2;
  string consumer_group = 3;
  string tenant_id = 4;
  DeliveryGuarantee delivery = 5;
  uint32 max_delivery_attempts = 6;
  string dead_letter_topic = 7;
}

message MessagingSpec {
  string id = 1;
  string tenant_id = 2;
  repeated TopicSpec topics = 3;
  repeated SubscriptionSpec subscriptions = 4;
  string backend = 5; // "native-kafka" | "dapr-pubsub" | "local-memory" | ...
}

message PublishRequest {
  string topic = 1;
  string key = 2;
  string body_json = 3;
  string idempotency_key = 4;
  string content_type = 5;
  map<string, string> headers = 6;
  string tenant_id = 7;
}

message PublishedMessage {
  string message_id = 1;
  string topic = 2;
  string partition_key = 3;
  int64 offset = 4;
  string published_at = 5;
  bool deduped = 6;
}

message ConsumedMessage {
  string message_id = 1;
  string topic = 2;
  string consumer_group = 3;
  string body_json = 4;
  int32 delivery_attempt = 5;
  string lease_id = 6;
  string received_at = 7;
  map<string, string> headers = 8;
}

message MessagingEventRecord {
  string type = 1;
  string topic = 2;
  string message_id = 3;
  string consumer_group = 4;
  string tenant_id = 5;
  string reason = 6;
}
