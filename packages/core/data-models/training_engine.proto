syntax = "proto3";

package hobo.core.v1;

// Training-engine port records (ADR-0025 / ADR-0125). The fully-qualified
// message name is the schema identity; implementation code imports the
// generated types from src/_generated (never hand-written parallels).

// OpenInference span kinds (Arize OpenInference semantic conventions).
enum OpenInferenceSpanKind {
  OPEN_INFERENCE_SPAN_KIND_UNSPECIFIED = 0;
  OPEN_INFERENCE_SPAN_KIND_LLM = 1;
  OPEN_INFERENCE_SPAN_KIND_CHAIN = 2;
  OPEN_INFERENCE_SPAN_KIND_TOOL = 3;
  OPEN_INFERENCE_SPAN_KIND_RETRIEVER = 4;
  OPEN_INFERENCE_SPAN_KIND_RERANKER = 5;
  OPEN_INFERENCE_SPAN_KIND_EMBEDDING = 6;
  OPEN_INFERENCE_SPAN_KIND_AGENT = 7;
  OPEN_INFERENCE_SPAN_KIND_GUARDRAIL = 8;
  OPEN_INFERENCE_SPAN_KIND_EVALUATOR = 9;
  OPEN_INFERENCE_SPAN_KIND_PROMPT = 10;
}

// ADR-0048: the demarcated engine-owned region of a trainable method.
message GeneratedRegion {
  string region_id = 1;
  string artifact_ref = 2;
  uint32 start_offset = 3;
  uint32 end_offset = 4;
  string owner = 5;
}

message TrajectoryAgent {
  string id = 1;
  string principal_ref = 2;
}

message TrajectoryRun {
  string id = 1;
  string tenant_id = 2;
  string bindle = 3;
  TrajectoryAgent agent = 4;
}

message TrajectorySubject {
  string method = 1;
  string contract_ref = 2;
  GeneratedRegion generated_region = 3;
}

message OpenInferenceSpan {
  string id = 1;
  string parent_id = 2;
  OpenInferenceSpanKind kind = 3;
  string name = 4;
  string start_time = 5;
  string end_time = 6;
  map<string, string> attributes = 7;
  string inputs_json = 8;
  string outputs_json = 9;
}

message TrajectoryReward {
  string source = 1;
  string rubric_ref = 2;
  string event_id = 3;
  double score = 4;
  string observed_at = 5;
}

// ADR-0099: sensitive payloads are tokenized or run-scoped encrypted refs;
// cleartext values ride value_json only for public classifications.
message TrajectoryPayload {
  string classification = 1;
  string redaction = 2;
  string token_ref = 3;
  string encrypted_ref = 4;
  string value_json = 5;
}

message Trajectory {
  string id = 1;
  string traceparent = 2;
  TrajectoryRun run = 3;
  TrajectorySubject subject = 4;
  repeated OpenInferenceSpan spans = 5;
  map<string, TrajectoryPayload> payloads = 6;
  TrajectoryReward reward = 7;
}

message TrainingRubric {
  string id = 1;
  string objective = 2;
  map<string, double> thresholds = 3;
}

message ContractRef {
  string ref = 1;
  string method = 2;
  string allowed_region_id = 3;
}

message OptimizeRequest {
  string request_id = 1;
  GeneratedRegion generated_region = 2;
  repeated Trajectory trajectories = 3;
  TrainingRubric rubric = 4;
  ContractRef contract = 5;
}

message CandidateEdit {
  uint32 start_offset = 1;
  uint32 end_offset = 2;
  string replacement = 3;
}

// ADR-0048: region-scoped source rewrite.
message CandidatePatch {
  GeneratedRegion region = 1;
  repeated CandidateEdit edits = 2;
}

// ADR-0125: the serialized-optimized-program candidate form, applied at
// component instantiation. program_json carries a TrainingArtifactProgram.
message TrainingArtifact {
  string engine_id = 1;
  string engine_version = 2;
  string method_ref = 3;
  string program_json = 4;
}

// The platform-normalized artifact program: tuned instructions plus
// high-reward recorded executions as demos; engine_payload_json is the
// engine's own serialized program, opaque to the platform.
message TrainingArtifactProgram {
  string instructions = 1;
  repeated ProgramDemo demos = 2;
  string engine_payload_json = 3;
}

message ProgramDemo {
  string input_json = 1;
  string output_json = 2;
}

message CandidateProvenance {
  repeated string trajectory_hashes = 1;
  string rubric_ref = 2;
  string contract_ref = 3;
}

message TrainingCandidate {
  string id = 1;
  string engine_id = 2;
  CandidateProvenance provenance = 3;
  oneof body {
    CandidatePatch patch = 4;
    TrainingArtifact artifact = 5;
  }
}
