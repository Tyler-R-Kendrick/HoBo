syntax = "proto3";

package hobo.dispatcher.v1;

// Wire records for ADR-0071 Dispatcher decisions: credit/budget-aware
// deterministic selection across registered providers for placement,
// dispatch, and traffic. Promoted from
// src/draft/technical-proofs/dispatcher-maximize-credits-contract.

message CreditGrantRecord {
  string credit_id = 1;
  double free_headroom = 2;
  optional string expires_at = 3;
  optional string window_end = 4;
}

message CreditAccountRecord {
  string provider_id = 1;
  string dimension = 2;
  optional string currency = 3;
  optional double list_unit_cost = 4;
  optional double free_headroom = 5;
  optional double rate_headroom = 6;
  optional double concurrency_headroom = 7;
  optional double budget_cap = 8;
  optional double spend_to_date = 9;
  optional double reserved_units = 10;
  repeated CreditGrantRecord credits = 11;
  optional double reserved_cost = 12;
}

message ReservedCreditConsumptionRecord {
  string credit_id = 1;
  double units = 2;
}

message ReservedConsumptionRecord {
  double free_headroom = 1;
  repeated ReservedCreditConsumptionRecord credits = 2;
  optional double rate_units = 3;
  optional uint32 concurrency_slots = 4;
}

message ReservationRecord {
  string reservation_id = 1;
  string provider_id = 2;
  string dimension = 3;
  double units = 4;
  uint64 expected_seq = 5;
  uint64 committed_seq = 6;
  string status = 7;
  optional string expires_at = 8;
  optional string release_reason = 9;
  optional double reserved_cost = 10;
  optional double actual_cost = 11;
  optional string command_hash = 12;
  optional double unit_cost = 13;
  optional double switching_cost = 14;
  optional string dispatch_request_hash = 15;
  optional string decision_input_json = 16;
  optional double estimated_cost = 17;
  optional ReservedConsumptionRecord consumption = 18;
  optional uint64 confirmed_seq = 19;
  optional uint64 released_seq = 20;
  optional uint64 provider_usage_seq = 21;
  optional uint64 started_seq = 22;
  optional string usage_evidence_ref = 23;
}

message SettlementCommandRecord {
  string reservation_id = 1;
  optional double actual_cost = 2;
  optional uint64 provider_usage_seq = 3;
  optional bool usage_finalized = 4;
  optional string usage_evidence_ref = 5;
}

message LedgerTimeAdvancedRecord {
  string as_of = 1;
  uint64 ledger_seq = 2;
}

message CreditLedgerViewRecord {
  string view = 1;
  uint64 seq = 2;
  optional string digest = 3;
  optional string as_of = 4;
  repeated CreditAccountRecord accounts = 5;
  repeated ReservationRecord reservations = 6;
}

message DispatchCandidateRecord {
  string id = 1;
  string provider_id = 2;
  string category = 3;
  bool registered = 4;
  string dimension = 5;
  double list_unit_cost = 6;
  double switching_cost = 7;
}

message PlacementCandidateRecord {
  string definition_id = 1;
  string provider_id = 2;
  bool registered = 3;
  string resource_type = 4;
  string dimension = 5;
  double list_unit_cost = 6;
  double specificity = 7;
  int32 priority = 8;
  optional string region = 9;
  double switching_cost = 10;
}

message HysteresisInputRecord {
  string incumbent_provider_id = 1;
  double minimum_savings = 2;
  string dwell_window = 3;
  string observed_at = 4;
  optional string savings_since = 5;
  optional string challenger_provider_id = 6;
}

message RankedCandidateRecord {
  string provider_id = 1;
  string category = 2;
  string dimension = 3;
  uint32 rank = 4;
  double effective_marginal_cost = 5;
  double total_cost = 6;
  double free_units = 7;
  double paid_units = 8;
  double switching_cost = 9;
  bool budget_exceeded = 10;
  string credit_facts = 11;
  optional string next_credit_expires_at = 12;
  string rationale = 13;
  bool eligible = 14;
  optional string rejection_reason = 15;
}

message LedgerInputRecord {
  string view = 1;
  uint64 seq = 2;
  string reservation_id = 3;
  string balance_hash = 4;
}

message DispatchDecidedRecord {
  string dispatch_id = 1;
  string category = 2;
  string selected_provider = 3;
  string objective = 4;
  LedgerInputRecord ledger_input = 5;
  repeated RankedCandidateRecord candidates = 6;
}
