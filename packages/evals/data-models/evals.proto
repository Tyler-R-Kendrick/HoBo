syntax = "proto3";

package hobo.evals.v1;

// Wire shapes for the evals rubric + promotion-gate engine (docs/plans/0017
// F25, design PLAN-23): schema-versioned rubric records, deterministic
// scored-run reports (mirroring the conformance report vocabulary), and the
// promotion verdict Gatekeeper composes as its evals dimension.
// Design-time contract artifacts; unknown-typed sides travel JSON-encoded.

message RubricCriterion {
  string id = 1;
  string description = 2;
  double weight = 3; // finite, > 0
  string kind = 4; // boolean | scale | golden-match
  double pass_threshold = 5; // [0,1]; boolean/golden-match imply 1
  string expected_json = 6; // golden-match only: canonical JSON of the blessed value
  bool required = 7; // hard gate: failing it fails the rubric
}

message Rubric {
  string schema = 1; // hobo.evals.rubric/v1
  string id = 2;
  double pass_threshold = 3; // [0,1] weighted-total floor
  repeated RubricCriterion criteria = 4;
}

message ValueDiff {
  string path = 1; // first diverging path, $-rooted
  string expected_json = 2;
  string actual_json = 3;
}

message CriterionScore {
  string criterion_id = 1;
  string kind = 2;
  double weight = 3;
  double pass_threshold = 4;
  double score = 5; // [0,1]
  bool passed = 6;
  ValueDiff diff = 7; // golden-match mismatch only
}

message EvalsFailure {
  string code = 1; // criterion.below-threshold | criterion.required-failed | rubric.total-below-threshold
  string criterion_id = 2;
  string message = 3;
}

message RubricReport {
  string schema = 1; // hobo.evals.rubric-report/v1
  bool ok = 2;
  string rubric_id = 3;
  double pass_threshold = 4;
  double weighted_total = 5;
  repeated CriterionScore scores = 6;
  repeated EvalsFailure failures = 7;
}

message GateReason {
  string code = 1; // machine-readable, evals.*-prefixed
  string message = 2;
}

message PromotionGateVerdict {
  bool ok = 1;
  repeated GateReason reasons = 2;
}
