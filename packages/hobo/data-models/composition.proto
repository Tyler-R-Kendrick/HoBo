syntax = "proto3";

package hobo.hobo.v1;

// Explicit fixture composition evidence and product local-deployment contracts.
//
// Runtime composition evidence and the durable self-hosted deployment receipt.
// Receipt fields are public metadata only; local control bearer material is
// held in a separate owner-only file and never enters the event log.
message ComposedRuntimeManifest {
  string lane = 1;               // e.g. "local-mocked"
  string event_store = 2;        // e.g. "runtime-local"
  string actor_host = 3;         // e.g. "data.in-memory"
  string executor = 4;           // e.g. "cloud.in-process"
  string iac_backend = 5;        // e.g. "in-memory-mock"
  repeated string providers = 6; // registered provider ids
  repeated string verbs = 7;     // composed CLI verbs
}


message LocalDeploymentReceipt {
  string schema_version = 1;
  string project_dir = 2;
  string hobo_home = 3;
  int32 pid = 4;
  string primary_url = 5;
  string control_url = 6;
  string lease_id = 7;
  string started_at = 8;
  string bindle_name = 9;
  string component_host = 10;
  string broker_id = 11;
  string camp_id = 12;
  string provider_id = 13;
  uint32 port = 14;
  int32 probe_status = 15;
  string expires_at = 16;
  string content_fingerprint = 17;
}

message LocalDeploymentLaunch {
  string project_dir = 1;
  string hobo_home = 2;
  string component_host = 3;
  string lease_id = 4;
  string bindle_name = 5;
  string broker_id = 6;
  string camp_id = 7;
  string provider_id = 8;
  uint32 port = 9;
  uint32 ttl_seconds = 10;
  string content_fingerprint = 11;
}

message LocalDeploymentLifecycleEvent {
  LocalDeploymentReceipt receipt = 1;
  string reason = 2;
}
