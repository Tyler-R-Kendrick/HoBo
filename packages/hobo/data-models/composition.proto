syntax = "proto3";

package hobo.hobo.v1;

// Architecture-guard evidence for the @hobo/hobo composition-root app package.
//
// @hobo/hobo introduces NO new wire records — it composes existing runtimes and
// verbs. This proto exists only to describe the composed default runtime
// manifest as a design-time contract artifact; it is not compiled or imported at
// runtime. Its single record is constrained by data-models/composition.cue.
message ComposedRuntimeManifest {
  string lane = 1;               // e.g. "local-mocked"
  string event_store = 2;        // e.g. "runtime-local"
  string actor_host = 3;         // e.g. "data.in-memory"
  string executor = 4;           // e.g. "cloud.in-process"
  string iac_backend = 5;        // e.g. "in-memory-mock"
  repeated string providers = 6; // registered provider ids
  repeated string verbs = 7;     // composed CLI verbs
}
