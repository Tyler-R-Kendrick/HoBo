syntax = "proto3";
package hobo.hosting.credentials.v1;

message HostingCredentialScopeRequest {
  string tenant_id = 1;
  string provider_id = 2;
  string provider_account_id = 3;
  string credential_ref = 4;
  string operation_id = 5;
  double now_ms = 6;
}

message HostingCredentialScopeBinding {
  string tenant_id = 1;
  string provider_id = 2;
  string provider_account_id = 3;
  string credential_ref = 4;
  string credential_version = 5;
  string native_account_ref = 6;
  string evidence_ref = 7;
  double observed_at_ms = 8;
  double valid_until_ms = 9;
  string credential_digest = 10;
}

message HostingCredentialScopeChallenge {
  HostingCredentialScopeRequest request = 1;
  string challenge_id = 2;
}

message HostingCredentialScopeClaims {
  string schema_version = 1;
  string attestation_id = 2;
  string issuer_id = 3;
  string key_id = 4;
  HostingCredentialScopeBinding binding = 5;
  string operation_id = 6;
  string challenge_id = 7;
  double issued_at_ms = 8;
  double expires_at_ms = 9;
}

message HostingCredentialScopeAttestation {
  HostingCredentialScopeClaims claims = 1;
  string signature = 2;
}

message HostingCredentialScopeUse {
  string issuer_id = 1;
  string key_id = 2;
  string attestation_id = 3;
  string operation_id = 4;
  string proof_digest = 5;
  double consumed_at_ms = 6;
  double expires_at_ms = 7;
}
