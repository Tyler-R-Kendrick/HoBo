syntax = "proto3";

package hobo.iac.terraform.v1;

// Wire records for the HCL-lane IaC adapter (@hobo/iac-terraform). CUE
// constraints in iac_terraform.cue bound every type declared here; the runtime
// parses untrusted input into the derived parsed domain program before use.

enum IacChangeOp {
  IAC_CHANGE_OP_UNSPECIFIED = 0;
  IAC_CHANGE_OP_CREATE = 1;
  IAC_CHANGE_OP_UPDATE = 2;
  IAC_CHANGE_OP_DELETE = 3;
}

message IacResourceSpec {
  string name = 1;
  string type = 2;
  string provider = 3;
  repeated string outputs = 4;
}

message IacProgramSpec {
  string api_version = 1;
  string kind = 2;
  // "terraform" or "opentofu" — one adapter, two interchangeable binaries.
  string provider = 3;
  string deployment_id = 4;
  string stack = 5;
  repeated IacResourceSpec resources = 6;
}

message IacChange {
  IacChangeOp op = 1;
  string resource = 2;
  string workspace_key = 3;
  string reason = 4;
}

message IacDiff {
  string kind = 1;
  string provider = 2;
  string model = 3;
  repeated IacChange changes = 4;
  bool dirty = 5;
}

message IacDriftedResource {
  string name = 1;
  string workspace_key = 2;
  string reason = 3;
}

message IacDriftReport {
  string kind = 1;
  string provider = 2;
  string model = 3;
  bool drifted = 4;
  repeated IacDriftedResource resources = 5;
}

message IacResourceOutputs {
  string id = 1;
  string workspace_key = 2;
  string status = 3;
  map<string, string> outputs = 4;
}

message IacOutputs {
  string kind = 1;
  string provider = 2;
  string model = 3;
  map<string, IacResourceOutputs> resources = 4;
  map<string, string> stack_outputs = 5;
  map<string, string> bindings = 6;
}

message StateBackendConfig {
  string kind = 1;
  string lock_holder = 2;
}

// The plan summary parsed from `show -json` (parsePlanChanges).
message PlanChangeSummary {
  uint32 create = 1;
  uint32 update = 2;
  uint32 delete = 3;
}
