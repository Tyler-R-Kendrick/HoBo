syntax = "proto3";

package hobo.draft.v1;

// Architecture-guard evidence for the S3-02 @hobo/identity draft POC.
// Design-time contract artifact; not compiled at runtime.

message AttestationBinding {
  string run_id = 1;
  string tenant = 2;
  PrincipalRef parent_principal = 3;
  CodeVersion code_version = 4;
  string component_image_digest = 5;
}

message PrincipalRef {
  string kind = 1;
  string id = 2;
}

message CodeVersion {
  string digest = 1;
  string version = 2;
}

message ScopeEntry {
  string port = 1;
  string resource = 2;
  repeated string verbs = 3;
}

message JwtSvidRecord {
  string identity_id = 1;
  string subject = 2;
  string svid_ref = 3;
  repeated ScopeEntry scope = 4;
  string expires_at = 5;
  string signer_kid = 6;
}

message IdentityIssuedEventData {
  string identity_id = 1;
  string subject = 2;
  string svid_ref = 3;
  repeated ScopeEntry scope = 4;
  string expires_at = 5;
}

message IdentityRotatedEventData {
  string identity_id = 1;
  string previous_identity_id = 2;
  string subject = 3;
  string svid_ref = 4;
  string expires_at = 5;
}

message IdentityServiceEvidence {
  string issue = 1;
  string summary = 2;
  repeated string event_families = 3;
}

// Token-broker records (S2-04). The broker mints per-deploy scoped tokens bound
// to an SVID; token events share the identity events' never-compact retention.

message TokenScope {
  string port = 1;
  string resource = 2;
  string action = 3;
}

message VaultedCredentialRef {
  string reference = 1;
}

message TokenGrantRecord {
  string grant_id = 1;
  string svid_subject = 2;
  string svid_identity_id = 3;
  TokenScope scope = 4;
  string deploy_id = 5;
  string audience = 6;
  string issued_at = 7;
  string expires_at = 8;
  string token_ref = 9;
  string vault_reference = 10;
  string credential_source = 11;   // "oidc-federation" | "vault-static-key" | "connection-obo"
  string provider_token_ref = 12;  // set when credential_source = oidc-federation
  string connection_id = 13;       // set when issued via first-class Connection
}

// First-class durable Connection aggregate (broker-owned).
// credential_ref is an opaque vault reference — never a raw secret.
message ConnectionRecord {
  string schema_version = 1;
  string id = 2;
  string alias = 3;
  string provider = 4;
  // oidc-federation | oauth2-xaa | oauth2-obo | device-code | api-key | app-install
  string flow = 5;
  // pending | active | needs-reauth | revoked | expired
  string status = 6;
  PrincipalRef subject = 7;
  string installation_id = 8;
  repeated string granted_scopes = 9;
  repeated string requested_scopes = 10;
  string credential_ref = 11;
  string tenant = 12;
  string created_at = 13;
  string updated_at = 14;
  uint64 seq = 15;
}

message ConnectionCreatedEventData {
  string connection_id = 1;
  string alias = 2;
  string provider = 3;
  string flow = 4;
  PrincipalRef subject = 5;
  PrincipalRef created_by = 6;
  repeated string requested_scopes = 7;
  string status = 8;
}

message ConnectionAuthorizedEventData {
  string connection_id = 1;
  repeated string granted_scopes = 2;
  string installation_id = 3;
  PrincipalRef subject = 4;
  string credential_ref = 5;
  string status = 6;
}

message ConnectionTokenIssuedEventData {
  string connection_id = 1;
  string grant_id = 2;
  string token_ref = 3;
  repeated string scopes = 4;
  string expires_at = 5;
}

// S3-03 keyless token exchange (ai-native-agent-auth.md §6.2/§6.8). The broker
// mints an OIDC assertion (aud = provider) for the attested SVID and exchanges it
// at the provider STS for a short-lived, resource-scoped provider token.

message OidcFederationAssertion {
  string issuer = 1;
  string subject = 2;
  string audience = 3;
  TokenScope scope = 4;
  string issued_at = 5;
  string expires_at = 6;
}

message ProviderStsExchangeRequest {
  string oidc_token = 1;
  string audience = 2;
  string subject = 3;
  TokenScope scope = 4;
  string now = 5;
}

// The narrowed provider credential returned by the exchange. The wire record
// carries the reference, never the raw provider token material.
message ExchangedProviderCredential {
  string token_ref = 1;
  string flow = 2;                 // "oidc-federation"
  string provider = 3;
  string audience = 4;
  TokenScope scope = 5;
  string issued_at = 6;
  string expires_at = 7;
  uint32 expires_in_seconds = 8;
  bool narrowed = 9;
}

message TokenGrantedEventData {
  string grant_id = 1;
  string svid_subject = 2;
  string svid_identity_id = 3;
  string token_ref = 4;
  TokenScope scope = 5;
  string expires_at = 6;
}

message TokenUsedEventData {
  string grant_id = 1;
  string svid_subject = 2;
  string token_ref = 3;
  TokenScope scope = 4;
}

message TokenRevokedEventData {
  string grant_id = 1;
  string svid_subject = 2;
  string token_ref = 3;
  string reason = 4;
}

// ADR-0027 secretless-first config/secret audit payloads (refs only — never values).
message ConfigResolvedEventData {
  string name = 1;
  // bound-resource | provider-federation | camp-value | static-escape
  string source = 2;
  string value_ref = 3;
  string subject = 4;
  bool redacted = 5;
}

message SecretAccessedEventData {
  string name = 1;
  string source = 2;
  string value_ref = 3;
  string version_id = 4;
  string subject = 5;
  string grant_id = 6;
  bool redacted = 7;
  bool plaintext_present = 8;
}

// Ranked config field shape (schema-only; values never on the wire as secrets).
message ConfigFieldRecord {
  string name = 1;
  string type = 2; // string | boolean | int | json
  bool required = 3;
  bool sensitive = 4;
  string source = 5;
  string ttl = 6;
  string rotation = 7;
}

// Continuous Identity Migration Plane (ADR continuous dual-path).
// PrincipalRef continuity; adapters are aliases. Never-compact credential audit.

message MappingSpecRecord {
  string schema_version = 1;
  string id = 2;
  string version = 3;
  string content_hash = 4;
  string source_adapter = 5;
  string target_adapter = 6;
  string principal_subject_claim = 7;
  bool allow_non_critical_drift = 8;
}

message IdentityMigrationRecord {
  string schema_version = 1;
  string id = 2;
  string tenant = 3;
  // idle | dual-active | shadow | ramping | quiescent | cutover | compensated | failed | aborted
  string state = 4;
  // adapter-change | residency | spectrum | policy | schema | yard-move
  string reason = 5;
  // jit | shadow | background
  string mode = 6;
  string source_adapter = 7;
  string target_adapter = 8;
  string mapping_spec_hash = 9;
  string match_decision_id = 10;
  string cohort_flag_id = 11;
  uint32 ramp_percent = 12;
  uint32 linked_principals = 13;
  uint32 failed_checks = 14;
  string created_at = 15;
  string updated_at = 16;
  uint64 seq = 17;
  string outcome_reason = 18;
}

message MigrationStartedEventData {
  string migration_id = 1;
  string source_adapter = 2;
  string target_adapter = 3;
  string reason = 4;
  string mapping_spec_hash = 5;
  string mode = 6;
  string match_decision_id = 7;
}

message DualLinkedEventData {
  string migration_id = 1;
  string principal_ref = 2;
  string source_subject_ref = 3;
  string target_subject_ref = 4;
}

message DualConsistencyCheckedEventData {
  string migration_id = 1;
  bool ok = 2;
  uint32 checked = 3;
  uint32 failed = 4;
}

message MigratedEventData {
  string migration_id = 1;
  string principal_ref = 2;
  string target_adapter = 3;
}

message MigrationCutoverEventData {
  string migration_id = 1;
  uint32 linked_principals = 2;
}

message MigrationAbortedEventData {
  string migration_id = 1;
  string reason = 2;
  string code = 3;
}

message MigrationCompensatedEventData {
  string migration_id = 1;
  string reason = 2;
  string restored_adapter = 3;
}

message CanMigrateResult {
  string schema_version = 1;
  bool ok = 2;
  string dimension = 3; // always "can-migrate"
  string summary = 4;
  string mode = 5;
  bool continuous_default = 6;
  bool dry_run = 7;
  string rollback_posture = 8;
}

// Harness / feature-flag / progressive delivery (ADR-0044 / ADR-0083).
// Single store shared with continuous identity migration cohorts.

message FlagDefinitionRecord {
  string key = 1;
  bool default_value = 2;
  uint32 percentage = 3;
  bool enabled = 4;
  string state = 5;            // ENABLED | DISABLED
  string default_variant = 6;
  bool kill_switch = 7;
  string migration_id = 8;
  bool auto_abort_on_dual_failure = 9;
  uint64 seq = 10;
  string updated_at = 11;
}

message FlagEvaluationRecord {
  string flag_key = 1;
  string variant = 2;
  string reason = 3;
  uint64 ruleset_seq = 4;
  string context_digest = 5;
}

message RolloutStageRecord {
  uint32 percent = 1;
  string duration = 2;
}

message RolloutPolicyRecord {
  string name = 1;
  string flag = 2;
  repeated RolloutStageRecord stages = 3;
  string traffic = 4;          // flag-only | gateway-weighted
  bool auto_rollback = 5;
}

message RolloutStateRecord {
  string id = 1;
  string status = 2;           // running | promoted | rolled_back | failed
  uint32 stage_index = 3;
  uint32 percent = 4;
  uint32 gateway_weight_percent = 5;
}

message ExperimentDefinitionRecord {
  string name = 1;
  string flag = 2;
  repeated string variants = 3;
}

message ExperimentAssignmentRecord {
  string experiment = 1;
  string flag = 2;
  string variant = 3;
  string subject_key_hash = 4;
  string assigned_at = 5;
}
