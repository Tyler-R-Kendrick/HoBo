syntax = "proto3";

package hobo.junctions.v1;

enum ConnectivityTier {
  CONNECTIVITY_TIER_UNSPECIFIED = 0;
  CONNECTIVITY_TIER_PRIVATE_NETWORK = 1;
  CONNECTIVITY_TIER_CROSS_REGION = 2;
  CONNECTIVITY_TIER_PRIVATE_INTERCONNECT = 3;
  CONNECTIVITY_TIER_OVERLAY_MESH = 4;
  CONNECTIVITY_TIER_PUBLIC_MTLS = 5;
}

message JunctionTopology {
  string name = 1;
  repeated string member_yards = 2;
}

message JunctionMemberManifest {
  string yard_name = 1;
  string provider_id = 2;
  string region = 3;
  repeated string capabilities = 4;
  // Residency tags data crossing to this member must satisfy (ADR-0103 #4):
  // a jurisdiction id ("eu") or "classification:jurisdiction" ("pii:eu").
  repeated string residency = 5;
}

// Fail-closed residency diagnostic for a member pair that gets no edge and no
// halves (ADR-0103 #3-4).
message ResidencyConflict {
  string source_yard = 1;
  string target_yard = 2;
  string diagnostic = 3;
}

message PeeringEdge {
  string id = 1;
  string source_yard = 2;
  string target_yard = 3;
  ConnectivityTier tier = 4;
  uint32 tier_level = 5;
}

message ConnectivityHalf {
  string edge_id = 1;
  string yard_name = 2;
  string peer_yard_name = 3;
  string role = 4;
  ConnectivityTier tier = 5;
  uint32 tier_level = 6;
}

message DnsRecord {
  string record_name = 1;
  string record_type = 2;
  string target = 3;
  string owner_yard = 4;
}

message TrustAnchorExchange {
  string from_yard = 1;
  string to_yard = 2;
  string anchor_ref = 3;
}

message PolicyPackDistribution {
  string to_yard = 1;
  string pack_ref = 2;
  bool signed = 3;
}

message RegistryBundleDistribution {
  string from_yard = 1;
  string to_yard = 2;
  string bundle_ref = 3;
  bool signed = 4;
}

message JunctionConnectivityPlan {
  string junction_name = 1;
  repeated string members = 2;
  string event_type = 3;
  repeated PeeringEdge edges = 4;
  string dns_zone = 5;
  repeated DnsRecord dns_records = 6;
  repeated TrustAnchorExchange trust_exchanges = 7;
  repeated PolicyPackDistribution policy_packs = 8;
  repeated RegistryBundleDistribution registry_bundles = 9;
  repeated ResidencyConflict residency_conflicts = 10;
}

message YardConnectivityHalfPlan {
  string junction_name = 1;
  string yard_name = 2;
  repeated ConnectivityHalf halves = 3;
  repeated DnsRecord dns_records_to_realize = 4;
  repeated DnsRecord dns_records_to_resolve = 5;
  repeated TrustAnchorExchange trust_exchanges = 6;
  repeated PolicyPackDistribution policy_packs = 7;
  repeated RegistryBundleDistribution registry_bundles = 8;
}
