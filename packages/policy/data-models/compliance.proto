syntax = "proto3";

package hobo.policy.v1;

// Compliance shapes (ADR-0146): residency policy decisions and the
// control→evidence pack join realizing ADR-0060 §4. Vocabulary aligns with
// OSCAL component-definition/control-implementation without depending on
// OSCAL schemas (ADR-0144 posture). Design-time contract artifacts.

message ResidencyPolicyDecisionRecord {
  bool allowed = 1;
  string effect = 2; // allow | warn | deny
  string rule_id = 3;
  repeated string reasons = 4;
  string classification = 5;
  string region = 6;
  repeated string jurisdictions = 7;
}

message ControlEvidenceRefRecord {
  string kind = 1; // event-stream | gate | artifact | retention
  string ref = 2;
}

message ControlMappingRecord {
  string control_id = 1;
  string title = 2;
  repeated ControlEvidenceRefRecord evidence = 3;
  string status = 4; // implemented | partial | planned
}

message ControlEvidencePackRecord {
  string schema = 1; // hobo.control-evidence-pack/v1
  string framework = 2;
  string version = 3;
  repeated ControlMappingRecord controls = 4;
}

message ControlCoverageReportRecord {
  string framework = 1;
  uint32 total = 2;
  uint32 satisfied = 3;
  repeated string missing_control_ids = 4;
}

// Summary of one OSCAL-shaped boundary export. The full OSCAL JSON document
// is a boundary artifact (docs/standards/oscal.md), not a wire record.
message OscalExportSummaryRecord {
  string kind = 1; // component-definition | assessment-results
  string framework = 2;
  string version = 3;
  uint32 control_count = 4;
}
