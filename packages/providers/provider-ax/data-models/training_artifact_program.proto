syntax = "proto3";

package hobo.provider_ax.v1;

// The platform-normalized artifact program this engine emits (ADR-0125):
// tuned instructions + recorded high-reward executions as demos, with ax's
// serialized optimized program attached as the engine-internal payload.

message ProgramDemo {
  string input_json = 1;
  string output_json = 2;
}

message TrainingArtifactProgram {
  string instructions = 1;
  repeated ProgramDemo demos = 2;
  // Engine-internal: @ax-llm/ax AxSerializedOptimizedProgram JSON, pinned by
  // the artifact's engine_version; null when the optimizer degraded to the
  // deterministic recorded-demos floor.
  string ax_program_json = 3;
}
