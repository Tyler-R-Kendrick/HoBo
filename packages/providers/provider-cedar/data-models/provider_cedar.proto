syntax = "proto3";

package hobo.provider_cedar.v1;

// Wire shapes for the Cedar gate-plane boundary (docs/plans/0017 F30): the
// cedar-agent is_authorized verdict the adapter parses. Design-time contract
// artifacts.

message CedarDiagnostics {
  repeated string reason = 1; // policy ids that determined the decision
  repeated string errors = 2;
}

message CedarVerdict {
  string decision = 1; // Allow | Deny
  CedarDiagnostics diagnostics = 2;
}
