syntax = "proto3";

import "google/protobuf/struct.proto";

package hobo.provider.neon.v1;

// Design-time contract artifacts for @hobo/provider-neon: the data shapes the
// package reasons about at its boundaries — the claimable-database REST
// response, the emitted claim plan, and the provision receipt. Not compiled at
// runtime; the TypeScript parsers in src/api.ts and src/receipt.ts are the
// executable view and must stay reconciled with these shapes.

enum NeonDatabaseStatus {
  NEON_DATABASE_STATUS_UNSPECIFIED = 0;
  NEON_DATABASE_STATUS_UNCLAIMED = 1;
  NEON_DATABASE_STATUS_CLAIMING = 2;
  NEON_DATABASE_STATUS_CLAIMED = 3;
}

enum NeonClaimState {
  NEON_CLAIM_STATE_UNSPECIFIED = 0;
  NEON_CLAIM_STATE_UNCLAIMED = 1;
  NEON_CLAIM_STATE_CLAIMING = 2;
  NEON_CLAIM_STATE_CLAIMED_PENDING_ROTATION = 3;
  NEON_CLAIM_STATE_COMPLETE = 4;
  NEON_CLAIM_STATE_EXPIRED = 5;
}

// One response from POST /api/v1/database or GET /api/v1/database/:id.
// connection_string is intentionally absent: it is deposited into secret
// custody at the parse boundary and never enters a persisted record.
message NeonDatabaseRecord {
  string database_id = 1;             // UUID v7
  NeonDatabaseStatus status = 2;
  string neon_project_id = 3;
  string claim_url = 4;
  int64 expires_at_ms = 5;            // provider-reported, never locally computed
  int64 created_at_ms = 6;
  int64 updated_at_ms = 7;
  bool connection_string_present = 8; // null once claimed
}

// A non-secret address. A hostname is not a credential, and there is no field
// here that could hold one: the connection string lives in custody and is
// named downstream only by a locator.
message NeonNonSecretEndpoint {
  string host = 1;
  optional uint32 port = 2;
  optional string path = 3;  // "/<database>" when the URI carried one
  bool tls = 4;
}

// The pair a binding and a receipt carry. Named roles rather than a repeated
// field with a `role` discriminator: there are exactly two, and a consumer that
// wants the direct endpoint should not have to search a list for it.
message NeonReceiptEndpoints {
  NeonNonSecretEndpoint pooled = 1;
  NeonNonSecretEndpoint direct = 2;
}

message NeonClaimAction {
  string id = 1;
  string kind = 2;         // human-ceremony | owner-api
  string description = 3;
  bool blocking = 4;
  bool completed = 5;
  // Explicit presence: an action with no URL is not an action with an empty
  // one, and a receipt must not be able to spell "absent" as "".
  optional string url = 6;
}

message NeonClaimPlan {
  string strategy = 1;     // resource-claim
  string boundary = 2;     // resource
  string resource_kind = 3;
  string atomicity = 4;    // single-resource
  string claim_url = 5;
  NeonClaimState state = 6;
  repeated NeonClaimAction actions = 7;
}

// What the receipt says about the claim: the state plus the blocking actions
// still outstanding, so a reader cannot mistake "the ceremony happened" for
// "nobody holds a residual credential". The receipt carries this summary
// rather than the whole plan — the action descriptions are guidance for the
// operator doing the ceremony, not evidence worth persisting.
message NeonClaimSummary {
  NeonClaimState state = 1;
  string boundary = 2;         // resource
  string atomicity = 3;        // single-resource
  reserved 4;
  reserved "claim_url";
  string claim_ref = 6;
  repeated string blocking_action_ids = 5;
}

// What the unclaimed tier documents about itself, carried separately from the
// provider-reported expiry so the two can never be read as the same fact.
// https://neon.com/docs/reference/claimable-postgres
message NeonUnclaimedLimits {
  int64 max_storage_bytes = 1;
  int64 max_transfer_bytes = 2;
  bool branches = 3;
  string region = 4;
  uint32 postgres_major_version = 5;
}

// The serialized output that leaves this package. Built by projection from the
// record, never by spreading it, and re-scanned for credential material before
// it is returned.
message NeonProvisionReceipt {
  string schema_version = 1;
  string definition_id = 2;
  string provider_id = 3;
  string resource_ref = 4;
  reserved 5, 6, 9;
  reserved "database_id", "neon_project_id", "endpoints";
  string provider_status = 7;             // the provider's own vocabulary
  string database_name = 8;
  optional string credential_ref = 10;        // locator, never material
  optional string direct_credential_ref = 11; // locator, never material
  string expires_at_iso = 12;
  int64 expires_at_ms = 13;
  string expiry_source = 14;              // always provider-reported
  int64 observed_at_ms = 15;
  bool adopted = 16;
  NeonClaimSummary claim = 17;
  NeonUnclaimedLimits limits = 18;
  repeated string binding_profiles = 19;
  repeated string migration_profiles = 20;
  string opaque_physical_id = 21;
  string native_identity_ref = 22;
  string native_project_ref = 23;
  string endpoint_ref = 24;
  optional string binding_ref = 25;
}


// Public fact projection: native capability values exist only in custody.
message NeonProviderFact {
  string kind = 1;
  int64 occurred_at_ms = 2;
  string resource_ref = 3;
  string opaque_physical_id = 4;
  string native_identity_ref = 5;
  google.protobuf.Struct detail = 6;
}
