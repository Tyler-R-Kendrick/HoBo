syntax = "proto3";

package hobo.provider.netlify.v1;

// The records `netlify.anonymous-static-site/v1` (ADR-0151) exchanges: what the
// pinned Netlify CLI reports for an anonymous deploy, what this package hands to
// the shared `@hobo/claims` coordinator, and what a receipt is allowed to show.
//
// Legacy contract artifacts are reconciled against provider-boundary proofs.
// The package opts into codegen; new runtime observations derive generated
// records. CUE carries semantic constraints alongside these wire contracts.
//
// The claim URL is bearer authority over a live site. It appears here only as a
// custody locator (`claim_url_secret_ref`) or a one-time action id — never as a
// value, and never with its query string.

// Where a deadline came from. The CLI reports no expiry field, so a deadline is
// normally derived from the documented one hour window and labelled as such
// rather than passed off as something Netlify said.
enum ExpirySource {
  EXPIRY_SOURCE_UNSPECIFIED = 0;
  EXPIRY_SOURCE_DOCUMENTED_WINDOW = 1;
  EXPIRY_SOURCE_PROVIDER_REPORTED = 2;
}

// What was observed about the one site this ceremony hands over. Observation is
// not verification.
enum AnonymousClaimObservedStatus {
  ANONYMOUS_CLAIM_OBSERVED_STATUS_UNSPECIFIED = 0;
  ANONYMOUS_CLAIM_OBSERVED_STATUS_PENDING = 1;
  ANONYMOUS_CLAIM_OBSERVED_STATUS_CLAIMED = 2;
  ANONYMOUS_CLAIM_OBSERVED_STATUS_EXPIRED = 3;
}

// A third-party fact with the page it came from and the date a human read it.
// Ranking input, never billing input, and never an attestation by the vendor.
message NetlifySourceRef {
  string url = 1;
  string checked_on = 2; // UTC YYYY-MM-DD
  string note = 3;
}

// The subprocess boundary, recorded because argv is the attack surface of this
// whole path: array elements only, a pinned CLI build, and an environment built
// by allowlist so an ambient token cannot silently authenticate the deploy.
message NetlifyCliInvocationRecord {
  string package_spec = 1; // netlify-cli@<pinned version>
  repeated string argv = 2;
  repeated string env_allowlist = 3;
  repeated string forbidden_env_keys = 4;
  bool shell = 5; // always false
}

// The facts parsed out of `netlify deploy --allow-anonymous --no-build --json`.
message AnonymousDeployFactsRecord {
  string site_id = 1;
  string site_name = 2;
  string deploy_id = 3;
  string site_url = 4;
  string deploy_url = 5;
  string claim_url_secret_ref = 6;
  string claim_action_id = 7;
  uint64 deployed_at_ms = 8;
  uint64 claim_deadline_at_ms = 9;
  ExpirySource expiry_source = 10;
}

// The durable record of one anonymous deployment. Nobody owns it and nobody is
// billed for it until a human opens the claim action inside the window.
message AnonymousSiteRecord {
  string schema_version = 1;
  string definition_id = 2;
  string provider_id = 3;
  string claim_strategy_ref = 4;
  string bootstrap_strategy_ref = 5;
  string deployment_ref = 6;
  AnonymousDeployFactsRecord facts = 7;
  uint64 sponsor_exposure_minor_units = 8; // always 0: HoBo funds nothing here
  string cli_package_spec = 9;
  bool anonymous_authority_revoked = 10;
  uint64 observed_at_ms = 11;
}

// One independent ownership signal. Read access is not ownership, and a site the
// previous holder can still redeploy has not changed hands.
message NetlifySiteOwnershipSignalRecord {
  string id = 1;
  string subject_ref = 2;
  bool independent = 3;
  bool passed = 4;
  string detail = 5;
}

message SiteOwnershipVerificationRecord {
  string item_id = 1;
  string subject_ref = 2;
  bool transferred = 3;
  bool verified = 4;
  repeated NetlifySiteOwnershipSignalRecord signals = 5;
  repeated string reasons = 6;
  uint64 observed_at_ms = 7;
}

// The single claim item this strategy compiles for the shared reducer. One site,
// one ceremony, one thing that can fail.
message AnonymousClaimItemRecord {
  string id = 1;
  string subject_ref = 2;
  string subject_kind = 3; // camp
  string provider_id = 4;
  string claim_strategy_ref = 5;
  string mode = 6; // site-claim
  uint64 deadline_at_ms = 7;
  string verification_ref = 8;
  repeated string post_claim_actions = 9;
  string creator_authority_after_claim = 10;
  string status = 11;
}

// The compiled lease-and-bundle shape handed to the coordinator.
message AnonymousClaimPlanRecord {
  string lease_id = 1;
  string bundle_id = 2;
  string bootstrap_class = 3; // anonymous-claimable
  string atomicity = 4; // single-resource
  uint64 claim_deadline_at_ms = 5;
  ExpirySource expiry_source = 6;
  string cleanup_policy = 7; // retain-until-provider-expiry
  string fencing_token = 8;
}

// The most-copied artifact this package produces, built by listing what may
// appear rather than by removing what may not.
message AnonymousSiteReceiptRecord {
  string schema_version = 1;
  string definition_id = 2;
  string provider_id = 3;
  string deployment_ref = 4;
  string site_id = 5;
  string site_name = 6;
  string site_url = 7;
  string claim_action_custody = 8; // redacted locator, never the claim URL
  string claim_action_id = 9;
  uint64 claim_deadline_at_ms = 10;
  ExpirySource expiry_source = 11;
  uint64 sponsor_exposure_minor_units = 12;
  string cli_package_spec = 13;
  bool anonymous_authority_revoked = 14;
  string claim_status = 15;
  repeated NetlifySiteOwnershipSignalRecord ownership_signals = 16;
  repeated string reasons = 17;
}
