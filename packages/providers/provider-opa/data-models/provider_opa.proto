syntax = "proto3";

package hobo.provider_opa.v1;

// Wire shapes for the OPA/Rego gate-plane boundary (docs/plans/0017 F30):
// the Rego decision document the adapter parses and the engine-neutral
// reason it lowers onto. Design-time contract artifacts.

message RegoDecisionReason {
  string plane = 1; // policy | contracts | billing | placement | connectors | residency
  string code = 2;
  string message = 3;
}

message RegoDecisionResult {
  string effect = 1; // allow | allow-degraded | deny | require-approval
  repeated RegoDecisionReason reasons = 2;
  repeated string policy_ids = 3;
}
