syntax = "proto3";

package hobo.provider.railway.v1;

// Design-time wire view of everything @hobo/provider-railway hands across its
// one boundary: the yard placement / Examples deploy plane that asks this
// package what it can do (`capabilityManifest`), what a plan becomes
// (`realize`), what a binding looks like (`client`), and what happens when it
// asks for a temporary Environment Station (it is refused).
//
// No buf codegen is wired for this package; the parsers in src/parse.ts are the
// executable view and must stay reconciled with these shapes.

// The ports this package genuinely realizes. There is no `RAILWAY_PORT_KIND_
// DATA` slot because the package declares no relational equivalence class, and
// an absent port fails a Matching requirement instead of quietly passing it.
enum RailwayPortKind {
  RAILWAY_PORT_KIND_UNSPECIFIED = 0;
  RAILWAY_PORT_KIND_COMPUTE = 1;
  RAILWAY_PORT_KIND_KV = 2;
  RAILWAY_PORT_KIND_QUEUE = 3;
}

// Matching's three-valued answer. `PARTIAL` always carries the missing
// features; a partial match with an empty `missing` list would be a full match
// wearing the wrong label.
enum RailwayMatchKind {
  RAILWAY_MATCH_KIND_UNSPECIFIED = 0;
  RAILWAY_MATCH_KIND_FULL = 1;
  RAILWAY_MATCH_KIND_PARTIAL = 2;
  RAILWAY_MATCH_KIND_NONE = 3;
}

// Provider option blocks are Camp/Yard-scoped escapes (ADR-0024). They are
// advisory by construction: this package only ever emits `PREFER`, so a
// provider pin can never make a Bindle undeployable elsewhere.
enum RailwayNegotiation {
  RAILWAY_NEGOTIATION_UNSPECIFIED = 0;
  RAILWAY_NEGOTIATION_PREFER = 1;
  RAILWAY_NEGOTIATION_REQUIRE = 2;
}

// One entry of EQUIVALENCE_CLASSES: the abstract port this provider claims,
// the Railway resource class it becomes, and the features it will admit to.
message RailwayEquivalenceClass {
  string class_key = 1;         // "web/service" | "kv" | "queue"
  RailwayPortKind port = 2;
  string resource_class = 3;    // "railway:service" | "railway:redis" | "railway:queue"
  string provider_service = 4;  // human-facing Railway product name
  repeated string features = 5;
}

// A Matching question: an abstract port plus the features the requirement
// insists on.
message RailwayPortRequest {
  RailwayPortKind port = 1;
  repeated string features = 2;
}

message RailwayCapabilityMatch {
  RailwayMatchKind kind = 1;
  repeated string missing = 2; // non-empty exactly when kind == PARTIAL
}

// Cost signal for the dispatcher. This package publishes no cost facts, so the
// marginal price is the literal "0" placeholder — that means "unpriced here",
// not "free". A real price must arrive with COST_SOURCE provenance.
message RailwayCostSignal {
  string currency = 1;       // ISO-4217
  string sku = 2;            // "railway:<resource-class>"
  string unit = 3;
  string marginal_price = 4; // decimal string, "0" while unpriced
}

// The untrusted half of the boundary: a plan handed in by the deploy plane.
message RailwayResourcePlan {
  string name = 1;           // DNS label; becomes part of a hostname downstream
  RailwayPortKind port = 2;
  repeated string require = 3;
  repeated string prefer = 4;
}

message RailwayDriverResource {
  string name = 1;
  string type = 2;      // resource_class of the matched equivalence class
  string provider = 3;  // always "railway"
}

// What `realize` emits: a driver program, never IaC. Railway is driven through
// its own deploy driver in this package.
message RailwayDriverProgram {
  string api_version = 1; // "hobo.driver-program/v1"
  string driver = 2;      // "railway-deploy"
  repeated RailwayDriverResource resources = 3;
}

// The manifest is nested exactly as `capabilityManifest()` emits it, rather
// than flattened into something tidier that no code produces.
message RailwayCapabilityEntry {
  RailwayPortKind port = 1;
}

message RailwayCapabilitySet {
  repeated RailwayCapabilityEntry capabilities = 1;
}

message RailwayManifestAuth {
  string exchange = 1;      // "hobo:brokered-deploy-token"
  bool static_secrets = 2;  // always false
}

message RailwayManifestCost {
  repeated RailwayCostSignal facts = 1; // empty while unpriced
}

message RailwayCapabilityManifest {
  string provider_id = 1;              // "@hobo/provider-railway"
  map<string, string> published = 2;   // no published endpoints on this surface
  RailwayCapabilitySet capabilities = 3;
  RailwayManifestAuth auth = 4;
  RailwayManifestCost cost = 5;
}

// The provider object itself, as the yard plane sees it before it asks
// anything: an id, the regions it will admit to, and the ports it answers for.
message RailwayProviderDescriptor {
  string id = 1;                // "@hobo/provider-railway"
  repeated string regions = 2;  // ["global"] — Railway region choice is unmodelled here
  repeated RailwayPortKind ports = 3;
}

message RailwayTypedOptionBlock {
  string provider_id = 1; // "railway"
  RailwayPortKind port = 2;
  string option_name = 3; // "service" | "redis"
  RailwayNegotiation negotiation = 4;
  map<string, string> options = 5;
}

// What `client(port, outputs)` returns to a consumer that already deployed:
// the resolved resource class plus the deploy plane's own output bindings.
message RailwayProviderClientBinding {
  RailwayPortKind port = 1;
  string resource_class = 2;
  string provider_service = 3;
  map<string, string> bindings = 4;
}

// Railway publishes no password-free temporary/agent account API, so the
// temporary Environment Station boundary answers with a refusal rather than a
// station. This record is the refusal, and it is the honest answer — the
// alternative is a permanent API token in an example.
message RailwayTemporaryStationRefusal {
  string provider_id = 1; // "railway"
  string code = 2;        // "HOBO_TEMP_PROVISION_UNAVAILABLE"
  bool supports_anonymous_temporary_deploy = 3; // always false
  string reason = 4;
}
