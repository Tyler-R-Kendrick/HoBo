syntax = "proto3";

package hobo.provider.upstash.v1;

// Design-time contract artifacts for @hobo/provider-upstash: the data shapes
// crossing this package's boundaries — the parsed `start-redis` document, the
// durable temporary-Redis record, the claim plan, the provision receipt, and
// the facts the claim plane consumes. `pnpm run codegen` compiles this into
// src/_generated/temporary_redis_pb.ts, and the runtime types are `DomainView`
// refinements of those messages (src/wire.ts) — renaming a field here is a
// compile error there rather than silent drift. The matching invariants are in
// temporary_redis.cue.
//
// One field is deliberately missing everywhere below: the REST bearer token.
// It exists for a single hop inside the driver, goes straight into secret
// custody, and is represented downstream only by a locator.

enum UpstashClaimState {
  UPSTASH_CLAIM_STATE_UNSPECIFIED = 0;
  UPSTASH_CLAIM_STATE_UNCLAIMED = 1;
  // The claim ceremony is attested, but the pre-claim REST token still works
  // until an owner resets it. There is no provider state for this; it is
  // HoBo's, and it exists so a live residual credential cannot be reported as
  // a finished claim.
  UPSTASH_CLAIM_STATE_CLAIMED_PENDING_ROTATION = 2;
  UPSTASH_CLAIM_STATE_COMPLETE = 3;
  UPSTASH_CLAIM_STATE_EXPIRED = 4;
}

enum UpstashProviderFactKind {
  UPSTASH_PROVIDER_FACT_KIND_UNSPECIFIED = 0;
  UPSTASH_PROVIDER_FACT_KIND_DATABASE_PROVISIONED = 1;
  UPSTASH_PROVIDER_FACT_KIND_DATABASE_ADOPTED = 2;
  UPSTASH_PROVIDER_FACT_KIND_CLAIM_PENDING_ROTATION = 3;
  UPSTASH_PROVIDER_FACT_KIND_CLAIM_COMPLETED = 4;
  UPSTASH_PROVIDER_FACT_KIND_LEASE_EXPIRED = 5;
}

// One parsed `POST https://upstash.com/start-redis` response. The provider
// answers in Markdown, so `contract` names the parser version that produced
// this record: a document the pinned parser does not recognise is a contract
// change, never a partial parse.
message StartRedisDatabase {
  string contract = 1;                 // upstash.start-redis.markdown/v1
  string database_id = 2;              // UUID v4, and also the idempotency key
  // Bare hostname. Not a credential; safe for a binding and a receipt.
  string rest_endpoint_host = 3;       // <name>.upstash.io
  string rest_endpoint_url = 4;        // https://<host>, no path, no userinfo
  string expires_on = 5;               // provider-stated calendar date
  // Earliest instant consistent with that date. The provider states a
  // calendar day, not an instant, so its two ends disagree by 24 hours:
  // taking the start treats a lease as over slightly early, taking the end
  // would hand out a lease the provider has already reaped. Early is the
  // cheap mistake.
  int64 expires_at_ms = 6;
  string expires_at_iso = 7;
  // The provider's own words, kept for the receipt: `3 days from creation`.
  string expires_raw = 8;
  uint32 stated_ttl_days = 9;
  string metrics_url = 10;             // addresses this database id
  bool token_present = 11;             // the token itself never appears here
  string console_url = 12;             // the claim ceremony URL for this id
}

// What the unclaimed surface documents about itself, carried separately from
// the provider-reported expiry so the two can never be confused. Nothing else
// is declared: Upstash publishes free-tier numbers for accounts, not for this
// surface, and repeating them here would invent a limit a planner then enforces.
message UpstashUnclaimedLimits {
  uint32 documented_expiry_hours = 1;  // 72
  string transport = 2;                // https-rest
}

message UpstashNonSecretEndpoint {
  string host = 1;                     // bare hostname
  uint32 port = 2;                     // 443
  bool tls = 3;
  string transport = 4;                // https-rest
}

message UpstashClaimAction {
  string id = 1;                       // upstash.claim.<action>
  string kind = 2;                     // human-ceremony | owner-console
  string description = 3;
  bool blocking = 4;
  bool completed = 5;
  // Explicit presence: an action with no URL is not an action with an empty
  // one, and a receipt must not be able to spell "absent" as "".
  optional string url = 6;             // Upstash console URL for this database
}

message UpstashClaimPlan {
  string strategy = 1;                 // resource-claim
  string boundary = 2;                 // resource
  string resource_kind = 3;            // upstash-redis-database
  string atomicity = 4;                // single-resource
  string claim_url = 5;
  UpstashClaimState state = 6;
  repeated UpstashClaimAction actions = 7;
}

// The durable record for one temporary database. `binding` is intentionally
// absent: a CapabilityBinding is emitted by @hobo/bindings and carries its own
// wire form; duplicating it here would create a second definition of it.
message UpstashTemporaryRedis {
  string schema_version = 1;
  string definition_id = 2;            // upstash.temporary-redis/v1
  string provider_id = 3;              // upstash
  string resource_ref = 4;
  string database_id = 5;
  string rest_endpoint_host = 6;
  string rest_endpoint_url = 7;
  optional string credential_ref = 8;  // SecretRef locator, never material
  optional string rest_url_ref = 9;    // SecretRef locator, never material
  int64 expires_at_ms = 10;            // provider-reported, never a local timer
  string expires_at_iso = 11;
  string expires_raw = 12;
  uint32 stated_ttl_days = 13;
  string expiry_source = 14;           // always provider-reported
  int64 observed_at_ms = 15;
  UpstashClaimPlan claim = 16;
  string metrics_url = 17;
  UpstashUnclaimedLimits limits = 18;
  bool adopted = 19;
}

// What the receipt says about the claim: the state plus the blocking actions
// still outstanding, so a reader cannot mistake "the ceremony happened" for
// "nobody holds a residual credential".
message UpstashClaimSummary {
  UpstashClaimState state = 1;
  string boundary = 2;                 // resource
  string atomicity = 3;                // single-resource
  string claim_url = 4;
  repeated string blocking_action_ids = 5;
}

message UpstashProvisionReceipt {
  string schema_version = 1;
  string definition_id = 2;
  string provider_id = 3;
  string resource_ref = 4;
  string database_id = 5;
  UpstashNonSecretEndpoint endpoint = 6;
  optional string credential_ref = 7;  // SecretRef locator, never material
  optional string rest_url_ref = 8;    // SecretRef locator, never material
  string expires_at_iso = 9;
  int64 expires_at_ms = 10;
  uint32 stated_ttl_days = 11;
  string expiry_source = 12;           // always provider-reported
  int64 observed_at_ms = 13;
  bool adopted = 14;
  UpstashClaimSummary claim = 15;
  UpstashUnclaimedLimits limits = 16;
  repeated string binding_profiles = 17;
  // Always empty: this surface publishes no export path, and advertising a
  // migration profile that fails at execution time is worse than none.
  repeated string migration_profiles = 18;
  string teardown = 19;                // expiry-only; there is no delete API
}

// An observation this package hands the claim plane. It is not a durable event
// — the claim coordinator actor in @hobo/claims is what turns these into
// ClaimEvents — so `detail` is a flat map of non-secret scalars only.
message UpstashProviderFact {
  UpstashProviderFactKind kind = 1;
  int64 occurred_at_ms = 2;
  string resource_ref = 3;
  string database_id = 4;
  map<string, string> detail = 5;
}
