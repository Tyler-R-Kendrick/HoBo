syntax = "proto3";

package hobo.provider.webernetes.v1;

// Design-time wire view of the two boundaries @hobo/provider-webernetes
// crosses:
//
//   1. The yard placement / Examples deploy plane, which asks what this
//      provider can do, realizes a plan into a driver program, and binds
//      deploy outputs. In-process, no network.
//   2. The local station host, reached through the injected
//      `LocalTempTransport`. That is the only seam in this package: everything
//      that comes back through it is untrusted and crosses src/parse.ts.
//
// No buf codegen is wired for this package; the parsers in src/parse.ts are
// the executable view and must stay reconciled with these shapes.

// The ports this local provider genuinely stands up. Webernetes is the local
// yard, so the ports are the ones a developer machine can host.
enum WebernetesPortKind {
  WEBERNETES_PORT_KIND_UNSPECIFIED = 0;
  WEBERNETES_PORT_KIND_COMPUTE = 1;
  WEBERNETES_PORT_KIND_KV = 2;
  WEBERNETES_PORT_KIND_QUEUE = 3;
}

enum WebernetesMatchKind {
  WEBERNETES_MATCH_KIND_UNSPECIFIED = 0;
  WEBERNETES_MATCH_KIND_FULL = 1;
  WEBERNETES_MATCH_KIND_PARTIAL = 2;
  WEBERNETES_MATCH_KIND_NONE = 3;
}

enum WebernetesNegotiation {
  WEBERNETES_NEGOTIATION_UNSPECIFIED = 0;
  WEBERNETES_NEGOTIATION_PREFER = 1;
  WEBERNETES_NEGOTIATION_REQUIRE = 2;
}

// Where a station endpoint actually lives. This provider only ever hands back
// a local address; a public host would mean the injected transport deployed
// somewhere else, and the "anonymous, no token, local" claim would be false.
enum WebernetesEndpointLocality {
  WEBERNETES_ENDPOINT_LOCALITY_UNSPECIFIED = 0;
  WEBERNETES_ENDPOINT_LOCALITY_LOOPBACK = 1;         // localhost, *.localhost, 127.0.0.0/8, ::1
  WEBERNETES_ENDPOINT_LOCALITY_PRIVATE_NETWORK = 2;  // RFC1918, for a dev server on a LAN address
  WEBERNETES_ENDPOINT_LOCALITY_OVERLAY = 3;          // *.hobo.test overlay names (ADR-0130)
}

message WebernetesEquivalenceClass {
  string class_key = 1;         // "web/service" | "kv" | "queue"
  WebernetesPortKind port = 2;
  string resource_class = 3;    // "webernetes:pod" | "webernetes:kv" | "webernetes:queue"
  string provider_service = 4;
  repeated string features = 5;
}

message WebernetesPortRequest {
  WebernetesPortKind port = 1;
  repeated string features = 2;
}

message WebernetesCapabilityMatch {
  WebernetesMatchKind kind = 1;
  repeated string missing = 2; // non-empty exactly when kind == PARTIAL
}

// The local yard costs nothing to run, and unlike a hosted provider that is a
// fact rather than an absent price: there is no vendor invoice behind it.
message WebernetesCostSignal {
  string currency = 1;
  string sku = 2;            // "webernetes:<resource>"
  string unit = 3;
  string marginal_price = 4; // "0" — a local pod bills nobody
  string pricing_status = 5; // "verified-zero" for incremental vendor charges only
}

message WebernetesResourcePlan {
  string name = 1;           // DNS label; becomes part of a local named endpoint
  WebernetesPortKind port = 2;
  repeated string require = 3;
  repeated string prefer = 4;
}

message WebernetesDriverResource {
  string name = 1;
  string type = 2;
  string provider = 3; // always "webernetes"
}

message WebernetesDriverProgram {
  string api_version = 1; // "hobo.driver-program/v1"
  string driver = 2;      // "webernetes-deploy"
  repeated WebernetesDriverResource resources = 3;
}

message WebernetesCapabilityEntry {
  WebernetesPortKind port = 1;
}

message WebernetesCapabilitySet {
  repeated WebernetesCapabilityEntry capabilities = 1;
}

message WebernetesManifestAuth {
  string exchange = 1;     // "hobo:brokered-deploy-token"
  bool static_secrets = 2; // always false, even locally
}

message WebernetesManifestCost {
  repeated WebernetesCostSignal facts = 1;
}

message WebernetesCapabilityManifest {
  string provider_id = 1;            // "@hobo/provider-webernetes"
  map<string, string> published = 2;
  WebernetesCapabilitySet capabilities = 3;
  WebernetesManifestAuth auth = 4;
  WebernetesManifestCost cost = 5;
}

message WebernetesProviderDescriptor {
  string id = 1;               // "@hobo/provider-webernetes"
  repeated string regions = 2; // ["global"] — a local yard has one place
  repeated WebernetesPortKind ports = 3;
}

message WebernetesTypedOptionBlock {
  string provider_id = 1; // "webernetes"
  WebernetesPortKind port = 2;
  string option_name = 3; // "pod"
  WebernetesNegotiation negotiation = 4;
  map<string, string> options = 5;
}

message WebernetesProviderClientBinding {
  WebernetesPortKind port = 1;
  string resource_class = 2;
  string provider_service = 3;
  map<string, string> bindings = 4;
}

/* -------------------------------------------------------------------------- */
/* Temporary Environment Station boundary (the injected transport seam)        */
/* -------------------------------------------------------------------------- */

message WebernetesStationRequest {
  string station_id = 1;
}

// Exactly what the transport hands back, before anything trusts it.
message WebernetesStationDeployment {
  string station_url = 1;
  string claim_url = 2;
}

// One parsed endpoint: the URL kept verbatim, plus the facts the parser
// established about it so no later code re-parses the string.
message WebernetesLocalEndpoint {
  string url = 1;
  string scheme = 2; // "http" | "https"
  string host = 3;   // lowercased, no userinfo
  WebernetesEndpointLocality locality = 4;
}

// The result handed to the yard plane, projecting onto @hobo/core's
// TemporaryEnvironmentStationResult.
message WebernetesTemporaryStationResult {
  string station_id = 1;
  WebernetesLocalEndpoint station = 2;
  WebernetesLocalEndpoint claim = 3;
  string expires_at = 4;   // RFC3339, provider-computed from the shared 1h TTL
  uint32 ttl_seconds = 5;
  string provider_id = 6;  // "webernetes"
  bool anonymous = 7;      // always true
  bool temporary = 8;      // always true
}
