syntax = "proto3";

package hobo.runner.blacksmith.v1;

// Wire records for the Blacksmith.sh execution-host adapter
// (@hobo/runner-blacksmith, HOBO-719). CUE constraints in
// runner_blacksmith.cue bound every type declared here; the runtime parses
// untrusted manifest documents into derived parsed types before use.

message BlacksmithCapabilityRecord {
  string port = 1;
  string interface = 2;
  string version = 3;
  string stability = 4;
  repeated string features = 5;
  string runs_on = 6;
}

message BlacksmithCostFactRecord {
  string sku = 1;
  string unit = 2;
  string marginal_price = 3;
  uint64 free_tier_included = 4;
  string source_type = 5;
  string source_digest = 6;
}

// Secretless posture: jobs dispatch via broker-minted short-lived GitHub App
// installation tokens; the Blacksmith org relationship is broker-held too
// (HOBO-110). No PATs, no static org tokens.
message BlacksmithAuthPostureRecord {
  string schema = 1;
  string mode = 2;
  string token_audience = 3;
  string exchange = 4;
  string substrate_exchange = 5;
  bool static_secrets = 6;
}

// The past-tense cache-lane fact surfaced per accelerated build.
message CacheLaneObservedRecord {
  string build_id = 1;
  string provider_id = 2;
  uint64 run_id = 3;
  string cache_lane = 4;
  string source = 5;
}
