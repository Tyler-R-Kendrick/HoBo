syntax = "proto3";

package hobo.registry.v1;

// Wire shapes for the @hobo/registry catalog service (docs/plans/0017 F24):
// the untrusted bundle manifest the ingest boundary parses, the
// registry.BundleImported fact body it produces, the SLSA-shaped provenance
// statement the verifier consumes, and the search-index entry the pure
// in-memory index ranks. Design-time contract artifacts.

message BundleCapability {
  string port = 1; // e.g. hobo:kv
  repeated string features = 2;
}

message BundleManifest {
  string schema = 1; // hobo.registry.bundle-manifest/v1
  string name = 2;
  string version = 3;
  string provider = 4;
  repeated BundleCapability capabilities = 5;
  string description = 6;
}

// Fact body of registry.BundleImported (event-families.md `registry.*`).
message BundleImported {
  string schema = 1;
  string name = 2;
  string version = 3;
  string provider = 4;
  repeated string ports = 5;
  string manifest_digest = 6; // sha256:<hex> over the canonical manifest
}

message ProvenanceSubject {
  string name = 1;
  string sha256 = 2; // hex digest, no algorithm prefix (in-toto DigestSet)
}

message ProvenancePredicate {
  string builder_id = 1;
  string build_type = 2;
}

// SLSA-shaped in-toto statement: subject digests + provenance predicate.
message ProvenanceStatement {
  string statement_type = 1; // https://in-toto.io/Statement/v1 (wire field `_type`)
  repeated ProvenanceSubject subject = 2;
  string predicate_type = 3; // https://slsa.dev/provenance/v1
  ProvenancePredicate predicate = 4;
}

message BundleIndexEntry {
  string name = 1;
  string version = 2;
  string provider = 3;
  repeated string ports = 4;
  string manifest_digest = 5;
}
