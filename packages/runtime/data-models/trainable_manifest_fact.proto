syntax = "proto3";

package hobo.runtime.v1;

// The manifest fact every trainable-method authoring form lowers to
// (ADR-0125): directive, training() wrapper, training.define(), and the
// @trainable decorator all produce this record for manifest collection.

message FieldMetadata {
  string description = 1;
  string example_json = 2;
}

message TrainableManifestFact {
  string method_ref = 1;
  string intent = 2;
  string contract_ref = 3;
  map<string, double> rubric = 4;
  map<string, FieldMetadata> params = 5;
  map<string, FieldMetadata> output = 6;
  repeated string invariants = 7;
  repeated string forbidden_outputs = 8;
  // "body" (hand-written baseline) or "stub" (empty implementation).
  string baseline = 9;
}
