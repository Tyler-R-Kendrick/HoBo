syntax = "proto3";

package hobo.runtime_local.v1;

enum BoundaryMode {
  BOUNDARY_MODE_UNSPECIFIED = 0;
  BOUNDARY_MODE_LIVE = 1;
  BOUNDARY_MODE_MOCK = 2;
  BOUNDARY_MODE_RECORD = 3;
  BOUNDARY_MODE_REPLAY = 4;
  BOUNDARY_MODE_FORK = 5;
  BOUNDARY_MODE_SHADOW = 6;
  BOUNDARY_MODE_FAULT = 7;
}

enum LinkTransport {
  LINK_TRANSPORT_UNSPECIFIED = 0;
  LINK_TRANSPORT_IN_PROCESS = 1;
}

message ComponentDescriptor {
  string id = 1;
  repeated string imports = 2;
  repeated string leases = 3;
}

message ProviderDescriptor {
  string id = 1;
}

message LinkRecord {
  string component_id = 1;
  string import_interface = 2;
  string provider_id = 3;
  string export_interface = 4;
  BoundaryMode boundary_mode = 5;
  LinkTransport transport = 6;
}

message ComponentLoaded {
  string component_id = 1;
  string engine = 2;
}

message LinkEstablished {
  string component_id = 1;
  string import_interface = 2;
  string provider_id = 3;
  string export_interface = 4;
  BoundaryMode boundary_mode = 5;
  LinkTransport transport = 6;
}

message LinkCalled {
  string component_id = 1;
  string import_interface = 2;
  string provider_id = 3;
  string export_interface = 4;
  string operation = 5;
  BoundaryMode boundary_mode = 6;
  LinkTransport transport = 7;
}

message ComponentInvoked {
  string component_id = 1;
  string interface = 2;
  string operation = 3;
}

message ComponentTrapped {
  string component_id = 1;
  string interface = 2;
  string message = 3;
}

message ComponentTornDown {
  string component_id = 1;
}
