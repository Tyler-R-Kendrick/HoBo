syntax = "proto3";

package hobo.runtime_local.v1;

// Snapshot projection cache for queue + clock restart simulation.

message QueueClockSnapshotRecord {
  string version = 1;
  string seed = 2;
  int64 now_ms = 3;
  int32 next_message_seq = 4;
  int32 next_lease_seq = 5;
  int32 next_timer_seq = 6;
  int32 next_fire_seq = 7;
  string snapshot_json = 8;
}
