syntax = "proto3";

package hobo.schematools.v1;

enum CodegenStatus {
  CODEGEN_STATUS_UNSPECIFIED = 0;
  CODEGEN_STATUS_CLEAN = 1;
  CODEGEN_STATUS_DRIFT = 2;
  CODEGEN_STATUS_ERROR = 3;
}

message DriftEntry {
  string path = 1;
  string kind = 2;
}

message CueViolation {
  string package = 1;
  string constraint = 2;
  string message = 3;
}

message CodegenReport {
  CodegenStatus status = 1;
  repeated DriftEntry drift = 2;
  repeated CueViolation cue_violations = 3;
  uint64 duration_ms = 4;
}
