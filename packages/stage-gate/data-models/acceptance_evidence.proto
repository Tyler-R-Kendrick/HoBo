syntax = "proto3";
package hobo.stage_gate.v1;

// What the release gate keeps from one ai-bdd run report
// (.ai-bdd/report/report.json, RunReport schemaVersion 1), ADR-0172.
// Only a report of a frozen, no-agent run with zero model calls becomes one;
// report_digest is the sha256 of the exact bytes that were read. This message
// is the schema of record; a stage-gate record carries the same facts as the
// acceptance-replay check's string evidence (run_id, report_digest,
// scenarios_*, report_exit_code, report_started_at), constrained in
// stage_gate_record.cue.
message AcceptanceEvidence {
  string run_id = 1;
  string report_digest = 2;
  uint32 scenarios_total = 3;
  uint32 passed = 4;
  uint32 healed = 5;
  uint32 failed = 6;
  uint32 inconclusive = 7;
  uint32 blocked = 8;
  uint32 error = 9;
  uint32 skipped = 10;
  uint32 fuzzy_steps = 11;
  uint32 model_calls = 12;
  bool frozen = 13;
  bool no_agent = 14;
  // The exit code ai-bdd wrote into the report: 0 passed, 1 a scenario failed,
  // inconclusive or blocked, 3 infrastructure. 2 and 4 write no report.
  int32 exit_code = 15;
  // ISO 8601, as the report states it. The gate requires it no earlier than
  // its own spawn of `ai-bdd run` (less 5 s of clock skew), and the report's
  // run directory to be new, so an earlier run's report is never this run's.
  string started_at = 16;
}
