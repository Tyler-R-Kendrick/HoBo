syntax = "proto3";
package hobo.stage_gate.v1;

message CheckResult {
  string check_id = 1;
  repeated string command = 2;
  int32 exit_code = 3;
  string status = 4;
  map<string, string> evidence = 5;
}

message ComponentArtifact {
  string digest_sha256 = 1;
  uint64 byte_length = 2;
  string media_type = 3;
}

message SignatureEvidence {
  bool verified = 1;
  string signer_identity = 2;
  string provenance_tier = 3;
  string conformance_report_digest = 4;
}

message StageGateRecord {
  string gate_id = 1;
  string status = 2;
  string repo_commit = 3;
  string ci_run_url = 4;
  string started_at = 5;
  string finished_at = 6;
  repeated CheckResult checks = 7;
  ComponentArtifact artifact = 8;
  SignatureEvidence signature = 9;
}
