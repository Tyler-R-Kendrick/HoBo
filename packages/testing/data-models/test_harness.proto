syntax = "proto3";

package hobo.testing.v1;

// Wire records for the out-of-box app test harness (ADR-0159).
//
// The load-bearing invariant is the fidelity attestation: a handle record is
// meaningless without its ADR-0042 label, and a report that claims
// prod-readiness while an assertion rested on a `mocked` handle is the exact
// overclaim GAP-026 was filed against. The CUE file next to this one makes
// that a constraint rather than a convention.

enum FidelityLabel {
  FIDELITY_LABEL_UNSPECIFIED = 0;
  FIDELITY_LABEL_REAL = 1;
  FIDELITY_LABEL_SIMULATED = 2;
  FIDELITY_LABEL_MOCKED = 3;
  FIDELITY_LABEL_CAMP_ONLY = 4;
}

enum LaneKind {
  LANE_KIND_UNSPECIFIED = 0;
  LANE_KIND_IN_PROCESS = 1;
  LANE_KIND_EPHEMERAL_CAMP = 2;
}

message ResourceHandleRecord {
  string alias = 1;
  string kind = 2;
  FidelityLabel fidelity = 3;
  // Present only when a listener was actually opened for this alias.
  string endpoint = 4;
}

message FidelityAssertionRecord {
  string alias = 1;
  FidelityLabel fidelity = 2;
}

message FidelityReportRecord {
  map<string, uint32> by_fidelity = 1;
  repeated FidelityAssertionRecord asserted_against = 2;
  // False whenever any entry in asserted_against is mocked.
  bool prod_readiness_claimable = 3;
}

message DeployedGraphRecord {
  string contract = 1;
  string stage = 2;
  LaneKind lane = 3;
  repeated ResourceHandleRecord handles = 4;
  FidelityReportRecord fidelity = 5;
  // Reverse-dependency teardown order the lane will walk.
  repeated string teardown_order = 6;
}

// Typed refusal. Locators only: no credential value ever enters this record.
message HarnessRefusalRecord {
  string code = 1;
  string message = 2;
  string remediation = 3;
}
