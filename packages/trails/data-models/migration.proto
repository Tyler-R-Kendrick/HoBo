syntax = "proto3";

package hobo.trails.v1;

// Live migration executor shapes (ADR-0032 §3-5, ADR-0080 §2): the
// migration.* event family, upgrade preflight records (HOBO-430 M0 /
// HOBO-499 M1), and the pooled→siloed tenant-move protocol. Language-neutral
// schema reference for the architecture guard; not compiled at runtime.

message CompatibilityInputsRecord {
  string current_version = 1;
  string target_version = 2;
  string deployment_mode = 3; // hosted-control-plane | self-host-yard | local-dev-runtime | sdk-package | data-shape
  string component_host_pin = 4;
  string manifest_version = 5;
  string contract_compatibility = 6; // supported | unsupported | needs-review
  string data_schema_posture = 7; // none | expand-only | expand-backfill | expand-backfill-contract
  string provider_state_dependency = 8;
  string backup_prerequisite = 9;
  string rollback_evidence_ref = 10;
  string support_handoff_owner = 11;
}

message RollbackEvidenceRecord {
  string state = 1; // available | unavailable | required-before-execution | recoverable
  string immutable_set_ref = 2;
  string snapshot_ref = 3;
  string restore_prerequisite = 4;
  string blocked_restore_reason = 5;
  string escalation_owner = 6;
}

message MigrationPlanRecord {
  string migration_id = 1;
  repeated string expand = 2;
  repeated string backfill = 3;
  repeated string contract = 4;
  string verify_after_backfill = 5;
  string verify_after_contract = 6;
}

message CompatGateEvidenceRecord {
  string gate_id = 1;
  repeated string consumers_on_old_shape = 2;
  string verified_at = 3;
}

message MigrationPlannedEventData {
  string migration_id = 1;
  repeated string phases = 2;
  string planned_at = 3;
}

message MigrationSnapshotTakenEventData {
  string migration_id = 1;
  string snapshot_ref = 2;
  string taken_at = 3;
}

message MigrationPhaseAppliedEventData {
  string migration_id = 1;
  string phase = 2; // expand | backfill | contract
  uint32 statements = 3;
  uint32 changes = 4;
  string applied_at = 5;
}

message MigrationVerifiedEventData {
  string migration_id = 1;
  string point = 2; // after-backfill | after-contract
  string verified_at = 3;
}

message MigrationCutOverEventData {
  string migration_id = 1;
  string cut_over_at = 2;
}

message MigrationRolledBackEventData {
  string migration_id = 1;
  string reason = 2;
  string snapshot_ref = 3;
  string rolled_back_at = 4;
}

message MigrationFailedEventData {
  string migration_id = 1;
  string reason = 2;
  string failed_at = 3;
}

message MigrationExportedEventData {
  string tenant = 1;
  string export_id = 2;
  uint32 head_seq = 3;
  uint32 stream_count = 4;
  string exported_at = 5;
}

message MigrationImportedEventData {
  string tenant = 1;
  string export_id = 2;
  uint32 imported_head_seq = 3;
  uint32 stream_count = 4;
  string imported_at = 5;
}
