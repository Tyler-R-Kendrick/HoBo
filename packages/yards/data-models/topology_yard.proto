syntax = "proto3";

package hobo.yards.v1;

// Yard is the provider-specific topology boundary.
// provider_id is authored on the Yard (not derived from camps).
// camps may be empty (requested shape before live instance).
message YardTopology {
  string name = 1;
  string provider_id = 2;
  string runtime_id = 3;
  repeated string regions = 4;
  repeated string require = 5;
  repeated string prefer = 6;
  repeated string camp_ids = 7;
  map<string, string> labels = 8;
}
