# Notifies the release agent (vgd-skills-agent on Vercel) of every push to
# main. The agent regenerates pixel-palette's skills changelog via PR and
# drafts the Discord announcement for approval in Telegram.
# Requires repo Actions settings: secret EVE_TRIGGER_SECRET + variable
# EVE_AGENT_URL. Source of truth for this file:
# eve-agents/vgd-skills-agent/templates/vgd-skills-trigger.yml
name: Notify release agent
on:
  push:
    branches: [main]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger release agent
        env:
          EVE_AGENT_URL: ${{ vars.EVE_AGENT_URL }}
          EVE_TRIGGER_SECRET: ${{ secrets.EVE_TRIGGER_SECRET }}
        run: |
          curl -sf -X POST "$EVE_AGENT_URL/triggers/github-push" \
            -H "content-type: application/json" \
            -H "authorization: Bearer $EVE_TRIGGER_SECRET" \
            -d '{
              "repository": "${{ github.repository }}",
              "ref": "${{ github.ref_name }}",
              "before": "${{ github.event.before }}",
              "after": "${{ github.sha }}"
            }'
