syntax = "proto3";

package hobo.closurebuilder.resources.v1;

message ClosureBuilderResourceManifest {
  string bindle_name = 1;
  repeated ClosureBuilderResource resources = 2;
  repeated ClosureBuilderRelationship relationships = 3;
}

message ClosureBuilderResource {
  string generated_id = 1;
  string kind = 2;
  string owner_bindle_id = 3;
  ClosureBuilderWorkloadDescriptor workload = 4;
  repeated string annotation_kinds = 5;
}

message ClosureBuilderWorkloadDescriptor {
  string kind = 1;
}

message ClosureBuilderRelationship {
  string from = 1;
  string to = 2;
  string verb = 3;
}

message ClosureBuilderEvidenceEvent {
  string event_id = 1;
  string event_type = 2;
  string issue_id = 3;
  ClosureBuilderResourceManifest manifest = 4;
}
