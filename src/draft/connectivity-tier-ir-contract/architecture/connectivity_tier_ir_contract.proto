syntax = "proto3";

package hobo.draft.v1;

// Architecture-guard evidence: protobuf data shapes the Connectivity Tier Ir Contract draft package
// reasons about. Documents the records/objects this package owns so the
// architecture guard has a language-neutral schema reference. Not compiled at
// runtime; this is a design-time contract artifact.

enum ConnectivityTierIrContractEvidenceKind {
  EVIDENCE_KIND_UNSPECIFIED = 0;
  EVIDENCE_KIND_DESIGN_RECORD = 1;
  EVIDENCE_KIND_CONTRACT_TEST = 2;
}

message ConnectivityTierIrContractRecord {
  string issue = 1;
  string summary = 2;
  repeated string evidence = 3;
}
