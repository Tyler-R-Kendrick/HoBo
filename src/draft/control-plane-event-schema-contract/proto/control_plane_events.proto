syntax = "proto3";

package hobo.control_plane.events.v1;

message ControlPlaneEvent {
  string id = 1;
  string type = 2;
  uint32 schema_version = 3;
  string tenant = 4;
  uint64 seq = 5;
  string time = 6;
  ActorRef actor = 7;
  string correlation_id = 8;
  string causation_id = 9;
  bytes data_json = 10;
}

message ActorRef {
  string kind = 1;
  string id = 2;
}

message DeploymentPlanned {
  bytes plan_json = 1;
  string plan_hash = 2;
}

message MatchDecided {
  string resource_id = 1;
  string winner = 2;
  repeated RankedDefinition ranking = 3;
  repeated RejectedCandidate rejected_candidates = 4;
  string objective = 5;
  bool tie = 6;
  string catalog_content_hash = 7;
}

message RankedDefinition {
  string definition_id = 1;
  uint32 specificity = 2;
  int32 priority = 3;
  double objective_score = 4;
  uint32 rank = 5;
  string region = 6;
  string rationale = 7;
}

message RejectedCandidate {
  string definition_id = 1;
  string reason = 2;
}

message DispatchDecided {
  string dispatch_id = 1;
  string category = 2;
  string selected_provider = 3;
  string objective = 4;
  LedgerInput ledger_input = 5;
  repeated DispatchCandidate candidates = 6;
}

message LedgerInput {
  string view = 1;
  uint64 seq = 2;
  string reservation_id = 3;
  string balance_hash = 4;
}

message DispatchCandidate {
  string provider = 1;
  double effective_marginal_cost = 2;
  string rationale = 3;
}

message DeploymentPlanRejected {
  string deployment_id = 1;
  string reason = 2;
}

message SetCreated {
  string set_id = 1;
  string camp_id = 2;
  string content_hash = 3;
}

message DeltaOpened {
  string delta_id = 1;
  string base_set_id = 2;
}

message DeltaUpdated {
  string delta_id = 1;
  bytes operations_json = 2;
}

message DeltaApplied {
  string delta_id = 1;
  string resulting_set_id = 2;
}

message ResourceFact {
  string resource_id = 1;
  bytes data_json = 2;
}

message ExecFact {
  string exec_id = 1;
  bytes data_json = 2;
}

message DeploymentRolledBack {
  string deployment_id = 1;
  string target_set_id = 2;
  string reason = 3;
}

message DeploymentDeployed {
  string deployment_id = 1;
  string set_id = 2;
  repeated string resource_ids = 3;
}
