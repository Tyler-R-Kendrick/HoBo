syntax = "proto3";

package hobo.draft.v1;

// Architecture-guard evidence: protobuf data shapes the Customer Assurance Evidence Packet
// Contract draft package reasons about. This is a design-time contract artifact.

enum CustomerAssuranceReadinessState {
  CUSTOMER_ASSURANCE_READINESS_STATE_UNSPECIFIED = 0;
  CUSTOMER_ASSURANCE_READINESS_STATE_ACCEPTED = 1;
  CUSTOMER_ASSURANCE_READINESS_STATE_NEEDS_OWNER_REVIEW = 2;
  CUSTOMER_ASSURANCE_READINESS_STATE_BLOCKED_UNAVAILABLE = 3;
  CUSTOMER_ASSURANCE_READINESS_STATE_EXPLICIT_LAUNCH_LIMITATION = 4;
}

enum CustomerAssuranceLegalArtifactDisposition {
  CUSTOMER_ASSURANCE_LEGAL_ARTIFACT_DISPOSITION_UNSPECIFIED = 0;
  CUSTOMER_ASSURANCE_LEGAL_ARTIFACT_DISPOSITION_READY = 1;
  CUSTOMER_ASSURANCE_LEGAL_ARTIFACT_DISPOSITION_LAUNCH_BLOCKER = 2;
  CUSTOMER_ASSURANCE_LEGAL_ARTIFACT_DISPOSITION_EXPLICIT_LAUNCH_LIMITATION = 3;
}

message CustomerAssuranceSection {
  string id = 1;
  string owner = 2;
  string source_evidence = 3;
  CustomerAssuranceReadinessState beta_readiness = 4;
  CustomerAssuranceReadinessState ga_readiness = 5;
  string customer_message = 6;
}

message CustomerAssuranceLegalArtifact {
  string id = 1;
  bool available = 2;
  CustomerAssuranceLegalArtifactDisposition disposition = 3;
  string owner = 4;
  string customer_safe_status = 5;
}

message CustomerAssuranceEvidencePacketRecord {
  string issue = 1;
  repeated CustomerAssuranceSection sections = 2;
  repeated CustomerAssuranceLegalArtifact legal_artifacts = 3;
  repeated string evidence = 4;
}
