syntax = "proto3";

package hobo.draft.v1;

// Architecture-guard evidence: protobuf data shapes the Environment Lifecycle
// Scope draft package reasons about. Documents the records/objects this package
// owns so the architecture guard has a language-neutral schema reference. Not
// compiled at runtime; this is a design-time contract artifact.

enum EnvironmentLifecycleScopeEvidenceKind {
  ENVIRONMENT_LIFECYCLE_SCOPE_EVIDENCE_KIND_UNSPECIFIED = 0;
  ENVIRONMENT_LIFECYCLE_SCOPE_EVIDENCE_KIND_DESIGN_RECORD = 1;
  ENVIRONMENT_LIFECYCLE_SCOPE_EVIDENCE_KIND_CONTRACT_TEST = 2;
  ENVIRONMENT_LIFECYCLE_SCOPE_EVIDENCE_KIND_REFERENCE_FIXTURE = 3;
  ENVIRONMENT_LIFECYCLE_SCOPE_EVIDENCE_KIND_AUDIT_FIXTURE = 4;
  ENVIRONMENT_LIFECYCLE_SCOPE_EVIDENCE_KIND_SUPPORT_HANDOFF = 5;
}

message EnvironmentLifecycleScopeRecord {
  string issue = 1;
  string project = 2;
  string phase = 3;
  string goal = 4;
  repeated EnvironmentLifecycleBoundary boundaries = 5;
  repeated EnvironmentLifecycleEvidence required_evidence = 6;
}

message EnvironmentLifecycleBoundary {
  string id = 1;
  string owner = 2;
  string promise = 3;
}

message EnvironmentLifecycleEvidence {
  string id = 1;
  string owner = 2;
  string proof = 3;
}
