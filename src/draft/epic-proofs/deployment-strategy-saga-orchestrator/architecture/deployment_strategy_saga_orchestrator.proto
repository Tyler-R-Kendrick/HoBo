syntax = "proto3";

package hobo.draft.v1;

// Architecture-guard evidence: protobuf data shapes the Deployment Strategy Saga
// Orchestrator draft package reasons about.

enum DeploymentStrategyKind {
  DEPLOYMENT_STRATEGY_UNSPECIFIED = 0;
  DEPLOYMENT_STRATEGY_RECREATE = 1;
  DEPLOYMENT_STRATEGY_BLUE_GREEN = 2;
  DEPLOYMENT_STRATEGY_CANARY = 3;
  DEPLOYMENT_STRATEGY_PROGRESSIVE = 4;
}

message DeploymentStrategySagaOrchestratorRecord {
  string issue = 1;
  string summary = 2;
  repeated string evidence = 3;
}
