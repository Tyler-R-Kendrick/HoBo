syntax = "proto3";

package hobo.draft.v1;

// Architecture-guard evidence: protobuf data shapes the S5 Stage Gate Forge Extensibility
// draft package reasons about. Design-time contract artifact; not compiled at runtime.

enum S5StageGateForgeExtensibilityEvidenceKind {
  EVIDENCE_KIND_UNSPECIFIED = 0;
  EVIDENCE_KIND_DESIGN_RECORD = 1;
  EVIDENCE_KIND_CONTRACT_TEST = 2;
}

message S5StageGateForgeExtensibilityRecord {
  string issue = 1;
  string summary = 2;
  repeated string evidence = 3;
}
