syntax = "proto3";

package hobo.draft.stage_6_acceptance_gate.v1;

// Architecture-guard evidence for HOBO-665 Stage-6 acceptance drill.

enum StageGateStatus {
  STAGE_GATE_STATUS_UNSPECIFIED = 0;
  STAGE_GATE_STATUS_PASS = 1;
  STAGE_GATE_STATUS_FAIL = 2;
}

enum AcceptanceCheckId {
  ACCEPTANCE_CHECK_UNSPECIFIED = 0;
  CANARY_AUTO_ROLLBACK = 1;
  PLAN_TIME_COST_TOLERANCE = 2;
  DR_REBUILD_RTO = 3;
  DASHBOARD_A11Y_AUDITS = 4;
  GOVERNANCE_EVIDENCE = 5;
  PRIOR_STAGE_GATES = 6;
}

message PriorStageGateRecord {
  string stage = 1;
  StageGateStatus status = 2;
  string evidence_ref = 3;
}

message GovernanceEvidenceItem {
  string id = 1;
  bool passed = 2;
  string detail = 3;
}

message Stage6AcceptanceCheck {
  AcceptanceCheckId id = 1;
  StageGateStatus status = 2;
  string detail = 3;
}

message Stage6AcceptanceDrillResult {
  string issue = 1;
  bool ok = 2;
  repeated Stage6AcceptanceCheck checks = 3;
  repeated PriorStageGateRecord prior_gates = 4;
  repeated GovernanceEvidenceItem governance = 5;
  bool v1_ga_checklist_complete = 6;
}
