syntax = "proto3";

package hobo.draft.vibe_example_gap_closure.v1;

message VibeChildIssue {
  string id = 1;
  string title = 2;
  string project = 3;
  string phase = 4;
  uint32 estimate = 5;
  string target_package_path = 6;
  string proof_note_path = 7;
  repeated string artifact_slices = 8;
  repeated string required_scenarios = 9;
  repeated string proof_modes = 10;
  repeated string source_design_docs = 11;
  repeated string scope_out = 12;
}

message VibeGapClosureBacklog {
  string parent_issue = 1;
  string parent_title = 2;
  repeated VibeChildIssue child_issues = 3;
  string unblock_rule = 4;
}

message VibeGapClosureEvaluation {
  bool ok = 1;
  repeated string violations = 2;
  string unblock_outcome = 3;
}
