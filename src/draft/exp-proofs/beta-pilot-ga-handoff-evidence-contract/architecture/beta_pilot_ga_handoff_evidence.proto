syntax = "proto3";

package hobo.draft.v1;

// Architecture-guard evidence: protobuf data shapes for the HOBO-477 beta
// pilot GA handoff evidence contract. This is a design-time schema artifact,
// not a runtime compilation target.

enum BetaPilotGaEvidenceStatus {
  BETA_PILOT_GA_EVIDENCE_STATUS_UNSPECIFIED = 0;
  BETA_PILOT_GA_EVIDENCE_STATUS_ACCEPTED = 1;
  BETA_PILOT_GA_EVIDENCE_STATUS_ACCEPTED_RISK = 2;
  BETA_PILOT_GA_EVIDENCE_STATUS_MISSING = 3;
}

enum BetaPilotGaProofMode {
  BETA_PILOT_GA_PROOF_MODE_UNSPECIFIED = 0;
  BETA_PILOT_GA_PROOF_MODE_DESIGN_RECORD = 1;
  BETA_PILOT_GA_PROOF_MODE_ISSUE_STATE = 2;
  BETA_PILOT_GA_PROOF_MODE_MANUAL_REVIEW = 3;
  BETA_PILOT_GA_PROOF_MODE_RELEASE_CUTLINE = 4;
}

enum BetaPilotGaLaunchRiskEffect {
  BETA_PILOT_GA_LAUNCH_RISK_EFFECT_UNSPECIFIED = 0;
  BETA_PILOT_GA_LAUNCH_RISK_EFFECT_UNCHANGED = 1;
  BETA_PILOT_GA_LAUNCH_RISK_EFFECT_INCREASED = 2;
  BETA_PILOT_GA_LAUNCH_RISK_EFFECT_REDUCED = 3;
}

message BetaPilotGaEvidenceItem {
  string id = 1;
  string owner_project = 2;
  string source = 3;
  BetaPilotGaProofMode proof_mode = 4;
  BetaPilotGaEvidenceStatus status = 5;
  string acceptance_bullet = 6;
}

message BetaPilotGaBlocker {
  string id = 1;
  string owner_project = 2;
  string state = 3;
  string source_evidence_id = 4;
  string disposition = 5;
}

message BetaPilotGaAcceptedRisk {
  string id = 1;
  string owner_project = 2;
  string mitigation = 3;
  BetaPilotGaLaunchRiskEffect launch_risk_effect = 4;
}

message BetaPilotGaCutlineDependency {
  string id = 1;
  string owner_project = 2;
  string readiness_domain = 3;
  string cutline_category = 4;
  string source = 5;
}

message BetaPilotGaFollowUp {
  string id = 1;
  string evidence_id = 2;
  string owner_project = 3;
  string reason = 4;
}

message BetaPilotGaInitiativeStatusGate {
  string parent_initiative = 1;
  BetaPilotGaLaunchRiskEffect launch_risk_change = 2;
  bool status_update_required = 3;
  string update_source = 4;
}

message BetaPilotGaPublicClaimGuard {
  string id = 1;
  string claim = 2;
  string evidence_id = 3;
  string disposition = 4;
}

message BetaPilotGaHandoffEvidenceRecord {
  string issue = 1;
  string project = 2;
  string phase = 3;
  string milestone = 4;
  repeated BetaPilotGaEvidenceItem evidence = 5;
  repeated BetaPilotGaBlocker blockers = 6;
  repeated BetaPilotGaAcceptedRisk accepted_risks = 7;
  repeated BetaPilotGaCutlineDependency release_cutline_dependencies = 8;
  repeated BetaPilotGaFollowUp follow_ups = 9;
  BetaPilotGaInitiativeStatusGate initiative_status = 10;
  repeated string scope_out = 11;
  repeated BetaPilotGaPublicClaimGuard public_claim_guards = 12;
}
