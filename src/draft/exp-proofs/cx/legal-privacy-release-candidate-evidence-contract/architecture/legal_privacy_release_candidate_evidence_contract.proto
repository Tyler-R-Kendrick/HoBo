syntax = "proto3";

package hobo.draft.legal_privacy_release_candidate;

// Architecture-guard evidence: protobuf data shapes the Legal Privacy Release
// Candidate Evidence Contract draft package reasons about. Documents the
// records/objects this package owns so the architecture guard has a
// language-neutral schema reference. Not compiled at runtime; this is a
// design-time contract artifact.

enum ReleaseCandidateEvidenceStatus {
  RELEASE_CANDIDATE_EVIDENCE_STATUS_UNSPECIFIED = 0;
  RELEASE_CANDIDATE_EVIDENCE_STATUS_ACCEPTED = 1;
  RELEASE_CANDIDATE_EVIDENCE_STATUS_PENDING = 2;
  RELEASE_CANDIDATE_EVIDENCE_STATUS_MISSING = 3;
}

message LegalPrivacyReleaseCandidateEvidence {
  string issue = 1;
  string parent_issue = 2;
  string phase = 3;
  string milestone_gate = 4;
  repeated string required_evidence_ids = 5;
  repeated string blockers = 6;
  repeated string accepted_risks = 7;
  repeated string cross_project_dependencies = 8;
  repeated string missing_evidence = 9;
  repeated string follow_up_issues = 10;
  repeated string unsupported_public_claims = 11;
  bool parent_status_updated = 12;
  bool cutline_limitations_visible = 13;
}
