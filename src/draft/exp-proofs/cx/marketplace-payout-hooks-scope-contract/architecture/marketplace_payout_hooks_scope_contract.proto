syntax = "proto3";

package hobo.draft.v1;

// Architecture-guard evidence: protobuf data shapes the Marketplace Payout
// Hooks Scope Contract draft package reasons about. Documents the
// records/objects this package owns so the architecture guard has a
// language-neutral schema reference. Not compiled at runtime; this is a
// design-time contract artifact.

enum MarketplacePayoutHooksScopeContractEvidenceKind {
  MARKETPLACE_PAYOUT_EVIDENCE_KIND_UNSPECIFIED = 0;
  MARKETPLACE_PAYOUT_EVIDENCE_KIND_DESIGN_RECORD = 1;
  MARKETPLACE_PAYOUT_EVIDENCE_KIND_CONTRACT_TEST = 2;
  MARKETPLACE_PAYOUT_EVIDENCE_KIND_COMPLIANCE_REVIEW = 3;
  MARKETPLACE_PAYOUT_EVIDENCE_KIND_SUPPORT_HANDOFF = 4;
}

message MarketplacePayoutHooksScopeContractRecord {
  string issue = 1;
  string summary = 2;
  repeated string payout_hook_states = 3;
  repeated string evidence = 4;
}
