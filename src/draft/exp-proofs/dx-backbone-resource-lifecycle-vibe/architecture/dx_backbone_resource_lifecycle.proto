syntax = "proto3";

package hobo.draft.dx_backbone_resource_lifecycle.v1;

message DxBackboneRecord {
  string issue = 1;
  string target_package = 2;
  string proof_note = 3;
  repeated DesignAnchor design_anchors = 4;
  repeated ProofMode proof_modes = 5;
  repeated ChildSlice child_slices = 6;
  repeated DownstreamConsumerGate downstream_gates = 7;
  repeated string scope_out = 8;
}

message DesignAnchor {
  string source = 1;
  string reason = 2;
}

message ChildSlice {
  string issue = 1;
  string title = 2;
  string phase = 3;
  string target_package = 4;
  string proof_note = 5;
  repeated string coverage = 6;
  repeated string depends_on = 7;
  repeated string scope_out = 8;
}

message DownstreamConsumerGate {
  string consumer = 1;
  repeated string must_consume = 2;
  string source_material = 3;
  bool invent_behavior = 4;
}

enum ProofMode {
  PROOF_MODE_UNSPECIFIED = 0;
  PROOF_MODE_LIVE = 1;
  PROOF_MODE_SIMULATED = 2;
  PROOF_MODE_REFERENCE_FIXTURE = 3;
  PROOF_MODE_SCOPE_OUT = 4;
}
