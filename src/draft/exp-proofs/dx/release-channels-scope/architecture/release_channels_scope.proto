syntax = "proto3";

package hobo.draft.v1;

// Architecture-guard evidence: protobuf data shapes the Release Channels Scope
// draft package reasons about. Documents the records/objects this package owns
// so the architecture guard has a language-neutral schema reference. Not
// compiled at runtime; this is a design-time contract artifact.

enum ReleaseChannelsScopeEvidenceKind {
  RELEASE_CHANNELS_SCOPE_EVIDENCE_KIND_UNSPECIFIED = 0;
  RELEASE_CHANNELS_SCOPE_EVIDENCE_KIND_DESIGN_RECORD = 1;
  RELEASE_CHANNELS_SCOPE_EVIDENCE_KIND_CONTRACT_TEST = 2;
  RELEASE_CHANNELS_SCOPE_EVIDENCE_KIND_REFERENCE_FIXTURE = 3;
  RELEASE_CHANNELS_SCOPE_EVIDENCE_KIND_AUDIT_FIXTURE = 4;
  RELEASE_CHANNELS_SCOPE_EVIDENCE_KIND_SUPPORT_HANDOFF = 5;
}

message ReleaseChannelsScopeRecord {
  string issue = 1;
  string project = 2;
  string phase = 3;
  string goal = 4;
  repeated ReleaseChannelsBoundary boundaries = 5;
  repeated ReleaseChannelsEvidence required_evidence = 6;
}

message ReleaseChannelsBoundary {
  string id = 1;
  string owner = 2;
  string promise = 3;
}

message ReleaseChannelsEvidence {
  string id = 1;
  string owner = 2;
  string proof = 3;
}
