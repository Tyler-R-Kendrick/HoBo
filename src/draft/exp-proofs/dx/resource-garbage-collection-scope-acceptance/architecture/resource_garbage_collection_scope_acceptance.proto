syntax = "proto3";

package hobo.draft.v1;

// Architecture-guard evidence: protobuf data shapes the Resource Garbage
// Collection Scope Acceptance draft package reasons about. Documents the
// records/objects this package owns so the architecture guard has a
// language-neutral schema reference. Not compiled at runtime; this is a
// design-time contract artifact.

enum ResourceGarbageCollectionCleanupState {
  CLEANUP_STATE_UNSPECIFIED = 0;
  CLEANUP_STATE_SUSPECTED = 1;
  CLEANUP_STATE_INVENTORIED = 2;
  CLEANUP_STATE_QUARANTINED = 3;
  CLEANUP_STATE_ELIGIBLE = 4;
  CLEANUP_STATE_SWEPT = 5;
  CLEANUP_STATE_ESCALATED = 6;
}

message ResourceGarbageCollectionScopeRecord {
  string issue = 1;
  string summary = 2;
  repeated string garbage_classes = 3;
  repeated string required_evidence = 4;
  repeated string m1_evidence = 5;
}
