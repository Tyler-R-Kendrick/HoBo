syntax = "proto3";

package hobo.draft.v1;

// Architecture-guard evidence: protobuf data shapes the Publisher Portal Scope
// Contract draft package reasons about. Documents the records/objects this
// package owns so the architecture guard has a language-neutral schema
// reference. Not compiled at runtime; this is a design-time contract artifact.

enum PublisherPortalScopeEvidenceKind {
  EVIDENCE_KIND_UNSPECIFIED = 0;
  EVIDENCE_KIND_DESIGN_RECORD = 1;
  EVIDENCE_KIND_CONTRACT_TEST = 2;
  EVIDENCE_KIND_REFERENCE_FIXTURE = 3;
  EVIDENCE_KIND_SUPPORT_HANDOFF = 4;
  EVIDENCE_KIND_RELEASE_GATE = 5;
}

message PublisherPortalScopeRecord {
  string issue = 1;
  string project = 2;
  string phase = 3;
  string summary = 4;
  repeated string personas = 5;
  repeated string portal_states = 6;
  repeated string m1_evidence = 7;
}
