syntax = "proto3";

package hobo.troubleshooting_guides_scope_acceptance.v1;

message TroubleshootingGuidesScope {
  string issue = 1;
  string project = 2;
  string phase = 3;
  string goal = 4;
  repeated Persona personas = 5;
  repeated string scope_in = 6;
  repeated string scope_out = 7;
  repeated string non_goals = 8;
  BoundarySet boundaries = 9;
  repeated Dependency dependencies = 10;
  repeated InitiativeDependency initiative_dependencies = 11;
  repeated EvidenceRequirement m1_evidence = 12;
  FollowUpGate follow_up_gate = 13;
}

message Persona {
  string role = 1;
  string need = 2;
}

message BoundarySet {
  string service = 1;
  string ux = 2;
  string security = 3;
  string support = 4;
}

message Dependency {
  string source = 1;
  string reason = 2;
}

message InitiativeDependency {
  string owner = 1;
  string consumes = 2;
  string scope_boundary = 3;
}

message EvidenceRequirement {
  string kind = 1;
  string owner = 2;
  string proof_mode = 3;
  string proves = 4;
}

message FollowUpGate {
  string allowed_after = 1;
  string blocked_before = 2;
}

enum TroubleshootingHandoffOwner {
  TROUBLESHOOTING_HANDOFF_OWNER_UNSPECIFIED = 0;
  TROUBLESHOOTING_HANDOFF_OWNER_GUIDES = 1;
  TROUBLESHOOTING_HANDOFF_OWNER_SUPPORT_WORKFLOW = 2;
  TROUBLESHOOTING_HANDOFF_OWNER_INCIDENT_COMMUNICATIONS = 3;
  TROUBLESHOOTING_HANDOFF_OWNER_PUBLIC_STATUS_PAGE = 4;
}
