syntax = "proto3";

package hobo.draft.v1;

// Architecture-guard evidence: protobuf data shapes the Tutorials & Walkthroughs Scope Acceptance
// draft package reasons about. Documents the records/objects this package owns so the architecture
// guard has a language-neutral schema reference. Not compiled at runtime; this is a design-time
// contract artifact.

enum TutorialsWalkthroughsScopeAcceptanceEvidenceKind {
  TUTORIALS_WALKTHROUGHS_EVIDENCE_KIND_UNSPECIFIED = 0;
  TUTORIALS_WALKTHROUGHS_EVIDENCE_KIND_DESIGN_RECORD = 1;
  TUTORIALS_WALKTHROUGHS_EVIDENCE_KIND_CONTRACT_TEST = 2;
  TUTORIALS_WALKTHROUGHS_EVIDENCE_KIND_REFERENCE_FIXTURE = 3;
  TUTORIALS_WALKTHROUGHS_EVIDENCE_KIND_AGENT_FIXTURE = 4;
  TUTORIALS_WALKTHROUGHS_EVIDENCE_KIND_SUPPORT_HANDOFF = 5;
  TUTORIALS_WALKTHROUGHS_EVIDENCE_KIND_ACCESSIBILITY_NOTE = 6;
}

message TutorialsWalkthroughsScopeAcceptanceRecord {
  string issue = 1;
  string summary = 2;
  repeated string evidence = 3;
}
