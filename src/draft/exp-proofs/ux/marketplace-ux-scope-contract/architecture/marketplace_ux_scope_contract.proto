syntax = "proto3";

package hobo.draft.v1;

// Architecture-guard evidence: protobuf data shapes the Marketplace UX Scope
// Contract draft package reasons about. Documents the records/objects this
// package owns so the architecture guard has a language-neutral schema
// reference. Not compiled at runtime; this is a design-time contract artifact.

enum MarketplaceUxScopeContractEvidenceKind {
  MARKETPLACE_UX_EVIDENCE_KIND_UNSPECIFIED = 0;
  MARKETPLACE_UX_EVIDENCE_KIND_DESIGN_RECORD = 1;
  MARKETPLACE_UX_EVIDENCE_KIND_CONTRACT_TEST = 2;
  MARKETPLACE_UX_EVIDENCE_KIND_REFERENCE_FIXTURE = 3;
  MARKETPLACE_UX_EVIDENCE_KIND_ACCESSIBILITY_REVIEW = 4;
  MARKETPLACE_UX_EVIDENCE_KIND_SUPPORT_HANDOFF = 5;
  MARKETPLACE_UX_EVIDENCE_KIND_LAUNCH_CLAIM_REVIEW = 6;
}

message MarketplaceUxScopeContractRecord {
  string issue = 1;
  string summary = 2;
  repeated string listing_states = 3;
  repeated string installability_outcomes = 4;
  repeated string evidence = 5;
}
