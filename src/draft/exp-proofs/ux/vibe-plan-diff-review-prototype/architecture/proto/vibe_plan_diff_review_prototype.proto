syntax = "proto3";

package hobo.draft.vibe_plan_diff_review_prototype.v1;

message SourceDependency {
  string issue = 1;
  string title = 2;
  string status = 3;
  string evidence = 4;
}

message QuickstartFixtureRef {
  string source_issue = 1;
  string fixture_id = 2;
  string proof_mode = 3;
  string consuming_surface = 4;
  string plan_diff_use = 5;
}

message AnnotationRef {
  string source_issue = 1;
  string fixture_id = 2;
  string annotation_case = 3;
  string display_group = 4;
  string severity = 5;
  string proof_mode = 6;
}

message SupportHandoff {
  string issue = 1;
  string source_issue = 2;
  string correlation_id = 3;
  string customer_safe_wording = 4;
  repeated string visible_fields = 5;
  repeated string withheld_fields = 6;
  string owner_route = 7;
  string next_action = 8;
  bool live_ticket_created = 9;
}

message GoldenFixture {
  string state = 1;
  string surface = 2;
  string source_issue = 3;
  string source_fixture_id = 4;
  string plan_review_state_id = 5;
  string evidence_source = 6;
  string owner = 7;
  string safe_next_action = 8;
  string risk_category = 9;
  string policy_disposition = 10;
  string cost_disposition = 11;
  string capacity_disposition = 12;
  string customer_safe_wording = 13;
  string proof_mode = 14;
  repeated AnnotationRef annotation_refs = 15;
  SupportHandoff support_handoff = 16;
}

message Scenario {
  string id = 1;
  string title = 2;
  repeated string golden_states = 3;
  repeated string proof_mode_labels = 4;
  string safe_outcome = 5;
}

message Prototype {
  string issue = 1;
  string phase = 2;
  string target_package = 3;
  string proof_note = 4;
  repeated string design_refs = 5;
  repeated SourceDependency source_dependencies = 6;
  repeated QuickstartFixtureRef quickstart_fixture_refs = 7;
  repeated GoldenFixture golden_fixtures = 8;
  repeated Scenario scenarios = 9;
  repeated string accessibility_notes = 10;
  repeated string scope_out = 11;
}
