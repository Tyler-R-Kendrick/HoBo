syntax = "proto3";

package hobo.draft.v1;

// Architecture-guard evidence for the HOBO-564 support case prototype.
// This is design-time proof data, not generated production runtime code.

enum VibeSupportCaseProofMode {
  VIBE_SUPPORT_CASE_PROOF_MODE_UNSPECIFIED = 0;
  VIBE_SUPPORT_CASE_PROOF_MODE_LIVE = 1;
  VIBE_SUPPORT_CASE_PROOF_MODE_SIMULATED = 2;
  VIBE_SUPPORT_CASE_PROOF_MODE_REFERENCE_FIXTURE = 3;
  VIBE_SUPPORT_CASE_PROOF_MODE_SCOPE_OUT = 4;
}

message ConsumedSupportWorkflowMockupRef {
  string source_issue = 1;
  string mockup_id = 2;
  string source_proof_path = 3;
  string support_case_use = 4;
}

message SupportCaseEvidencePack {
  string id = 1;
  string support_case_state = 2;
  string customer_safe_summary = 3;
  string severity = 4;
  string owner_route = 5;
  repeated string consumed_mockup_ids = 6;
  repeated string redacted_logs = 7;
  repeated string incident_refs = 8;
  repeated string support_refs = 9;
  string admin_context = 10;
  string docs_source = 11;
  string proof_package_link = 12;
  string redaction_state = 13;
  string next_update_condition = 14;
  VibeSupportCaseProofMode proof_mode = 15;
}

message SupportCaseScenarioPath {
  string id = 1;
  string narrative = 2;
  repeated string evidence_pack_ids = 3;
  string safe_outcome = 4;
}

message VibeSupportCaseRedactedEvidenceRecord {
  string issue = 1;
  string phase = 2;
  string package_path = 3;
  string proof_path = 4;
  repeated string design_refs = 5;
  repeated ConsumedSupportWorkflowMockupRef consumed_support_workflow_mockup_refs = 6;
  repeated SupportCaseEvidencePack evidence_packs = 7;
  repeated SupportCaseScenarioPath scenario_paths = 8;
  repeated string accessibility_notes = 9;
  repeated string scope_out = 10;
}
