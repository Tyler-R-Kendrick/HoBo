syntax = "proto3";

package hobo.draft.exp_proofs.vibe_marketplace_installability_mockups.v1;

message VibeMarketplaceInstallabilityMockups {
  string issue = 1;
  string phase = 2;
  string package_path = 3;
  string proof_path = 4;
  repeated string design_refs = 5;
  repeated MarketplaceQuickstartFixtureReference quickstart_fixture_refs = 6;
  repeated string personas = 7;
  repeated MarketplaceWireframe wireframes = 8;
  repeated MarketplaceListingFixture fixtures = 9;
  repeated MarketplaceScenarioPath scenario_paths = 10;
  repeated string accessibility_notes = 11;
  repeated string scope_out = 12;
}

message MarketplaceQuickstartFixtureReference {
  string source_issue = 1;
  string fixture_id = 2;
  string proof_mode = 3;
  string consuming_surface = 4;
  string marketplace_use = 5;
}

message MarketplaceWireframe {
  string id = 1;
  string surface = 2;
  string title = 3;
  repeated string personas = 4;
  repeated string questions_answered = 5;
  repeated string fixture_ids = 6;
}

message MarketplaceListingFixture {
  string state = 1;
  string fixture_id = 2;
  string visible_state = 3;
  string evidence_source = 4;
  string owner_route = 5;
  string customer_safe_message = 6;
  string org_catalog_disposition = 7;
  string proof_mode = 8;
  string trust_evidence = 9;
  string support_handoff = 10;
}

message MarketplaceScenarioPath {
  string id = 1;
  string narrative = 2;
  repeated string fixture_ids = 3;
  repeated string proof_mode_labels = 4;
  string accessibility_note = 5;
  string safe_outcome = 6;
}
