syntax = "proto3";

package hobo.draft.exp_proofs.vibe_role_tutorial_outlines.v1;

message VibeRoleTutorialOutlines {
  string issue = 1;
  string phase = 2;
  string package_path = 3;
  string proof_path = 4;
  repeated string design_refs = 5;
  repeated string roles = 6;
  repeated TutorialQuickstartFixtureRef quickstart_fixture_refs = 7;
  repeated TutorialCoverage coverage_paths = 8;
  repeated RoleTutorialOutline outlines = 9;
  repeated string scope_out = 10;
}

message TutorialQuickstartFixtureRef {
  string source_issue = 1;
  string fixture_id = 2;
  string proof_mode = 3;
  string tutorial_use = 4;
}

message TutorialCoverage {
  string id = 1;
  string evidence = 2;
  repeated string outline_roles = 3;
}

message RoleTutorialOutline {
  string role = 1;
  string walkthrough_anchor = 2;
  string persona_goal = 3;
  repeated string prerequisites = 4;
  repeated string command_path = 5;
  repeated string mcp_tools = 6;
  string fixture_strategy = 7;
  repeated string expected_outputs = 8;
  string failure_branch = 9;
  repeated string proof_mode_labels = 10;
  repeated string quickstart_fixture_ids = 11;
  repeated string accessibility_notes = 12;
  string support_handoff = 13;
}
