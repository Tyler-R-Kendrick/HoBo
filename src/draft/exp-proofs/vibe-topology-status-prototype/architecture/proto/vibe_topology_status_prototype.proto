syntax = "proto3";

package hobo.draft.vibe_topology_status_prototype.v1;

message SourceDependency {
  string issue = 1;
  string title = 2;
  string status = 3;
  string evidence = 4;
}

message QuickstartFixtureRef {
  string source_issue = 1;
  string fixture_id = 2;
  string proof_mode = 3;
  string consuming_surface = 4;
  string topology_use = 5;
}

message Surface {
  string id = 1;
  string title = 2;
  repeated string consumes_from = 3;
  string operating_question = 4;
}

message SupportHandoff {
  string issue = 1;
  string source_issue = 2;
  string correlation_id = 3;
  string customer_safe_wording = 4;
  repeated string visible_fields = 5;
  repeated string withheld_fields = 6;
  string owner_route = 7;
  string next_action = 8;
  bool live_ticket_created = 9;
}

message Snapshot {
  string state = 1;
  string surface = 2;
  string source_issue = 3;
  string source_fixture_id = 4;
  string projection_source = 5;
  string freshness_label = 6;
  string tenant_rbac_disposition = 7;
  string safe_next_action = 8;
  string proof_mode = 9;
  optional SupportHandoff support_handoff = 10;
}

message Scenario {
  string id = 1;
  string title = 2;
  repeated string snapshot_states = 3;
  repeated string proof_mode_labels = 4;
  string safe_outcome = 5;
}

message Prototype {
  string issue = 1;
  string phase = 2;
  string target_package = 3;
  string proof_note = 4;
  repeated string design_refs = 5;
  repeated SourceDependency source_dependencies = 6;
  repeated Surface surfaces = 7;
  repeated Snapshot snapshots = 8;
  repeated Scenario scenarios = 9;
  repeated string accessibility_notes = 10;
  repeated string scope_out = 11;
  repeated QuickstartFixtureRef quickstart_fixture_refs = 12;
}
