syntax = "proto3";

package hobo.draft.v1;

// Architecture-guard evidence: protobuf data shapes for the HOBO-528
// adversarial Meta-cloud Broker rejection matrix proof.

enum BrokerRejectionMatrixCase {
  BROKER_REJECTION_MATRIX_CASE_UNSPECIFIED = 0;
  BROKER_REJECTION_MATRIX_CASE_STALE_CATALOG = 1;
  BROKER_REJECTION_MATRIX_CASE_INCOMPATIBLE_MAPPING = 2;
  BROKER_REJECTION_MATRIX_CASE_AMBIGUOUS_MAPPING = 3;
  BROKER_REJECTION_MATRIX_CASE_MISSING_MAPPING = 4;
  BROKER_REJECTION_MATRIX_CASE_UNSUPPORTED_CAPABILITY = 5;
}

enum BrokerRejectionMatrixCode {
  BROKER_REJECTION_MATRIX_CODE_UNSPECIFIED = 0;
  BROKER_REJECTION_MATRIX_CODE_CATALOG_STALE = 1;
  BROKER_REJECTION_MATRIX_CODE_MAPPING_INCOMPATIBLE = 2;
  BROKER_REJECTION_MATRIX_CODE_MAPPING_AMBIGUOUS = 3;
  BROKER_REJECTION_MATRIX_CODE_MAPPING_MISSING = 4;
  BROKER_REJECTION_MATRIX_CODE_CAPABILITY_UNSUPPORTED = 5;
}

enum BrokerBlockedOptimism {
  BROKER_BLOCKED_OPTIMISM_UNSPECIFIED = 0;
  BROKER_BLOCKED_OPTIMISM_BEST_EFFORT_SELECTION = 1;
  BROKER_BLOCKED_OPTIMISM_STALE_CATALOG_OPTIMISM = 2;
  BROKER_BLOCKED_OPTIMISM_PROVIDER_DEFAULT_FALLBACK = 3;
  BROKER_BLOCKED_OPTIMISM_HIDDEN_YARD_PLANNING = 4;
}

message BrokerRejectionReplayInputs {
  string manifest_digest = 1;
  string environment_digest = 2;
  string catalog_snapshot_digest = 3;
}

message BrokerRejectionReason {
  BrokerRejectionMatrixCode code = 1;
  string message = 2;
  repeated string details = 3;
  string remediation_hint = 4;
  repeated BrokerBlockedOptimism blocked_optimism = 5;
  bool support_safe = 6;
}

message BrokerRejectionSupportEvidence {
  string evidence_id = 1;
  string resource_id = 2;
  string interface = 3;
  string manifest_digest = 4;
  string environment_digest = 5;
  string catalog_snapshot_digest = 6;
  string customer_safe_summary = 7;
}

message BrokerResolutionRejectionMatrixEntry {
  string schema = 1;
  string rejection_id = 2;
  string resolution_authority = 3;
  BrokerRejectionMatrixCase case_id = 4;
  BrokerRejectionReason reason = 5;
  BrokerRejectionReplayInputs replay_inputs = 6;
  BrokerRejectionSupportEvidence support_evidence = 7;
  bool fallback_attempted = 8;
  bool yard_planning_allowed = 9;
  bool partial_receipt_emitted = 10;
  string digest = 11;
  string signature = 12;
}

message BrokerRejectionMatrix {
  string schema = 1;
  string issue = 2;
  repeated BrokerResolutionRejectionMatrixEntry rejections = 3;
}
