syntax = "proto3";

package hobo.draft.finops.plane.v1;

// Design-time contract for the S6-06 FinOps plane project POC.
// Runtime tests use handwritten TypeScript parsers derived from these records
// and the sibling CUE constraints.

message PlanCostEstimate {
  string schema_version = 1;
  double projected_monthly_usd = 2;
  string currency = 3;
  repeated CostLineItem line_items = 4;
  repeated string assumptions = 5;
}

message CostLineItem {
  string resource_id = 1;
  string dimension = 2;
  double quantity = 3;
  double unit_price_usd = 4;
  double line_cost_usd = 5;
}

message FinOpsDeployGateDecision {
  string effect = 1;
  string reason = 2;
  double cost_estimate_usd = 3;
  repeated string violations = 4;
  repeated string obligations = 5;
}

message ShowbackReconciliation {
  string schema_version = 1;
  double metering_total_usd = 2;
  double showback_total_usd = 3;
  bool reconciled = 4;
  repeated ShowbackRowSummary rows = 5;
}

message ShowbackRowSummary {
  string kind = 1;
  string id = 2;
  double cost_usd = 3;
}
