syntax = "proto3";

package hobo.draft.v1;

// Architecture-guard evidence: protobuf data shapes the Support & Debug Tools
// Scope draft package reasons about. Documents the records/objects this package
// owns so the architecture guard has a language-neutral schema reference. Not
// compiled at runtime; this is a design-time contract artifact.

enum SupportDebugToolsEvidenceKind {
  SUPPORT_DEBUG_TOOLS_EVIDENCE_KIND_UNSPECIFIED = 0;
  SUPPORT_DEBUG_TOOLS_EVIDENCE_KIND_DESIGN_RECORD = 1;
  SUPPORT_DEBUG_TOOLS_EVIDENCE_KIND_CONTRACT_TEST = 2;
  SUPPORT_DEBUG_TOOLS_EVIDENCE_KIND_REFERENCE_FIXTURE = 3;
  SUPPORT_DEBUG_TOOLS_EVIDENCE_KIND_AUDIT_FIXTURE = 4;
  SUPPORT_DEBUG_TOOLS_EVIDENCE_KIND_SUPPORT_HANDOFF = 5;
  SUPPORT_DEBUG_TOOLS_EVIDENCE_KIND_POLICY_FIXTURE = 6;
  SUPPORT_DEBUG_TOOLS_EVIDENCE_KIND_REPLAY_FIXTURE = 7;
}

message SupportDebugDiagnosticBundleClass {
  string id = 1;
  string owner = 2;
  repeated string event_families = 3;
  bool customer_visible = 4;
  bool redaction_required = 5;
  repeated string safe_fields = 6;
}

message SupportDebugRecoveryRoute {
  string id = 1;
  string owner = 2;
  string trigger = 3;
  string safe_next_action = 4;
  bool mutation_allowed = 5;
}

message SupportDebugToolsScopeRecord {
  string issue = 1;
  string summary = 2;
  repeated string personas = 3;
  repeated SupportDebugDiagnosticBundleClass diagnostic_bundles = 4;
  repeated SupportDebugRecoveryRoute recovery_routes = 5;
  repeated string evidence = 6;
}
