syntax = "proto3";

package hobo.draft.v1;

// Architecture-guard evidence for the ActorHost runtime port draft package (HOBO-21 / HOBO-595).

message LeaseInfo {
  string key = 1;
  string holder_id = 2;
  uint64 fence_token = 3;
  string expires_at = 4;
}

message ActorEventRecord {
  string stream_id = 1;
  uint64 seq = 2;
  string type = 3;
  uint64 fence_token = 4;
  string holder_id = 5;
  string appended_at = 6;
  bytes payload = 7;
}

message AppendReceipt {
  string stream_id = 1;
  uint64 seq = 2;
  uint64 fence_token = 3;
}

message ActorStateSnapshot {
  string stream_id = 1;
  uint64 snapshot_seq = 2;
  string saved_at = 3;
}

message ActorHostConfig {
  uint64 lease_ttl_ms = 1;
}
