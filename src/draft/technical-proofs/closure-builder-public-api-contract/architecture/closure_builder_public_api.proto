syntax = "proto3";

package hobo.closurebuilder.v1;

message ClosureBuilderContract {
  string package_name = 1;
  string bindle_signature = 2;
  string bindle_role = 3;
  string app_host_owner = 4;
  string runtime_host_behavior = 5;
  repeated string relationship_verbs = 6;
  repeated BuilderFactory builder_factories = 7;
}

message BuilderFactory {
  string name = 1;
  bool accepts_resource_name = 2;
  string identity_source = 3;
  string alias_role = 4;
}

message ClosureBuilderEvidenceEvent {
  string event_id = 1;
  string event_type = 2;
  string issue_id = 3;
  ClosureBuilderContract contract = 4;
}
