syntax = "proto3";

package hobo.conformance.v1;

// Protobuf-first records for the @hobo/conformance port-suite harness.
// Runtime TypeScript types derive from these shapes at the parse boundary.

message PortSuite {
  string schema = 1;
  string id = 2;
  PortRef port = 3;
  CoverageRequirements coverage = 4;
  repeated SuiteCase cases = 5;
}

message PortRef {
  string wit = 1;
  repeated string functions = 2;
}

message CoverageRequirements {
  repeated string required_functions = 1;
}

message SuiteCase {
  string id = 1;
  string tier = 2;
  repeated string exercises = 3;
  SuiteCall call = 4;
  SuiteExpect expect = 5;
}

message SuiteCall {
  string function = 1;
  bytes input_json = 2;
}

message SuiteExpect {
  bytes output_json = 1;
  bytes golden_ir_json = 2;
  bytes replay_trace_json = 3;
}

message PortSuiteReport {
  string schema = 1;
  bool ok = 2;
  string suite_id = 3;
  string port = 4;
  string adapter_id = 5;
  string seed = 6;
  RunProvenance provenance = 7;
  AdapterClaim claim = 8;
  repeated CaseAssertion assertions = 9;
  CoverageManifest coverage = 10;
  repeated ConformanceFailure failures = 11;
}

message RunProvenance {
  string suite_id = 1;
  string port = 2;
  string adapter_id = 3;
  string seed = 4;
  repeated string cases = 5;
}

message AdapterClaim {
  string status = 1;
  string port = 2;
  string adapter_id = 3;
  repeated string failure_codes = 4;
}

message CaseAssertion {
  string code = 1;
  string case_id = 2;
  string function = 3;
}

message ValueDiff {
  string path = 1;
  string expected_json = 2;
  string actual_json = 3;
}

message ConformanceFailure {
  string code = 1;
  string case_id = 2;
  string function = 3;
  string seed = 4;
  string path = 5;
  string language = 6;
  repeated string categories = 7;
  repeated string functions = 8;
  string message = 9;
  ValueDiff diff = 10;
}

message CoverageManifest {
  repeated string exercised_functions = 1;
  repeated string required_functions = 2;
  repeated string unexercised_functions = 3;
}

message SdkParityReport {
  string schema = 1;
  bool ok = 2;
  string language = 3;
  repeated ConformanceFailure failures = 4;
}

message ConformanceRunEvent {
  string type = 1;
  string suite_id = 2;
  string port = 3;
  string adapter_id = 4;
  string seed = 5;
  repeated string case_ids = 6;
  string case_id = 7;
  string function = 8;
  string tier = 9;
  bool skipped = 10;
  repeated CaseAssertion assertions = 11;
  repeated ConformanceFailure failures = 12;
  CoverageManifest coverage = 13;
  bool ok = 14;
  repeated string failure_codes = 15;
}
