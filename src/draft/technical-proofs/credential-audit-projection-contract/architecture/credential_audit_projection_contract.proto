syntax = "proto3";

package hobo.draft.v1;

// Architecture-guard evidence: protobuf data shapes the Credential Audit Projection
// Contract draft package reasons about.

enum CredentialAuditProjectionContractEvidenceKind {
  EVIDENCE_KIND_UNSPECIFIED = 0;
  EVIDENCE_KIND_DESIGN_RECORD = 1;
  EVIDENCE_KIND_CONTRACT_TEST = 2;
}

message CredentialAuditProjectionContractRecord {
  string issue = 1;
  string summary = 2;
  repeated string evidence = 3;
}

message CredentialAuditTimelineEntry {
  int64 seq = 1;
  string time = 2;
  string type = 3;
  string event_id = 4;
  string grant_id = 5;
  string usage_id = 6;
}

message CredentialAuditViewSnapshot {
  string view = 1;
  int64 seq = 2;
  string digest = 3;
  repeated CredentialAuditTimelineEntry timeline_entries = 4;
}
