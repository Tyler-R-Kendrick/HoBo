syntax = "proto3";

package hobo.draft.v1;

// Architecture-guard evidence: protobuf data shapes the Gatekeeper v1 draft package
// reasons about. Design-time contract artifact; not compiled at runtime.

enum GatekeeperV1EvidenceKind {
  EVIDENCE_KIND_UNSPECIFIED = 0;
  EVIDENCE_KIND_DEPLOY_VERIFICATION = 1;
  EVIDENCE_KIND_CONTRACT_TEST = 2;
}

message GatekeeperV1DeployVerificationRecord {
  string issue = 1;
  string summary = 2;
  repeated string evidence = 3;
}
