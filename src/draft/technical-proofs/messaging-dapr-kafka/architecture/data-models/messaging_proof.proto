syntax = "proto3";

package hobo.draft.messaging_dapr_kafka.v1;

// Proof scenario wire records for ADR-0138 technical proof.

message ProofRun {
  string scenario = 1; // native-kafka | dapr-kafka | actor-dual | junction-federation
  bool ok = 2;
  string fidelity = 3; // simulated | live
  string notes = 4;
}

message AcceptanceRow {
  uint32 id = 1;
  string scenario = 2;
  bool ok = 3;
}
