syntax = "proto3";

package hobo.draft.v1;

// Architecture-guard evidence for HOBO-641 Resource Definitions + Matching + Packs POC.

message ResourceDefinitionsMatchingPacksRecord {
  string issue = 1;
  string summary = 2;
  repeated string evidence = 3;
}

message MatchDecidedEvidence {
  string definition_id = 1;
  int32 specificity_score = 2;
  string catalog_content_hash = 3;
}

message DeploymentSetPromotion {
  string set_id = 1;
  string content_address = 2;
  repeated string incremental_nodes = 3;
}

message MultiCloudPlanDecision {
  string camp_id = 1;
  string provider = 2;
  string definition_id = 3;
  int32 winner_score = 4;
}
