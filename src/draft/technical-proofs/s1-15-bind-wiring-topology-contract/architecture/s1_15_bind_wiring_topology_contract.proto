syntax = "proto3";

package hobo.draft.v1;

message Link {
  string import = 1;
  string to = 2;
}

message BindingMeta {
  string port = 1;
  string resource = 2;
  string client_type = 3;
}

message ProviderSelection {
  string kind = 1;
  string provider_id = 2;
  string selector = 3;
}

message CampTopology {
  string id = 1;
  string env = 2;
  string env_type = 3;
  string provider_id = 4;
  repeated string resolution_order = 5;
}

message YardTopology {
  string name = 1;
  string provider_id = 2;
}

message S1_15BindWiringTopologyRecord {
  string issue = 1;
  string summary = 2;
  repeated string evidence = 3;
}
