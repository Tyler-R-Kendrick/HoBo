syntax = "proto3";

package hobo.cli.v1;

message CodegenEnvelope {
  bool ok = 1;
  string command = 2;
  string mode = 3;
  bool drift = 4;
  repeated string layout = 5;
  repeated string checked = 6;
  repeated string written = 7;
}

message CodegenDriftEntry {
  string path = 1;
  string status = 2;
  string expected_digest = 3;
  string actual_digest = 4;
}
