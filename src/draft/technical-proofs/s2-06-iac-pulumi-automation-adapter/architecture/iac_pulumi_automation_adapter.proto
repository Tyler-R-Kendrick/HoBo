syntax = "proto3";

package hobo.draft.v1;

enum IacPulumiAutomationAdapterEvidenceKind {
  EVIDENCE_KIND_UNSPECIFIED = 0;
  EVIDENCE_KIND_DESIGN_RECORD = 1;
  EVIDENCE_KIND_CONTRACT_TEST = 2;
}

message IacPulumiAutomationAdapterRecord {
  string issue = 1;
  string summary = 2;
  repeated string evidence = 3;
  string stack_model = 4;
}
