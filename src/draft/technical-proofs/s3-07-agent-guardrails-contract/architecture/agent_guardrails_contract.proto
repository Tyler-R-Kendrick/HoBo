syntax = "proto3";

package hobo.draft.v1;

// Architecture-guard evidence: protobuf data shapes the S3-07 Agent Guardrails
// Contract draft package reasons about.

enum AgentGuardrailsContractEvidenceKind {
  EVIDENCE_KIND_UNSPECIFIED = 0;
  EVIDENCE_KIND_DESIGN_RECORD = 1;
  EVIDENCE_KIND_CONTRACT_TEST = 2;
}

message AgentGuardrailsContractRecord {
  string issue = 1;
  string summary = 2;
  repeated string evidence = 3;
}
