syntax = "proto3";

package hobo.draft.v1;

// Architecture-guard evidence: protobuf data shapes the S4 Stage Gate Multi Cloud Contract
// draft package reasons about.

enum S4StageGateMultiCloudContractEvidenceKind {
  EVIDENCE_KIND_UNSPECIFIED = 0;
  EVIDENCE_KIND_DRILL_RECORD = 1;
  EVIDENCE_KIND_ACCEPTANCE_ATTACHMENT = 2;
}

message S4StageGateMultiCloudContractRecord {
  string issue = 1;
  string summary = 2;
  repeated string evidence = 3;
}
