syntax = "proto3";

package hobo.draft.v1;

// Architecture-guard evidence for the S6-02 control-plane HA contract draft package.

enum ControlPlaneHaEvidenceKind {
  EVIDENCE_KIND_UNSPECIFIED = 0;
  EVIDENCE_KIND_QUORUM_APPEND = 1;
  EVIDENCE_KIND_LEADER_FAILOVER = 2;
  EVIDENCE_KIND_PROVIDER_RESILIENCE = 3;
}

message ControlPlaneHaContractRecord {
  string issue = 1;
  string summary = 2;
  repeated string evidence = 3;
}

message QuorumFencedAppend {
  string stream_id = 1;
  uint64 seq = 2;
  uint64 fence_token = 3;
  string event_type = 4;
}

message LeaderFailoverOutcome {
  string leader_node = 1;
  string successor_node = 2;
  uint32 recovery_ms = 3;
  bool duplicate_actions_blocked = 4;
}
