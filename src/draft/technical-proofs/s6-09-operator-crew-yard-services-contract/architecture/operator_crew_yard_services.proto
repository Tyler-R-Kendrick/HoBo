syntax = "proto3";

package hobo.draft.v1;

// Architecture-guard evidence for the S6-09 Operator Crew Yard Services draft
// package. Design-time contract artifact — not compiled at runtime.

enum OperatorCrewYardServicesEvidenceKind {
  EVIDENCE_KIND_UNSPECIFIED = 0;
  EVIDENCE_KIND_DESIGN_RECORD = 1;
  EVIDENCE_KIND_CONTRACT_TEST = 2;
}

message OperatorCrewYardServicesRecord {
  string issue = 1;
  string summary = 2;
  repeated string evidence = 3;
}

message CrewPrincipalRef {
  string agent_id = 1;
  string svid = 2;
  string policy_id = 3;
}

message CredentialAuditEntry {
  string agent_id = 1;
  string svid = 2;
  string action = 3;
  string token_grant_id = 4;
  string ts = 5;
}
