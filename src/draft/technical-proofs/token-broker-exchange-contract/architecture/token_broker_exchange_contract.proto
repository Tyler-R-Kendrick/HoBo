syntax = "proto3";

package hobo.draft.v1;

enum TokenBrokerExchangeEvidenceKind {
  EVIDENCE_KIND_UNSPECIFIED = 0;
  EVIDENCE_KIND_DESIGN_RECORD = 1;
  EVIDENCE_KIND_CONTRACT_TEST = 2;
}

message TokenBrokerExchangeRecord {
  string issue = 1;
  string summary = 2;
  repeated string evidence = 3;
}

message BrokerExchangeError {
  string code = 1;
  string reason = 2;
}

message BrokeredCredential {
  string token_ref = 1;
  string expires_at = 2;
  bool brokered = 3;
}
