syntax = "proto3";

package hobo.draft.v1;

// Architecture-guard evidence for the wit-port-stub-contract draft package.

message WitPortStubContractRecord {
  string issue = 1;
  string summary = 2;
  repeated string evidence = 3;
}

message StubRecordedTraceEntry {
  string function_name = 1;
  string input_json = 2;
  string output_json = 3;
}

message StubRecordedTrace {
  string schema = 1;
  repeated StubRecordedTraceEntry entries = 2;
}
